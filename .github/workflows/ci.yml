name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt -r infrastructure/requirements.txt

      - name: Run tests
        # Bare pytest from the repo root: pytest.ini's testpaths pulls in BOTH
        # tests/ and infrastructure/tests/. Naming only tests/ here silently
        # skipped the 141 CDK template/guardrail tests.
        run: python -m pytest -q
