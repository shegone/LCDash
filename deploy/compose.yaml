name: lcdash-platform

x-lcdash-environment: &lcdash-environment
  CENTRALSQUARE_TOKEN_URL: https://api-wv-logan-911.centralsquarecloudgov.com/api/token
  CENTRALSQUARE_CAD_BASE_URL: https://api-wv-logan-911.centralsquarecloudgov.com/api/cad/v1
  CENTRALSQUARE_SYSTEM_BASE_URL: https://api-wv-logan-911.centralsquarecloudgov.com/api/system/v1
  CENTRALSQUARE_USERNAME_FILE: /run/secrets/centralsquare_username
  CENTRALSQUARE_PASSWORD_FILE: /run/secrets/centralsquare_password
  CENTRALSQUARE_WEBHOOK_SECRET_FILE: /run/secrets/centralsquare_webhook_secret
  CENTRALSQUARE_FROM_HEADER: LCDash-Logan911
  DATABASE_URL_FILE: /run/secrets/database_url
  WEBHOOK_MAX_BODY_BYTES: "1048576"
  REALTIME_HEARTBEAT_SECONDS: "15"
  LCDASH_DEBUG: "false"
  ANALYTICS_INITIAL_LOOKBACK_HOURS: "24"
  ANALYTICS_OVERLAP_MINUTES: "120"
  ANALYTICS_MAX_CALLS_PER_RUN: "250"
  ANALYTICS_REQUEST_DELAY_MS: "100"
  EMS_SUPERVISOR_UNIT_NUMBERS: EMS101,EMS102,EMS103,EMS104,EMS105,EMS106,EMS107,EMS108,EMS109
  EMS_DELAY_ALERT_ENABLED: "true"
  # Keep migration/staging deployments non-delivering until the final cutover.
  EMS_DELAY_ALERT_MODE: dry_run
  EMS_DELAY_THRESHOLD_MINUTES: "30"
  EMS_DELAY_REPEAT_MINUTES: "30"
  EMS_DELAY_POLL_SECONDS: "60"
  EMS_DELAY_RUN_COMMAND_ID: "96"
  EMS_DELAY_MESSAGE_TYPE_ID: "16"
  EMS_DELAY_MESSAGE_TYPE_DESCRIPTION: LCDash MAE EMS Delay Alert
  EMS_DELAY_TRANSFER_CODES: TRANSFER,911TRANS
  EMS_DELAY_SCHEDULED_CODES: PRESCHED
  EMS_RESPONSE_AGENCIES: LEASA
  EMS_UNIT_PREFIXES: MED,EMS
  OLLAMA_BASE_URL: http://ollama:11434
  MAE_MODEL: qwen3.5:27b
  MAE_REQUEST_TIMEOUT_SECONDS: "120"
  MAE_EMBEDDING_MODEL: nomic-embed-text
  MAE_EMBEDDING_TIMEOUT_SECONDS: "45"
  KNOWLEDGE_SEMANTIC_CANDIDATES: "5000"
  KNOWLEDGE_SOURCE_DIR: /knowledge/centralsquare
  KNOWLEDGE_INDEX_INTERVAL_SECONDS: "3600"
  MINDSHARE_KNOWLEDGE_SOURCE_DIR: /knowledge/mindshare
  MINDSHARE_KNOWLEDGE_INDEX_INTERVAL_SECONDS: "3600"
  VOICE_BASE_URL: http://speaches:8000
  VOICE_TTS_MODEL: speaches-ai/Kokoro-82M-v1.0-ONNX
  VOICE_TTS_VOICE: af_heart
  VOICE_STT_MODEL: deepdml/faster-whisper-large-v3-turbo-ct2
  VOICE_REQUEST_TIMEOUT_SECONDS: "180"

x-lcdash-secrets: &lcdash-secrets
  - centralsquare_username
  - centralsquare_password
  - database_url
  - centralsquare_webhook_secret

services:
  postgres:
    image: postgres:17
    container_name: lcdash-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lcdash
      POSTGRES_USER: lcdash_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - lcdash_postgres_data:/var/lib/postgresql/data
    networks:
      - lcdash_private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lcdash_user -d lcdash"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  lcdash:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: lcdash-web
    restart: unless-stopped
    user: "1000:1000"
    environment: *lcdash-environment
    secrets: *lcdash-secrets
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - /srv/lcdash-data/documents/centralsquare:/knowledge/centralsquare:ro
      - /srv/lcdash-data/documents/mindshare:/knowledge/mindshare:ro
    networks:
      - lcdash_private
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    security_opt:
      - no-new-privileges:true

  analytics-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: lcdash-analytics-worker
    restart: unless-stopped
    user: "1000:1000"
    command: ["python", "scripts/analytics_worker.py"]
    environment:
      <<: *lcdash-environment
      ANALYTICS_SYNC_INTERVAL_SECONDS: "300"
    secrets: *lcdash-secrets
    networks:
      - lcdash_private
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      disable: true

  ems-delay-alert-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: lcdash-ems-delay-alert-worker
    restart: unless-stopped
    user: "1000:1000"
    command: ["python", "scripts/ems_delay_alert_worker.py"]
    environment: *lcdash-environment
    secrets: *lcdash-secrets
    networks:
      - lcdash_private
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      disable: true

  knowledge-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: lcdash-knowledge-worker
    restart: unless-stopped
    user: "1000:1000"
    command: ["python", "scripts/knowledge_worker.py"]
    environment: *lcdash-environment
    secrets: *lcdash-secrets
    volumes:
      - /srv/lcdash-data/documents/centralsquare:/knowledge/centralsquare:ro
    networks:
      - lcdash_private
    depends_on:
      postgres:
        condition: service_healthy
      ollama-model-loader:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    healthcheck:
      disable: true

  mindshare-knowledge-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: lcdash-mindshare-knowledge-worker
    restart: unless-stopped
    user: "1000:1000"
    command: ["python", "scripts/mindshare_knowledge_worker.py"]
    environment: *lcdash-environment
    secrets: *lcdash-secrets
    volumes:
      - /srv/lcdash-data/documents/mindshare:/knowledge/mindshare:ro
    networks:
      - lcdash_private
    depends_on:
      postgres:
        condition: service_healthy
      ollama-model-loader:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    healthcheck:
      disable: true

  rclone-config-loader:
    image: rclone/rclone:latest
    container_name: lcdash-rclone-config-loader
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - >-
        if [ ! -s /config/rclone/rclone.conf ]; then
          cp /run/secrets/rclone_config_seed /config/rclone/rclone.conf;
        fi;
        chown 1000:1000 /config/rclone /config/rclone/rclone.conf;
        chmod 700 /config/rclone;
        chmod 600 /config/rclone/rclone.conf
    secrets:
      - rclone_config_seed
    volumes:
      - lcdash_rclone_config:/config/rclone
    security_opt:
      - no-new-privileges:true

  knowledge-drive-sync:
    image: rclone/rclone:latest
    container_name: lcdash-knowledge-drive-sync
    restart: unless-stopped
    user: "1000:1000"
    entrypoint: ["/bin/sh", "/opt/lcdash/sync_knowledge_drive.sh"]
    environment:
      KNOWLEDGE_RCLONE_REMOTE: "${KNOWLEDGE_RCLONE_REMOTE:-lcdash-knowledge:Central Squared CAD/pdf}"
      KNOWLEDGE_SYNC_TARGET: /knowledge/centralsquare
      KNOWLEDGE_SYNC_INTERVAL_SECONDS: "900"
    volumes:
      - ../scripts/sync_knowledge_drive.sh:/opt/lcdash/sync_knowledge_drive.sh:ro
      - lcdash_rclone_config:/config/rclone
      - /srv/lcdash-data/documents/centralsquare:/knowledge/centralsquare
    networks:
      - lcdash_private
    depends_on:
      rclone-config-loader:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    healthcheck:
      disable: true

  mindshare-drive-sync:
    image: rclone/rclone:latest
    container_name: lcdash-mindshare-drive-sync
    restart: unless-stopped
    user: "1000:1000"
    entrypoint: ["/bin/sh", "/opt/lcdash/sync_mindshare_drive.sh"]
    environment:
      MINDSHARE_KNOWLEDGE_RCLONE_REMOTE: "${MINDSHARE_KNOWLEDGE_RCLONE_REMOTE:-lcdash-knowledge:Mindshare Documents}"
      MINDSHARE_KNOWLEDGE_SYNC_TARGET: /knowledge/mindshare
      MINDSHARE_KNOWLEDGE_SYNC_INTERVAL_SECONDS: "900"
    volumes:
      - ../scripts/sync_mindshare_drive.sh:/opt/lcdash/sync_mindshare_drive.sh:ro
      - lcdash_rclone_config:/config/rclone
      - /srv/lcdash-data/documents/mindshare:/knowledge/mindshare
    networks:
      - lcdash_private
    depends_on:
      rclone-config-loader:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    healthcheck:
      disable: true

  postgres-backup:
    image: postgres:17
    container_name: lcdash-postgres-backup
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - >-
        while true; do
          /bin/sh /opt/lcdash/backup-postgres.sh;
          sleep 86400;
        done
    environment:
      POSTGRES_DB: lcdash
      POSTGRES_USER: lcdash_user
      POSTGRES_BACKUP_RETENTION_DAYS: "30"
    secrets:
      - postgres_password
    volumes:
      - ./backup-postgres.sh:/opt/lcdash/backup-postgres.sh:ro
      - /srv/lcdash-data/backups:/backups
    networks:
      - lcdash_private
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  ollama:
    image: ollama/ollama:latest
    container_name: lcdash-ollama
    restart: unless-stopped
    gpus: all
    environment:
      OLLAMA_KEEP_ALIVE: "10m"
    volumes:
      - lcdash_ollama_data:/root/.ollama
    networks:
      - lcdash_private
    security_opt:
      - no-new-privileges:true

  ollama-model-loader:
    image: ollama/ollama:latest
    container_name: lcdash-ollama-model-loader
    restart: "no"
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - >-
        ollama pull qwen3:8b &&
        ollama pull qwen3.5:9b &&
        ollama pull qwen3.5:27b &&
        ollama pull nomic-embed-text
    environment:
      OLLAMA_HOST: http://ollama:11434
    networks:
      - lcdash_private
    depends_on:
      ollama:
        condition: service_started
    security_opt:
      - no-new-privileges:true

  speaches:
    image: ghcr.io/speaches-ai/speaches@sha256:6ec12ebf890a17e0d4b242a8ba9e0eb1fb836e60e8a3c857aea9838d541579ac
    container_name: lcdash-speaches
    restart: unless-stopped
    gpus: all
    volumes:
      - lcdash_speaches_models:/home/ubuntu/.cache/huggingface/hub
    networks:
      - lcdash_private
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  voice-model-loader:
    image: ghcr.io/speaches-ai/speaches@sha256:6ec12ebf890a17e0d4b242a8ba9e0eb1fb836e60e8a3c857aea9838d541579ac
    container_name: lcdash-voice-model-loader
    restart: "no"
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - >-
        curl --fail --silent --show-error
        --request POST
        http://speaches:8000/v1/models/speaches-ai/Kokoro-82M-v1.0-ONNX
        &&
        curl --fail --silent --show-error
        --request POST
        http://speaches:8000/v1/models/Systran/faster-distil-whisper-small.en
        &&
        curl --fail --silent --show-error
        --request POST
        http://speaches:8000/v1/models/deepdml/faster-whisper-large-v3-turbo-ct2
    volumes:
      - lcdash_speaches_models:/home/ubuntu/.cache/huggingface/hub
    networks:
      - lcdash_private
    depends_on:
      speaches:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  offsite-backup-sync:
    image: rclone/rclone:latest
    container_name: lcdash-offsite-backup-sync
    restart: unless-stopped
    user: "1000:1000"
    entrypoint: ["/bin/sh", "/opt/lcdash/sync_offsite_backups.sh"]
    environment:
      OFFSITE_BACKUP_SOURCE: /backups
      OFFSITE_BACKUP_REMOTE: lcdash-backup:server-227
      OFFSITE_BACKUP_INTERVAL_SECONDS: "86400"
    volumes:
      - ../scripts/sync_offsite_backups.sh:/opt/lcdash/sync_offsite_backups.sh:ro
      - lcdash_rclone_config:/config/rclone
      - /srv/lcdash-data/backups:/backups
    depends_on:
      rclone-config-loader:
        condition: service_completed_successfully
      postgres-backup:
        condition: service_started
    networks:
      - lcdash_private
    security_opt:
      - no-new-privileges:true

  parakeet-benchmark:
    profiles: ["benchmark"]
    build:
      context: ./parakeet-benchmark
      dockerfile: Dockerfile
    gpus: all
    volumes:
      - lcdash_parakeet_models:/root/.cache/huggingface/hub
      - /srv/lcdash-data/recordings/benchmarks:/audio:ro
    security_opt:
      - no-new-privileges:true

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.0
    container_name: lcdash-open-webui
    restart: unless-stopped
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - >-
        export WEBUI_SECRET_KEY="$$(cat /run/secrets/openwebui_secret_key)";
        export WEBUI_ADMIN_PASSWORD="$$(cat /run/secrets/openwebui_admin_password)";
        terminal_key="$$(cat /run/secrets/open_terminal_api_key)";
        export TERMINAL_SERVER_CONNECTIONS="[{
          \"id\": \"lcdash-local-operator\",
          \"name\": \"LCDash Local Operator\",
          \"enabled\": true,
          \"url\": \"http://open-terminal:8000\",
          \"key\": \"$${terminal_key}\",
          \"auth_type\": \"bearer\",
          \"config\": {\"access_grants\": []}
        }]";
        exec bash /app/backend/start.sh
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_AUTH: "True"
      ENABLE_SIGNUP: "False"
      ENABLE_API_KEYS: "True"
      DEFAULT_USER_ROLE: pending
      WEBUI_ADMIN_EMAIL: admin@logan911.local
      WEBUI_ADMIN_NAME: Logan 911 Administrator
      AUDIO_STT_ENGINE: openai
      AUDIO_STT_OPENAI_API_BASE_URL: http://speaches:8000/v1
      AUDIO_STT_OPENAI_API_KEY: local-speech-service
      AUDIO_STT_MODEL: deepdml/faster-whisper-large-v3-turbo-ct2
      AUDIO_TTS_ENGINE: openai
      AUDIO_TTS_OPENAI_API_BASE_URL: http://speaches:8000/v1
      AUDIO_TTS_OPENAI_API_KEY: local-speech-service
      AUDIO_TTS_MODEL: speaches-ai/Kokoro-82M-v1.0-ONNX
      AUDIO_TTS_VOICE: af_heart
    secrets:
      - openwebui_secret_key
      - openwebui_admin_password
      - open_terminal_api_key
    ports:
      - "127.0.0.1:3000:8080"
    volumes:
      - lcdash_openwebui_data:/app/backend/data
    networks:
      - lcdash_private
    depends_on:
      ollama:
        condition: service_started
      voice-model-loader:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true

  open-terminal:
    image: ghcr.io/open-webui/open-terminal:latest
    container_name: lcdash-open-terminal
    restart: unless-stopped
    environment:
      OPEN_TERMINAL_API_KEY_FILE: /run/secrets/open_terminal_api_key
      OPEN_TERMINAL_FILE_BROWSER_ROOT: /workspace
      OPEN_TERMINAL_INFO: >-
        Logan County LCDash local development operator. Read
        /workspace/LCDash/AGENTS.md before performing project work. The writable
        workspace is a development clone, not the live production checkout.
      OPEN_TERMINAL_MAX_SESSIONS: "8"
      OPEN_TERMINAL_LOG_RETENTION: "2592000"
    secrets:
      - open_terminal_api_key
    volumes:
      - /srv/lcdash-data/agent-workspaces:/workspace
      - lcdash_open_terminal_data:/home/user
    networks:
      - lcdash_private
    security_opt:
      - no-new-privileges:true

  open-webui-computer:
    build:
      context: ./open-webui-computer
      dockerfile: Dockerfile
    image: lcdash-open-webui-computer:2026-08-01
    container_name: lcdash-open-webui-computer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8020:8000"
    volumes:
      - lcdash_open_webui_computer_data:/data
      - /srv/lcdash-data/agent-workspaces/LCDash:/workspace/LCDash
    working_dir: /workspace/LCDash
    networks:
      - lcdash_private
    security_opt:
      - no-new-privileges:true

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: lcdash-cloudflared
    restart: unless-stopped
    user: "1000:1000"
    network_mode: host
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token-file
      - /run/secrets/cloudflare_tunnel_token
    secrets:
      - cloudflare_tunnel_token
    depends_on:
      lcdash:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

networks:
  lcdash_private:
    name: lcdash_private

volumes:
  lcdash_postgres_data:
  lcdash_ollama_data:
  lcdash_openwebui_data:
  lcdash_open_terminal_data:
  lcdash_open_webui_computer_data:
  lcdash_speaches_models:
  lcdash_parakeet_models:
  lcdash_rclone_config:

secrets:
  centralsquare_username:
    file: /srv/lcdash-platform/secrets/centralsquare_username
  centralsquare_password:
    file: /srv/lcdash-platform/secrets/centralsquare_password
  database_url:
    file: /srv/lcdash-platform/secrets/database_url
  centralsquare_webhook_secret:
    file: /srv/lcdash-platform/secrets/centralsquare_webhook_secret
  postgres_password:
    file: /srv/lcdash-platform/secrets/postgres_password
  openwebui_secret_key:
    file: /srv/lcdash-platform/secrets/openwebui_secret_key
  openwebui_admin_password:
    file: /srv/lcdash-platform/secrets/openwebui_admin_password
  open_terminal_api_key:
    file: /srv/lcdash-platform/secrets/open_terminal_api_key
  cloudflare_tunnel_token:
    file: /srv/lcdash-platform/secrets/cloudflare_tunnel_token
  rclone_config_seed:
    file: /srv/lcdash-platform/secrets/rclone.conf
