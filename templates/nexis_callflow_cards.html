ning a fever) — \"lagnat\" is the everyday word callers use for fever."],"asks":[]}],"kind":"interrogation"},{"roman":"II","heading":"PRIMARY (KEY) QUESTIONS","prompts":[{"label":"Days of Fever","lines":["\"Ilang araw na po ang lagnat?\" (How many days has the fever lasted?) Dengue is endemic year-round in the Philippines and surges heavily during the rainy season — get the exact day count, not just \"a few days.\""],"asks":["\"Ilang araw na po ang lagnat?\" (How many days has the fever lasted?) Dengue is endemic year-round in the Philippines and surges heavily during the rainy season — get the exact day count, not just \"a few days.\""]},{"label":"Warning Signs Checklist — ANY ONE = Immediate Transport","lines":["Severe or persistent abdominal pain","Persistent vomiting (unable to keep fluids down)","Bleeding — gums, nose, blood in vomit or stool, unusual bruising","Extreme lethargy, restlessness, or irritability","Cold, clammy skin or cold hands and feet"],"asks":[]},{"label":"Age (Repeat Emphasis)","lines":["Confirm patient age again if not already given — infants and young children can deteriorate faster and show warning signs less clearly than adults."],"asks":[]},{"label":"Prior Dengue Infection","lines":["\"Has the patient had dengue before?\" A second dengue infection is often more severe than the first — flag a \"yes\" answer as a higher-risk case."],"asks":["\"Has the patient had dengue before?\" A second dengue infection is often more severe than the first — flag a \"yes\" answer as a higher-risk case."]}],"kind":"interrogation"},{"roman":"III","heading":"SECONDARY QUESTIONS","prompts":[{"label":"Associated Symptoms","lines":["Ask about rash, joint or muscle pain (\"sakit ng katawan\" / body pain), headache, or pain behind the eyes — common alongside dengue fever, though not warning signs on their own."],"asks":[]},{"label":"Fluid Intake","lines":["Is the patient able to drink and keep fluids down? Any signs of dehydration — dry mouth, sunken eyes, little e if the fever returns before seeking care once a warning sign appears."],"asks":[]},{"label":"Communication","lines":["Stay on the line with the caller if necessary until emergency responders arrive to ensure ongoing assessment and support."],"asks":[]}],"kind":"interrogation"}],"counts":{"sections":4,"prompts":18,"lines":24,"quoted_asks":5},"localize_flags":["[LOCALIZE: example]"]},{"file":"EMS_Diabetic-Problems.html","discipline":"EMS","title":"911 Dispatch Protocol: Diabetic Problems","subtitle":null,"sections":[{"roman":"I","heading":"VITAL SIGNS ASSESSMENT","prompts":[{"label":"Location & Callback — Every Call, First","lines":["“Where is your emergency? Give me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"],"asks":["“Where is your emergency? Give me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"]},{"label":"Age","lines":["How old is the patient?"],"asks":[]},{"label":"Consciousness","lines":["Is the patient alert and able to speak?"],"asks":[]},{"label":"Breathing","lines":["Can the patient breathe normally?"],"asks":[]},{"label":"Gender","lines":["What is the patient's gender?"],"asks":[]}],"kind":"interrogation"},{"roman":"II","heading":"PRIMARY ASSESSMENT QUESTIONS","prompts":[{"label":"Blood Sugar Levels","lines":["Does the patient know their current blood sugar level?"],"asks":[]},{"label":"Symptoms","lines":["What symptoms is the patient experiencing? (e.g., confusion, sweating, shaking, extreme thirst, frequent urination, fatigue)"],"asks":[]},{"label":"Recent Food or Insulin Intake","lines":["When did the patient last eat, and what did they eat?"],"asks":[]}],"kind":"interrogation"},{"roman":"III","heading":"SECONDARY ASSESSMENT QUESTIONS","prompts":[{"label":"History of Diabetes Complications","lines":["Has unknown or unlabeled medication should never be administered."],"asks":[]},{"label":"Identify the Form","step":"5","lines":["Ask what form the epinephrine is in. Most patients in the community carry a prescribed epinephrine ampoule (1 mg/mL) together with a syringe. Some may instead have an auto-injector, such as an EpiPen or similar device. Confirm which one the caller has before continuing."],"asks":[]}]},{"roman":"IV","heading":"AMPOULE + SYRINGE — PREPARING THE DOSE (PRIMARY METHOD)","kind":"procedure","prompts":[{"label":"Draw Up the Prescribed Dose","step":"6","lines":["Guide the caller to draw up the dose their doctor prescribed from the 1 mg/mL ampoule into the syringe. Adults are typically prescribed 0.3 to 0.5 mg; children are prescribed a smaller dose based on their weight, per their own prescription.","Do not calculate or suggest a dose. Instruct the caller to give only the dose written on the patient's own prescription or medication plan."],"asks":[]},{"label":"Prepare the Injection Site","step":"7","lines":["Once the correct dose is drawn up, have the caller expose the patient's outer mid-thigh, moving clothing aside, or injecting through light clothing if there is no time to undress the area."],"asks":[]}]},{"roman":"V","heading":"AMPOULE + SYRINGE — GIVING THE INJECTION (PRIMARY METHOD)","kind":"procedure","prompts":[{"label":"Injection Site and Technique","step":"8","lines":["Direct the caller to inject into the outer mid-thigh muscle, holding the needle steady until the full prescribed dose has been delivered."],"asks":[]},{"label":"Note the Time","step":"9","lines":["Tell the caller to note the time the injection was given. This will be needed for deciding on a second dose and for the responding EMS crew."],"asks":[]},{"label":"Second Dose If No Improvement","step":"10","lines":["If there is no improvement within 5 to 15 minutes and EMS has not yet arrived, and a second prescribed dose is available, the caller may give a second dose following the :"Severity of Injury","lines":["Can the patient move without severe pain? Is there numbness or tingling in any extremities?"],"asks":[]}],"kind":"interrogation"},{"roman":"III","heading":"PRE-ARRIVAL INSTRUCTIONS","prompts":[{"label":"Immobilization","lines":["Advise the caller to keep the patient still and not to move them unless absolutely necessary for safety."],"asks":[]},{"label":"Comfort","lines":["Help the patient find a comfortable position if movement does not increase pain."],"asks":[]},{"label":"Monitoring","lines":["Monitor the patient for changes in pain level and consciousness."],"asks":[]}],"kind":"interrogation"}],"counts":{"sections":3,"prompts":11,"lines":12,"quoted_asks":2},"localize_flags":["[LOCALIZE: example]"]},{"file":"EMS_Fireworks-Mass-Injury.html","discipline":"EMS","title":"911 Dispatch Protocol: Fireworks / Firecracker Injury","subtitle":null,"sections":[{"roman":"I","heading":"Vital / Scene Information","prompts":[{"label":"Location & Callback — Every Call, First","lines":["“Where is your emergency? Give me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"],"asks":["“Where is your emergency? Give me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"]},{"label":"Mass-Injury Check","lines":["Is this happening during the New Year surge period (Dec 21–Jan 5)? Is the patient the only person injured, or are there others hurt nearby — fireworks incidents at gatherings often produce multiple patients from a single event."],"asks":[]},{"label":"Age","lines":["How old is the patient? Note: roughly half of fireworks-injury patients nationwide each season are minors."],"asks":[]},{"label":"Consciousness","lines":["Is the patient alert and responsive?"],"asks":[]},{"label":"Location","lines":["Confirm the exact location using barangay → purok/sitio → landmark."],"asks":[]}],"kind":"interrogation"},{"roman":"II","heading":"Primary (Key) Questions","prompts":[{"label":"Injury Type and Location","lines":["Where is the injury — hand or fingers, eyes, face, or torso? Blast injuries to the hand and fingers, including possible amputation, and eye injuries are the most common serious presentations."],"asks":[]},{"label":"What Caused the Injury","lines":["What kind of firework or firecracker was it, if known? Ask specifically — powerful illegal types such as \"boga\" (an improvised pipe cannon) or oversized \"piccolo\" cause far worse wounds than ordinary small firecrackers, and this affects severity expectations."],"asks":[]},{"label":"Bleeding or Amputation","lines":["Is there heavy bleeding? Has any part of the hand, fingers, or other body part been severed?"],"asks":[]},{"label":"Eye Involvement","lines":["Is either eye affected? Is there pain, vision loss, or a foreign-body sensation?"],"asks":[]}],"kind":"interrogation"},{"roman":"III","heading":"Secondary Questions","prompts":[{"label":"Additional Victims","lines":["Is anyone else at the location injured from the same incident? Ask this even if only one patient has been mentioned."],"asks":[]},{"label":"Burn Extent","lines":["If there are burns, approximately how large an area of the body is affected?"],"asks":[]},{"label":"Tetanus / Wound History","lines":["Note the wound is a puncture/blast-type injury with tetanus risk — flag for the responding team; a vaccination-history question is not a call-taking priority but is useful if the caller volunteers it."],"asks":[]}],"kind":"interrogation"},{"roman":"IV","heading":"Pre-Arrival Instructions","prompts":[{"label":"Bleeding Control","lines":["Apply firm, direct pressure to the wound with a clean cloth. Elevate the injured hand or limb above heart level if possible."],"asks":[]},{"label":"Amputated Parts","lines":["If any part of the hand or fingers has been severed, retrieve it ere any immediate risk of harm to the patient or others?"],"asks":[]},{"label":"Symptoms Displayed","lines":["What symptoms or behaviors is the patient exhibiting? (e.g., agitation, paranoia, depression, disorientation)"],"asks":[]}],"kind":"interrogation"},{"roman":"III","heading":"SECONDARY ASSESSMENT QUESTIONS","prompts":[{"label":"History of Mental Illness","lines":["Does the patient have a known history of mental illness?"],"asks":[]},{"label":"Medication","lines":["Is the patient on any medication for mental health? Are they compliant with their medication?"],"asks":[]},{"label":"Substance Use","lines":["Has the patient used any substances that could be influencing their current state? (e.g., alcohol, drugs)"],"asks":[]}],"kind":"interrogation"},{"roman":"IV","heading":"PRE-ARRIVAL INSTRUCTIONS","prompts":[{"label":"Safety Measures","lines":["Ensure the safety of the patient and others nearby. Remove any potential weapons or dangerous items if safely possible."],"asks":[]},{"label":"Calm Environment","lines":["Help create a calm environment by reducing noise and crowds."],"asks":[]},{"label":"Communication","lines":["Use calm, non-threatening, and supportive language. Engage the patient in conversation if possible and appropriate, and listen to them without judgment."],"asks":[]},{"label":"Non-Escalation","lines":["Avoid arguing or escalating the situation. Affirm the patient’s feelings and concerns and reassure them that help is on the way."],"asks":[]},{"label":"Emergency Response","lines":["Stay on the line with the caller, providing continuous support and instructions. Inform emergency responders of all relevant information regarding the patient’s mental and physical state."],"asks":[]}],"kind":"interrogation"},{"roman":"V","heading":"ADDITIONAL RESOURCES","prompts":[{"label":"NCMH Crisis Hotline — Mental Health Crisis Hotline","lines":["Dispatchers should be aware of the NCMH Crisis Hotline [LOCAL INSERT — current national mental-health crisis line: number(s), hours, and whether the line accepts a warm transfer from a PSAP. Verified as of: ____/____/______ by: ______________]"],"asks":[]}],"kind":"interrogation"}],"counts":{"sections":5,"prompts":17,"lines":18,"quoted_asks":2},"localize_flags":["[LOCALIZE: example]","[LOCAL INSERT — current national mental-health crisis line: number(s), hours, and whether the line accepts a warm transfer from a PSAP. Verified as of: ____/____/______ by: ______________]","[LOCALIZED — US 988 replaced with the PH national mental-health crisis line; number moved to the dated insert, 2026-08-23]"]},{"file":"EMS_Monitoring-ABCs.html","discipline":"EMS","title":"911 Dispatch Protocol: Monitoring ABCs","subtitle":"Skill Script · Step-by-Step Procedure","sections":[{"roman":"I","heading":"INITIAL CALL RECEIPT","kind":"procedure","prompts":[{"label":"Location Confirmation","step":"1","lines":["Quickly confirm the caller's exact location to ensure that emergency services are dispatched accurately and without delay."],"asks":[]},{"label":"Callback Number","lines":["Verify the number the caller is calling from, in case the call is disconnected."],"asks":[]},{"label":"Immediate Situation Assessment","step":"2","lines":["Determine the patient's consciousness and if they have any visible injuries or symptoms."],"asks":[]}]},{"roman":"II","heading":"ASSESSING THE AIRWAY","kind":"procedure","prompts":[{"label":"Ensure the Airway is Open","step":"3","lines":["Conscious Patient: Ask if the patient can speak or cough. This indicates that the airway is likely open.","Unconscious Patient: Instruct the caller to:","Gently tilt the patient’s head back and lift their chin up, which helps to open the airway.","Listen for breathing sounds, watch for chest movements, and feel for breaths on their cheek."],"asks":[]}]},{"roman":"III","heading":"ASSESSING BREATHING","kind":"procedure","prompts":[{"label":"Check for Breathing","step":"4","lines":["After ensuring the airway is open, instruct the caller to continue ","lines":["Encourage the caller to stay on the line until emergency personnel take over."],"asks":[]}]}],"counts":{"sections":6,"prompts":12,"lines":23,"quoted_asks":0},"localize_flags":["[LOCALIZE: example]"]},{"file":"EMS_Motor-Vehicle-Accident.html","discipline":"EMS","title":"911 Dispatch Protocol: Motor Vehicle Accident","subtitle":null,"sections":[{"roman":"I","heading":"INITIAL CALL RECEIPT","prompts":[{"label":"Location & Callback — Every Call, First","lines":["“Where is your emergency? Give me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"],"asks":["“Where is your emergency? Give me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"]},{"label":"Location Confirmation","lines":["Immediately confirm the caller's exact location to ensure that emergency services are dispatched accurately and without delay. Precise details about the road, intersection, or landmarks are crucial."],"asks":[]}],"kind":"interrogation"},{"roman":"II","heading":"ASSESSMENT OF THE SITUATION","prompts":[{"label":"Nature of the Accident","lines":["\"Can you describe what happened? How many vehicles are involved?\""],"asks":["\"Can you describe what happened? How many vehicles are involved?\""]}],"kind":"interrogation"},{"roman":"III","heading":"CASUALTY ASSESSMENT","prompts":[{"label":"Check for Injuries","lines":["\"Are there any injuries? If yes, how many people are injured?\""],"asks":["\"Are there any injuries? If yes, how many people are injured?\""]}],"kind":"interrogation"},{"roman":"IV","heading":"SAFETY AND HAZARDS","prompts":[{"label":"Identify Immediate Hazards","lines":["\"Is there any risk of fire, leaking fuel, or other hazards at the scene?\""],"asks":["\"Is there any risk of fire, leaking fuel, or other hazards at the scene?\""]}]," ble to speak?"],"asks":[]},{"label":"Breathing","lines":["Can the patient breathe normally?"],"asks":[]},{"label":"Gender","lines":["What is the patient's gender?"],"asks":[]}],"kind":"interrogation"},{"roman":"II","heading":"PRIMARY ASSESSMENT QUESTIONS","prompts":[{"label":"Substance Involved","lines":["What substance was taken or suspected to be taken? (e.g., medications, household chemicals, illicit drugs)"],"asks":[]},{"label":"Amount and Time","lines":["How much of the substance was taken, and when did the exposure occur?"],"asks":[]},{"label":"Symptoms","lines":["What symptoms is the patient exhibiting? (e.g., drowsiness, confusion, seizures, difficulty breathing, vomiting)"],"asks":[]},{"label":"Intentionality","lines":["Was the ingestion accidental or intentional?"],"asks":[]}],"kind":"interrogation"},{"roman":"III","heading":"SECONDARY ASSESSMENT QUESTIONS","prompts":[{"label":"Medical History","lines":["Does the patient have any known allergies or medical conditions that could affect their response to the substance?"],"asks":[]},{"label":"Previous Overdoses","lines":["Has the patient had any previous overdoses or poisoning incidents?"],"asks":[]}],"kind":"interrogation"},{"roman":"IV","heading":"PRE-ARRIVAL INSTRUCTIONS","prompts":[{"label":"Safety First","lines":["If the substance is still present and poses a risk, instruct the caller to move the patient away from it safely, if possible."],"asks":[]},{"label":"Avoid Inducing Vomiting","lines":["Advise against inducing vomiting unless specifically directed by the UP-PGH National Poison Management and Control Center (NPMCC) [LOCALIZED 2026-08-21 — replaced US poison control network reference with UP-PGH NPMCC, the Philippines' single national poison control center]"],"asks":[]},{"label":"Skin or Eye Exposure","lines":["If the substance has come into contact with the patient’s skin or eyes, instruct the caller to rinse the affected area with plenty of water."],"asks":[]},{"label":"Rescue Breathing","lines":["If the patient is not breathing adequately, instruct the caller on how to perform rescue breathing if they are trained."],"asks":[]},{"label":"Keep Substance Container","lines":["Advise the caller to keep the container or packaging of the substance for identification by medical personnel."],"asks":[]}],"kind":"interrogation"},{"roman":"V","heading":"EMERGENCY NUMBERS","prompts":[{"label":"UP-PGH National Poison Management and Control Center (NPMCC) [LOCALIZED 2026-08-21 — replaced US Poison Control network reference with UP-PGH NPMCC, the Philippines' single national poison control center (no regional centers)]","lines":["Transfer and stay on the line if possible; if not, provide the NPMCC number for immediate expert advice (current 24/7 hotline: confirm with NPMCC/UP-PGH — number pending verification) [PENDING: confirm current NPMCC hotline digits before print]"],"asks":[]}],"kind":"interrogation"}],"counts":{"sections":5,"prompts":17,"lines":18,"quoted_asks":2},"localize_flags":["[LOCALIZE: example]","[LOCALIZED 2026-08-21 — replaced US poison control network reference with UP-PGH NPMCC, the Philippines' single national poison control center]","[LOCALIZED 2026-08-21 — replaced US Poison Control network reference with UP-PGH NPMCC, the Philippines' single national poison control center (no regional centers)]","[PENDING: confirm current NPMCC hotline digits before print]"],"crosslinks":[{"section":"II","prompt":"Symptoms","when":"suspected opioid overdose","skills":["EMS_Administering-Narcan.html"]},{"section":"IV","prompt":"Rescue Breathing","when":"not breathing adequately","skills":["EMS_CPR-Adult.html","EMS_CPR-Child.html","EMS_CPR-Infant.html","EMS_AED-Instructions.html"]}]},{"file":"EMS_Sick-Person.html","discipline":"EMS","title":"911 Dispatch Protocol: Sick Person","subtitle":null,"sections":[{"roman":"I","heading":"INITIAL CALL RECEIPT","prompts":[{"label":"Location & Callback — Every Call, First","lines":["“Where is your emergency? Give me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"],"asks":["“Where is your emergency? Give me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"]},{"label":"Location Confirmation","lines":["Immediately confirm the caller's exact location to ensure that emergency services are dispatched accurately and without delay."],"asks":[]}],"kind":"interrogation"},{"roman":"II","heading":"INITIAL ASSESSMENT QUESTIONS","prompts":[{"label":"Vital Signs Assessment","lines":["Age: Ask the caller, \"How old is the patient?\"","Ability to Speak: Inquire if the patient is alert and able to speak. Ask, \"Can the patient talk to you right now?\"","Breathing: Check if the patient can breathe normally. Ask, \"Is the patient breathing normally?\""],"asks":[]}],"kind":"interrogation"},{"roman":"III","heading":"FURTHER ASSESSMENT","prompts":[{"label":"Symptoms Overview","lines":["Ask the caller to describe the symptoms the patient is experiencing. For example, \"Can you tell me what symptoms the patient is having right now?\""],"asks":[]},{"label":"Onset of Symptoms","lines":["Determine when the symptoms started and whether they appeared suddenly or gradually. Ask, \"When did these symptoms start? Did they come on suddenly?\""],"asks":[]},{"label":"Severity of Symptoms","lines":["Probe the severity of the symptoms, especially if there is pain. Ask, \"On a scale from 1 to 10, how severe is the pain, if there is any?\""],"asks":[]},{"label":"Medical History","lines":["Inquire about any known medical history that might be relevant. Ask, \"Does the patient have any known medical conditions or allergies?\""],"asks":[]},{"label":"Medications","lines":["Check if the patient is taking any medications. Ask, \"Is the patient currently taking any medications?\""],"asks":[]}],"kind":"interrogation"},{"roman":"V","heading":"MONITORING AND COMFORT","prompts":[{"label":"Continuous Monitoring","lines":["Advise the caller to continue monitoring the patient’s condition closely and report any worsening or new symptoms."],"asks":[]},{"label":"Comfort and Reassure","lines":["Encourage the caller to keep the patient calm and reassure them that help is on the way."],"asks":[]}],"kind":"interrogation"},{"roman":"IV","heading":"PROVIDE INSTRUCTIONS BASED ON SYMPTOMS","prompts":[{"label":"General Care","lines":["Depending on the symptoms described:","Fever or Flu-like Symptoms: Advise the caller to keep the patient comfortable, hydrated, and if possible, to reduce fever using over-the-counter fever reducers according to the label directions.","Abdominal Pain or Vomiting: Suggest the caller not to give anything to eat or drink if the patient is vomiting or has severe abdominal pain."],"asks":[]}],"kind":"interrogation"},{"roman":"VI","heading":"PREPARE FOR EMS ARRIVAL","prompts":[{"label":"Information for EMS","lines":["Remind the caller to have a list of patient’s known medical conditions, medications, and any changes in symptoms ready to inform the EMS upon arrival."],"asks":[]},{"label":"Keep the Line Open","lines":["Instruct the caller to stay on the line until help arrives, following any further instructions given by the dispatcher."],"asks":[]}],"kind":"interrogation"},{"roman":"VII","heading":"ARRIVAL OF EMERGENCY SERVICES","prompts":[{"label":"Handover to EMS","lines":["Ensure that the caller knows to provide all relevant information to the emergency responders when they arrive, including the time of symptom onset and actions taken."],"asks":[]}],"kind":"interrogation"}],"counts":{"sections":7,"prompts":14,"lines":19,"quoted_asks":2},"localize_flags":["[LOCALIZE: example]"],"crosslinks":[{"section":"V","prompt":"Continuous Monitoring","when":"ongoing monitoring","skills":["EMS_Monitoring-ABCs.html"]}]},{"file":"EMS_Stabbing.html","discipline":"EMS","title":"911 Dispatch Protocol: Stabbing","subtitle":null,"sections":[{"roman":"I","heading":"INITIAL CALL RECEIPT","prompts":[{"label":"Location & Callback — Every Call, First","lines":["“Where is your emergency? Give me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"],"asks":["“Where is your emergency? Give me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"]},{"label":"Location Confirmation","lines":["Immediately confirm the caller's exact location to ensure that emergency services are dispatched accurately and without delay."],"asks":[]}],"kind":"interrogation"},{"roman":"II","heading":"SAFETY ASSESSMENT","prompts":[{"label":"Ensure Caller Safety","lines":["First, ensure that the caller is safe. Ask, \"Are you in a safe location?\" If not, instruct them to get to a safe place."],"asks":[]},{"label":"Assess the Scene","lines":["Inquire if the assailant is still at the scene. Ask, \"Is the person who did this still nearby?\" If yes, prioritize getting the caller to safety and gathering information about the assailant for law enforcement."],"asks":[]}],"kind":"interrogation"},{"roman":"III","heading":"VICTIM ASSESSMENT","prompts":[{"label":"Determine Consciousness and Breathing","lines":["Ask, \"Is the victim conscious and breathing?\""],"asks":[]}],"kind":"interrogation"},{"roman":"IV","heading":"FIRST AID FOR STAB WOUNDS","prompts":[{"label":"Instruct on Controlling Bleeding","lines":["Advise the caller to apply direct pressure to the wound. Use a clean cloth or bandage if available. If not, use any clean, non-fluffy material.","Instruct them not to remove the knife or any object that is impaled. Removing the object can cause more damage and increase bleeding."],"asks":[]}],"kind":"interrogation"},{"roman":"V","heading":"MONITOR AND SUPPORT","prompts":[{"label":"Keep the Victim Still","lines":["Advise the caller to keep the victim still. Movement can exacerbate injuries and increase the risk of shock."],"asks":[]},{"label":"Comfort and Reassure","lines":["Encourage the caller to keep the victim calm and reassured, explaining that help is on the way."],"asks":[]},{"label":"Monitor for Shock","lines":["Alert the caller to signs of shock, such as clammy skin, weakness, rapid breathing, or loss of consciousness."],"asks":[]}],"kind":"interrogation"},{"roman":"VIII","heading":"DISPATCH POLICE SERVICES","prompts":[{"label":"Law Enforcement Coordination","lines":["If not already done, ensure that law enforcement is dispatched to the scene to handle any criminal aspects of the incident and secure the area."],"asks":[]}],"kind":"interrogation"},{"roman":"VI","heading":"PREPARE FOR EMS ARRIVAL","prompts":[{"label":"Information for EMS","lines":["Remind the caller to have information ready about the number of wounds, locations, the condition of the victim, and any actions taken such as first aid."],"asks":[]},{"label":"Clear Path for EMS","lines":["Ensure the caller knows to clear a path for emergency responders to access the victim easily."],"asks":[]}],"kind":"interrogation"},{"roman":"VII","heading":"ARRIVAL OF EMERGENCY SERVICES","prompts":[{"label":"Handover to EMS","lines":["Ensure that the caller knows to provide all relevant information to the emergency responders when they arrive, including any details about the incident and first aid measures taken."],"asks":[]}],"kind":"interrogation"}],"counts":{"sections":8,"prompts":13,"lines":15,"quoted_asks":2},"localize_flags":["[LOCALIZE: example]"],"crosslinks":[{"section":"IV","prompt":"Instruct on Controlling Bleeding","when":"bleeding control","skills":["EMS_Applying-A-Tourniquet.html"]},{"section":"V","prompt":"Monitor for Shock","when":"signs of shock","skills":["EMS_Treating-Shock.html"]}]},{"file":"EMS_Suicidal-Caller.html","discipline":"EMS","title":"911 Dispatch Protocol: Suicidal Caller","subtitle":null,"sections":[{"roman":"I","heading":"INITIAL CALL RECEIPT","prompts":[{"label":"Location & Callback — Every Call, First","lines":["“Where is your emergency? Give me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"],"asks":["“Where is your emergency? Give me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"]},{"label":"Location Confirmation","lines":["Immediately confirm the caller's exact location to ensure that emergency services are dispatched accurately and without delay."],"asks":[]},{"label":"Caller Identification","lines":["Attempt to get the caller's name and use it during the conversation to create a more personal connection."],"asks":[]}],"kind":"interrogation"},{"roman":"II","heading":"CALM AND ASSESS","prompts":[{"label":"Establish Communication","lines":["Speak calmly and reassuringly. Let the caller know you are there to help and listen."],"asks":[]},{"label":"Assess Risk","lines":["Determine the immediate risk by asking:","\"Are you thinking about hurting yourself?\"","\"Do you have a plan to harm yourself?\"","\"Do you have what you need to carry out this plan?\""],"asks":["\"Are you thinking about hurting yourself?\"","\"Do you have a plan to harm yourself?\"","\"Do you have what you need to carry out this plan?\""]}],"kind":"interrogation"},{"roman":"III","heading":"SAFETY FIRST","prompts":[{"label":"Remove Immediate Danger","lines":["If the caller has immediate means to harm themselves, gently suggest they put it away or distance themselves from it."],"asks":[]},{"label":"Keep Them Engaged","lines":["Continue talking to the caller, asking open-ended questions to keep them engaged."],"asks":[]},{"label":"Listen Actively","lines":["Show empathy and validate their feelings without judgment. Say things like, \"It sounds like you're going through a really tough time.\""],"asks":[]}],"kind":"interrogation"},{"roman":"IV","heading":"CONSIDER 988 INVOLVEMENT","prompts":[{"label":"Evaluate for NCMH Crisis Hotline Referral","lines":["If the caller is stable, not in immediate danger, and primarily needs someone to talk to, consider referring them to the NCMH Crisis Hotline [LOCAL INSERT — current national mental-health crisis line: number(s), hours, and whether the line accepts a warm transfer from a PSAP. Verified as of: ____/____/______ by: ______________]"],"asks":[]},{"label":"Three-way Connection","lines":["If possible, facilitate a three-way call with the NCMH Crisis Hotline [LOCAL INSERT — current national mental-health crisis line: number(s), hours, and whether the line accepts a warm transfer from a PSAP. Verified as of: ____/____/______ by: ______________]"],"asks":[]},{"label":"Inform the Caller","lines":["Explain to the caller that you are connecting them with a specialist who is trained to help people feeling the way they are. Ensure they understand this is to provide them with the best support possible."],"asks":[]}],"kind":"interrogation"},{"roman":"VI","heading":"PROVIDE SUPPORT","prompts":[{"label":"Offer Reassurance","lines":["Reassure the caller that they are not alone and that there is help."],"asks":[]},{"label":"Avoid Provoking","lines":["Avoid saying things that might provoke an emotional response like \"You have so much to live for,\" or making promises you can't keep."],"asks":[]}],"kind":"interrogation"},{"roman":"VII","heading":"INFORMATION GATHERING","prompts":[{"label":"Collect Information","lines":["Gather as much information as possible about the caller’s mental and physical state, any substances they might have taken, and other relevant details that can help emergency responders."],"asks":[]}],"kind":"interrogation"},{"roman":"V","heading":"EMERGENCY SERVICES COORDINATION","prom I","heading":"INITIAL CALL RECEIPT","kind":"procedure","prompts":[{"label":"Location Confirmation","step":"1","lines":["Immediately confirm the caller's exact location to ensure that emergency services are dispatched accurately and without delay."],"asks":[]},{"label":"Callback Number","lines":["Verify the number the caller is calling from, in case the call is disconnected."],"asks":[]},{"label":"Situation Assessment","step":"2","lines":["Quickly determine if the individual is showing signs of shock, which might include cold and clammy skin, rapid breathing, weak pulse, confusion, or loss of consciousness."],"asks":[]}]},{"roman":"II","heading":"REASSURANCE AND SUPPORT","kind":"procedure","prompts":[{"label":"Immediate Assurance","step":"3","lines":["Reassure the caller that help is on the way and instruct them to keep the phone on speaker mode to continue receiving guidance."],"asks":[]}]},{"roman":"III","heading":"URGENT ACTION","kind":"procedure","prompts":[{"label":"Ensure Safety","step":"4","lines":["Instruct the caller to ensure the scene is safe for them to assist the patient."],"asks":[]}]},{"roman":"IV","heading":"POSITIONING THE PATIENT","kind":"procedure","prompts":[{"label":"Lay the Person Down","step":"5","lines":["If there are no injuries that prevent moving them, guide the caller to lay the person down on their back."],"asks":[]},{"label":"Elevate the Legs","step":"6","lines":["Advise the caller to elevate the person’s legs about 30 centimeters [LOCALIZE: source gave \"about 12 inches\" → converted to metric] unless you suspect spinal injuries or it causes pain, discomfort, or difficulty breathing."],"asks":[]},{"label":"Loosen Clothing","step":"7","lines":["Instruct the caller to loosen any tight clothing around the neck, chest, or waist to ensure nothing restricts breathing or circulation."],"asks":[]}]},{"roman":"V","heading":"MAINTAIN BODY TEMPERATURE","kind":"procedure","prompts":[{"label":"Cover the Patient","step":"8","lines":["Suggest the call "FIRE","title":"911 Dispatch Protocol: Aircraft Incident (With Fire)","subtitle":null,"sections":[{"roman":"I","heading":"INITIAL CALL RECEIPT","prompts":[{"label":"Location & Callback — Every Call, First","lines":["“Where is your emergency? Give me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"],"asks":["“Where is your emergency? Give me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"]},{"label":"Location Confirmation","lines":["Immediately confirm the caller's exact location and any specific details about the incident site (e.g., airport, private property, rural area)."],"asks":[]}],"kind":"interrogation"},{"roman":"II","heading":"INCIDENT DETAILS","prompts":[{"label":"Assessment of the Situation","lines":["Gather essential details about the incident.","\"Can you describe what happened?\"","\"Is the aircraft currently on fire?\"","\"Are there visible flames or smoke?\""],"asks":["\"Can you describe what happened?\"","\"Is the aircraft currently on fire?\"","\"Are there visible flames or smoke?\""]}],"kind":"interrogation"},{"roman":"III","heading":"SAFETY AND HAZARD ASSESSMENT","prompts":[{"label":"Ensure Caller Safety","lines":["Make sure the caller is at a safe distance from the incident."],"asks":[]},{"label":"Hazardous Materials","lines":["Determine if there may be hazardous materials involved."],"asks":[]}],"kind":"interrogation"},{"roman":"IV","heading":"VICTIM ASSESSMENT","prompts":[{"label":"Check for Victims","lines":["\"Can you see if there are any people in or around the aircraft?\""],"asks":["\"Can you see if there are any people in or around the aircraft?\""]}],"kind":"interrogation"},{"roman":"VII","heading":"ADDITIONAL INFORMATION GATHERING","prompts":[{"label":"Witness Accounts","lines":["Ask the caller an fficers when they arrive but ensure it remains secure and untouched.\""],"asks":["\"Have any evidence or information ready for the officers when they arrive but ensure it remains secure and untouched.\""]}],"kind":"interrogation"},{"roman":"X","heading":"FOLLOW-UP AND SUPPORT","prompts":[{"label":"Support Services","lines":["\"After the officers have assessed the situation, they will provide you with information about support services for affected individuals and any further safety measures.\""],"asks":["\"After the officers have assessed the situation, they will provide you with information about support services for affected individuals and any further safety measures.\""]}],"kind":"interrogation"},{"roman":"XI","heading":"DEBRIEF AND DOCUMENTATION","prompts":[{"label":"Comprehensive Reporting","lines":["\"Your report is being documented carefully, and all information will be handled with the utmost confidentiality.\""],"asks":["\"Your report is being documented carefully, and all information will be handled with the utmost confidentiality.\""]},{"label":"Context Dispatchers Must Know","lines":["The Philippines is recognized as a global hotspot for the online sexual abuse and exploitation of children (OSAEC) and for child trafficking more broadly. Unlike many exploitation cases, the facilitator is frequently a family member or someone in the child's own household — do not assume a stranger is involved, and do not assume the caller is unrelated to that household."],"asks":[]},{"label":"Indicators to Ask About","lines":["\"Is there a live-streaming or video-call component — is the child being shown on camera to someone paying for it?\"","\"Are there payments involved — money transfers, e-wallet transfers (e.g. GCash, Maya), mobile load, or gifts connected to the material or the livestreaming?\""],"asks":["\"Is there a live-streaming or video-call component — is the child being shown on camera to someone paying for it?\"","\"Are there payments involved — money transfers, e-wallet transfers (e.g. GCash, Maya), mobile load, or gifts connected to the material or the livestreaming?\""]},{"label":"Referral Path — IACAT Actionline","lines":["In addition to dispatching the PNP Women and Children Protection Desk (WCPD), report OSAEC/trafficking indicators to the Inter-Agency Council Against Trafficking (IACAT) via the IACAT Actionline [LOCAL INSERT — current IACAT Actionline number and hours, and the referral route for an OSAEC/trafficking report. Verified as of: ____/____/______ by: ______________]"],"asks":[]},{"label":"Victim-Sensitive Handling","lines":["Shame culture ( hiya ) runs especially deep here — the caller, and the child if present, may minimize, use vague language, or go silent rather than name what happened, particularly when a relative is involved. Use gentle, normalizing language ( \"Marami pong tumatawag tungkol dito, okay lang po sabihin sa akin\" — many people call about this, it's okay to tell me) and avoid asking the caller to repeat graphic details more than necessary."],"asks":[]},{"label":"Do Not Confront the Household","lines":["Instruct the caller explicitly NOT to confront the suspected family member or anyone else in the household, and not to signal that a report has been made — this is frequently a family-facilitated crime pattern, and a tipped-off household can destroy evidence, move the child, or escalate danger to the child within minutes."],"asks":[]}],"kind":"interrogation"}],"counts":{"sections":11,"prompts":18,"lines":20,"quoted_asks":15},"localize_flags":["[LOCALIZE: example]","[LOCAL INSERT — current IACAT Actionline number and hours, and the referral route for an OSAEC/trafficking report. Verified as of: ____/____/______ by: ______________]"]},{"file":"POLICE_Domestic-Disturbance.html","discipline":"POLICE","title":"911 Dispatch Protocol: Domestic Disturbance","subtitle":null,"sections":[{"roman":"I","heading":"INITIAL CALL RECEIPT","prompts":[{"label":"Location & Callback — Every Call, First","lines":["“Where is your emergency? Give me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"],"asks":["“Where is your emergency? Give me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"]},{"label":"Location Confirmation","lines":["Immediately confirm the caller's exact location to ensure that police units are dispatched accurately and without delay."],"asks":[]}],"kind":"interrogation"},{"roman":"II","heading":"SAFETY ASSESSMENT","prompts":[{"label":"Ensure Caller Safety","lines":["\"Are you in a safe place to talk right now?\""],"asks":["\"Are you in a safe place to talk right now?\""]}],"kind":"interrogation"},{"roman":"III","heading":"NATURE OF THE DISTURBANCE","prompts":[{"label":"Understanding the Situation","lines":["\"Can you describe what is happening?\"","\"Has this happened before?\"","\"Is there any physical violence involved? Are there any weapons involved?\""],"asks":["\"Can you describe what is happening?\"","\"Has this happened before?\"","\"Is there any physical violence involved? Are there any weapons involved?\""]}],"kind":"interrogation"},{"roman":"IV","heading":"SUSPECT AND VICTIM INFORMATION","prompts":[{"label":"Identify Participants","lines":["\"Can you tell me about the people involved? How many are there and what is their relationship to you?\""],"asks":["\"Can you tell me about the people involved? How many are there and what is their relationship to you?\""]}],"kind":"interrogation"},{"roman":"V","heading":"MEDICAL NEEDS ASSESSMENT","prompts":[{"label":"Check for Injuries","lines":["\"Has anyone been injured? Do you need an ambulance?\""],"asks":["\"Has anyone been injured? Do you need an ambulance?\""]}],"kind":"interrogation"},{"roman":"VI","heading":"HISTORY OF VIOLENCE","prompts":[{"label":"Prior Incidents","lines":["\"Has law enforcement been called to this location before for similar incidents?\""],"asks":["\"Has law enforcement been called to this location before for similar incidents?\""]}],"kind":"interrogation"},{"roman":"VII","heading":"WEAPONS ASSESSMENT","prompts":[{"label":"Potential for Harm","lines":["\"Are there any weapons in the house? What kind of weapons and where are they located?\""],"asks":["\"Are there any weapons in the house? What kind of weapons and where are they located?\""]}],"kind":"interrogation"},{"roman":"VIII","heading":"DISPATCHING POLICE","prompts":[{"label":"Immediate Police Response","lines":["\"I am sending officers to your location now. Please stay on the line with me until they arrive.\""],"asks":["\"I am sending officers to your location now. Please stay on the line with me until they arrive.\""]}],"kind":"interrogation"},{"roman":"IX","heading":"INSTRUCTIONS FOR THE CALLER","prompts":[{"label":"Safety Measures","lines":["\"If it is safe to do so, try to stay in a room with a door you can lock or a way out.\""],"asks":["\"If it is safe to do so, try to stay in a room with a door you can lock or a way out.\""]},{"label":"If Anyone Is Injured","lines":["If anyone is hurt and it is safe for you to be with them, I can guide you through first aid while help is on the way — controlling any serious bleeding comes first."],"asks":[]}],"kind":"interrogation"},{"roman":"X","heading":"OFFICER ARRIVAL PREPARATION","prompts":[{"label":"Preparing for Officer Arrival","lines":["\"When the officers arrive, try to meet them outside if it's safe. If you cannot leave safely, they will come to you.\"","\"Prepare to provide the officers with as much information as you can about what occurred and any protection you may need, such as a Barangay Protection Order (BPO) or a court-issued Protection Order under RA 9262 [LOCALIZED 2026-08-21 — replaced US \"restraining order\" concept with RA 9262 Barangay/court Protection Order reference]"],"asks":["\"When the officers arrive, try to meet them outside if it's safe. If you cannot leave safely, they will come to you.\"","\"Prepare to provide the officers with as much information as you can about what occurred and any protection you may need, such as a Barangay Protection Order (BPO) or a court-issued Protection Order under RA 9262 [LOCALIZED 2026-08-21 — replaced US \"restraining order\" concept with RA 9262 Barangay/court Protection Order reference]"]}],"kind":"interrogation"},{"roman":"XI","heading":"FOLLOW-UP ACTIONS","prompts":[{"label":"Documentation and Legal Actions","lines":["\"The officers will document everything that happened and explain your options under RA 9262 (Anti-VAWC Law): a Barangay Protection Order (BPO), issued the same day at no cost by the Punong Barangay or a Kagawad without a hearing and valid for 15 days; and, through the court, a 30-day Temporary Protection Order (TPO) followed by a Permanent Protection Order (PPO) after a hearing. Violating any of these orders is grounds for immediate warrantless arrest [LOCALIZED 2026-08-21 — replaced US \"restraining order\" concept with the RA 9262 (Anti-VAWC) three-tier BPO/TPO/PPO system and warrantless-arrest rule]"],"asks":["\"The officers will document everything that happened and explain your options under RA 9262 (Anti-VAWC Law): a Barangay Protection Order (BPO), issued the same day at no cost by the Punong Barangay or a Kagawad without a hearing and valid for 15 days; and, through the court, a 30-day Temporary Protection Order (TPO) followed by a Permanent Protection Order (PPO) after a hearing. Violating any of these orders is grounds for immediate warrantless arrest [LOCALIZED 2026-08-21 — replaced US \"restraining order\" concept with the RA 9262 (Anti-VAWC) three-tier BPO/TPO/PPO system and warrantless-arrest rule]"]}],"kind":"interrogation"},{"roman":"XII","heading":"DEBRIEF AND DOCUMENTATION","prompts":[{"label":"Post-Incident Reporting","lines":["\"Please ensure that all details are reported accurately to the officers so they can help you effectively.\""],"asks":["\"Please ensure that all details are reported accurately to the officers so they can help you effectively.\""]}],"kind":"interrogation"}],"counts":{"sections":12,"prompts":13,"lines":17,"quoted_asks":16},"localize_flags":["[LOCALIZE: example]","[LOCALIZED ...]","[LOCALIZED 2026-08-21 — replaced US \"restraining order\" concept with RA 9262 Barangay/court Protection Order reference]","[LOCALIZED 2026-08-21 — replaced US \"restraining order\" concept with the RA 9262 (Anti-VAWC) three-tier BPO/TPO/PPO system and warrantless-arrest rule]"],"crosslinks":[{"section":"IX","prompt":"If Anyone Is Injured","when":"injuries reported, scene safe","skills":["EMS_Bleeding-And-Lacerations.html"]}]},{"file":"POLICE_Drug-Dealing.html","discipline":"POLICE","title":"911 Dispatch Protocol: Drug Dealing","subtitle":null,"sections":[{"roman":"I","heading":"INITIAL CALL RECEIPT","prompts":[{"label":"Location & Callback — Every Call, First","lines":["“Where is your emergency? Give me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"],"asks":["“Where is your emergency? Give me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"]},{"label":"Location Confirmation","lines":["Immediately confirm the caller's exact location to ensure that police units are dispatched accurately and without delay."],"asks":[]}],"kind":"interrogation"},{"roman":"II","heading":"DETAILED DESCRIPTION","prompts":[{"label":"Identify the Activity","lines":["\"Can you describe what you are seeing that makes you suspect drug dealing?\""],"asks":["\"Can you describe what you are seeing that makes you suspect drug dealing?\""]}],"kind":"interrogation"},{"roman":"III","heading":"SUSPECT DESCRIPTION","prompts":[{"label":"Gather Suspect Information","lines":["\"Can you describe the individuals involved? Include details like gender, age, race, clothing, and any distinguishing features.\""],"asks":["\"Can you describe the individuals involved? Include details like gender, age, race, clothing, and any distinguishing features.\""]}],"kind":"interrogation"},{"roman":"IV","heading":"SAFETY ASSESSMENT","prompts":[{"label":"Ensure Caller Safety","lines":["\"Are you in a safe place to observe from? Make sure you are not seen or heard while talking to me.\""],"asks":["\"Are you in a safe place to observe from? Make sure you are not seen or heard while talking to me.\""]}],"kind":"interrogation"},{"roman":"V","heading":"LOCATION DETAILS","prompts":[{"label":"Specific Location","lines":["\"Can you give me a specific location where the drug dealing is occurring? Is it inside a building, in a parking lot, or on the street?\""],"asks":["\"Can you give me a specific location where the drug dealing is occurring? Is it inside a building, in a parking lot, or on the street?\""]}],"kind":"interrogation"},{"roman":"VI","heading":"FREQUENCY AND TIMING","prompts":[{"label":"Observation Patterns","lines":["\"Have you noticed this activity happening regularly? What times of day does it usually occur?\""],"asks":["\"Have you noticed this activity happening regularly? What times of day does it usually occur?\""]}],"kind":"interrogation"},{"roman":"VII","heading":"EVIDENCE","prompts":[{"label":"Photographic or Video Evidence","lines":["\"If you have safely taken any photos or videos, they can be very helpful. Please keep them secure and show them to the officers when they arrive.\""],"asks":["\"If you have safely taken any photos or videos, they can be very helpful. Please keep them secure and show them to the officers when they arrive.\""]}],"kind":"interrogation"},{"roman":"IX","heading":"ANONYMITY AND WITNESS PROTECTION","prompts":[{"label":"Maintaining Anonymity","lines":["\"Your safety is important. If you wish to remain anonymous, please let me know. We can still take action based on the information you provide.\""],"asks":["\"Your safety is important. If you wish to remain anonymous, please let me know. We can still take action based on the information you provide.\""]}],"kind":"interrogation"},{"roman":"VIII","heading":"DISPATCHING POLICE","prompts":[{"label":"Response Coordination","lines":["\"Based on your information, I am dispatching officers to the area. They will arrive as soon as possible and may approach discretely.\""],"asks":["\"Based on your information, I am dispatching officers to the area. They will arrive as soon as possible and may approach discretely.\""]}],"kind":"interrogation"},{"roman":"X","heading":"FOLLOW-UP INSTRUCTIONS","prompts":[{"label":"Instructions for the Caller","lines":["\"Please avoid posting about this on social media or discussing it publicly to protect the integrity of the investigation.\""],"asks":["\"Please avoid posting about this on social media or discussing it publicly to protect the integrity of the investigation.\""]}],"kind":"interrogation"},{"roman":"XI","heading":"DEBRIEF AND DOCUMENTATION","prompts":[{"label":"Documentation for Records","lines":["\"All details you provided will be documented and used to investigate the reported activities.\""],"asks":["\"All details you provided will be documented and used to investigate the reported activities.\""]}],"kind":"interrogation"}],"counts":{"sections":11,"prompts":12,"lines":13,"quoted_asks":12},"localize_flags":["[LOCALIZE: example]"]},{"file":"POLICE_Found-Person.html","discipline":"POLICE","title":"911 Dispatch Protocol: Found Person","subtitle":null,"sections":[{"roman":"I","heading":"INITIAL CALL RECEIPT","prompts":[{"label":"Location & Callback — Every Call, First","lines":["“Where is your emergency? Give me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, SSESSMENT","prompts":[{"label":"Safety of the Environment","lines":["Ensure the safety of both the caller and the found person."],"asks":[]},{"label":"Interaction With the Found Person","lines":["Inquire about how the found person is reacting to being approached or spoken to."],"asks":[]}],"kind":"interrogation"},{"roman":"VI","heading":"GATHERING CONTEXT","prompts":[{"label":"Circumstances of Discovery","lines":["Understand how and where the person was found.","\"Where exactly did you find the person?\""],"asks":["\"Where exactly did you find the person?\""]}],"kind":"interrogation"},{"roman":"VII","heading":"SPECIAL CONSIDERATIONS","prompts":[{"label":"Possible Missing Person Match","lines":["Check against recent missing person reports."],"asks":[]},{"label":"Vulnerability Assessment","lines":["Determine if the found person appears to be a vulnerable individual, such as a child or someone with apparent cognitive impairments."],"asks":[]}],"kind":"interrogation"},{"roman":"IX","heading":"DISPATCHING OFFICERS","prompts":[{"label":"Officer Dispatch","lines":["Dispatch officers to the location with all available information."],"asks":[]}],"kind":"interrogation"},{"roman":"VIII","heading":"INSTRUCTIONS FOR THE CALLER","prompts":[{"label":"Safety and Comfort","lines":["Provide instructions to keep the person comfortable and safe."],"asks":[]},{"label":"Await Police Arrival","lines":["Advise the caller to wait for police arrival."],"asks":[]},{"label":"If Anyone Is Injured","lines":["If anyone is hurt and it is safe for you to be with them, I can guide you through first aid while help is on the way — controlling any serious bleeding comes first."],"asks":[]}],"kind":"interrogation"},{"roman":"X","heading":"DOCUMENTATION AND FOLLOW-UP","prompts":[{"label":"Reporting and Documentation","lines":["Document the incident comprehensively for follow-up and record-keeping."],"asks":[]},{"label":"Coordinate With Other Agencies","lines":["If necessary, coordinate with other local agencies, especially if the found person is identified as missing from another area."],"asks":[]}],"kind":"interrogation"},{"roman":"XI","heading":"DEBRIEF","prompts":[{"label":"Debrief the Caller","lines":["Thank the caller for their assistance, confirm that officers have taken over, and provide any follow-up instructions or information."],"asks":[]}],"kind":"interrogation"}],"counts":{"sections":11,"prompts":20,"lines":23,"quoted_asks":8},"localize_flags":["[LOCALIZE: example]"],"crosslinks":[{"section":"VIII","prompt":"If Anyone Is Injured","when":"injuries reported, scene safe","skills":["EMS_Bleeding-And-Lacerations.html"]}]},{"file":"POLICE_Identity-Theft.html","discipline":"POLICE","title":"911 Dispatch Protocol: Identity Theft","subtitle":null,"sections":[{"roman":"I","heading":"INITIAL CALL RECEIPT","prompts":[{"label":"Location & Callback — Every Call, First","lines":["“Where is your emergency? Give me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"],"asks":["“Where is your emergency? Give me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"]},{"label":"Location Confirmation","lines":["Immediately confirm the caller's location to ensure that the correct jurisdictional authorities handle the report. Although local law enforcement may not always respond in person for identity theft, confirming the location helps determine the correct steps and resources."],"asks":[]}],"kind":"interrogation"},{"roman":"II","heading":"DETAILS OF THE INCIDENT","prompts":[{"label":"Nature of the Identity Theft","lines":["\"Can you describe what happened and how you became aware of the identity theft?\""],"asks":["\"Can you describe what happened and how you became aware of the identity theft?\""]}],"kind":"interrogation"},{"roman":"III","heading":"IMPACT ASSESSMENT","prompts":[{"label":"Assess Immediate Impact","lines":["\"Have there been any unauthorized transactions or accounts opened in your name?\"","\"Have you received any notifications from your bank, credit card companies, or e-wallet provider about unauthorized activity [LOCALIZED 2026-08-21 — replaced US \"credit monitoring\" concept with PH bank/e-wallet unauthorized-activity alerts]"],"asks":["\"Have there been any unauthorized transactions or accounts opened in your name?\"","\"Have you received any notifications from your bank, credit card companies, or e-wallet provider about unauthorized activity [LOCALIZED 2026-08-21 — replaced US \"credit monitoring\" concept with PH bank/e-wallet unauthorized-activity alerts]"]}],"kind":"interrogation"},{"roman":"VII","heading":"PREVENTATIVE MEASURES","prompts":[{"label":"Further Protective Actions","lines":["\"Consider changing passwords and security questions for your online accounts.\"","\"Monitor your bank and e-wallet statements regularly for any further unusual activity; you may also request your own credit report from the Credit Information Corporation (CIC) to check for fraudulent accounts opened in your name [LOCALIZED 2026-08-21 — replaced US \"credit reports\" reference with PH bank/e-wallet monitoring and optional Credit Information Corporation (CIC) self-check]"],"asks":["\"Consider changing passwords and security questions for your online accounts.\"","\"Monitor your bank and e-wallet statements regularly for any further unusual activity; you may also request your own credit report from the Credit Information Corporation (CIC) to check for fraudulent accounts opened in your name [LOCALIZED 2026-08-21 — replaced US \"credit reports\" reference with PH bank/e-wallet monitoring and optional Credit Information Corporation (CIC) self-check]"]}],"kind":"interrogation"},{"roman":"VIII","heading":"ADDITIONAL RESOURCES","prompts":[{"label":"Providing Support Resources","lines":["\"Would you like links or phone numbers for consumer protection agencies that can provide further assistance and guidance?\""],"asks":["\"Would you like links or phone numbers for consumer protection agencies that can provide further assistance and guidance?\""]}],"kind":"interrogation"},{"roman":"IX","heading":"EMOTIONAL SUPPORT","prompts":[{"label":"Support for Emotional Impact","lines":["\"Dealing with identity theft can be very stressful; if needed, I can provide you with contact information for counseling services.\""],"asks":["\"Dealing with identity theft can be very stressful; if needed, I can provide you with contact information for counseling services.\""]}],"kind":"interrogation"},{"roman":"IV","heading":"GUIDANCE ON IMMEDIATE ACTIONS","prompts":[{"label":"Advice on Immediate Steps","lines":["\"I recommend that you immediately contact your bank and credit card issuers to inform them of the situation and to secure your accounts.\"","\"It's also important to preserve evidence — screenshots, transaction reference numbers, and any messages from the scammer — and report the fraud immediately to your bank or e-wallet provider so the account can be frozen; if it isn't resolved, you can escalate to the BSP Consumer Assistance Mechanism at (02) 8708-7087 or consumeraffairs@bsp.gov.ph [LOCALIZED 2026-08-21 — replaced US credit-bureau fraud-alert process (Equifax/Experian/TransUnion) with PH evidence-preservation guidance and bank/e-wallet-first, then BSP Consumer Assistance escalation path]"],"asks":["\"I recommend that you immediately contact your bank and credit card issuers to inform them of the situation and to secure your accounts.\"","\"It's also important to preserve evidence — screenshots, transaction reference numbers, and any messages from the scammer — and report the fraud immediately to your bank or e-wallet provider so the account can be frozen; if it isn't resolved, you can escalate to the BSP Consumer Assistance Mechanism at (02) 8708-7087 or consumeraffairs@bsp.gov.ph [LOCALIZED 2026-08-21 — replaced US credit-bureau fraud-alert process (Equifax/Experian/TransUnion) with PH evidence-preservation guidance and bank/e-wallet-first, then BSP Consumer Assistance escalation path]"]}],"kind":"interrogation"},{"roman":"V","heading":"REPORTING TO AUTHORITIES","prompts":[{"label":"Filing a Report","lines":["\"It's crucial to file a report with the PNP Anti-Cybercrime Group (acg.pnp.gov.ph, acg@pnp.gov.ph) or the NBI Cybercrime Division as a walk-in complaint, especially if the theft happened online. If your personal data was leaked or misused, you can also file a complaint with the National Privacy Commission (privacy.gov.ph) [LOCALIZED 2026-08-21 — replaced US Federal Trade Commission (FTC) / IdentityTheft.gov referral with PH PNP Anti-Cybercrime Group, NBI Cybercrime Division, and National Privacy Commission referral path]","\"Would you like information on how to file a report with the PNP Anti-Cybercrime Group [LOCALIZED 2026-08-21 — replaced US FTC reference with PNP Anti-Cybercrime Group]"],"asks":["\"It's crucial to file a report with the PNP Anti-Cybercrime Group (acg.pnp.gov.ph, acg@pnp.gov.ph) or the NBI Cybercrime Division as a walk-in complaint, especially if the theft happened online. If your personal data was leaked or misused, you can also file a complaint with the National Privacy Commission (privacy.gov.ph) [LOCALIZED 2026-08-21 — replaced US Federal Trade Commission (FTC) / IdentityTheft.gov referral with PH PNP Anti-Cybercrime Group, NBI Cybercrime Division, and National Privacy Commission referral path]","\"Would you like information on how to file a report with the PNP Anti-Cybercrime Group [LOCALIZED 2026-08-21 — replaced US FTC reference with PNP Anti-Cybercrime Group]"]}],"kind":"interrogation"},{"roman":"VI","heading":"DOCUMENTATION FOR POLICE","prompts":[{"label":"Police Report","lines":["\"While local police might not directly investigate identity thefts, filing a police report can help in documenting the crime and is useful when dealing with creditors.\""],"asks":["\"While local police might not directly investigate identity thefts, filing a police report can help in documenting the crime and is useful when dealing with creditors.\""]}],"kind":"interrogation"},{"roman":"X","heading":"FOLLOW-UP ACTIONS","prompts":[{"label":"Encourage Vigilance","lines":["\"Keep all documentation related to this incident and any communications with financial institutions or agencies.\""],"asks":["\"Keep all documentation related to this incident and any communications with financial institutions or agencies.\""]}],"kind":"interrogation"},{"roman":"XI","heading":"DOCUMENTATION AND DEBRIEF","prompts":[{"label":"Incident Documentation","lines":["\"All details of this call will be documented. Please ensure you keep a copy of all reports filed for your records.\""],"asks":["\"All details of this call will be documented. Please ensure you keep a copy of all reports filed for your records.\""]}],"kind":"interrogation"}],"counts":{"sections":11,"prompts":12,"lines":17,"quoted_asks":16},"localize_flags":["[LOCALIZE: example]","[LOCALIZED ...]","[LOCALIZED 2026-08-21 — replaced US \"credit monitoring\" concept with PH bank/e-wallet unauthorized-activity alerts]","[LOCALIZED 2026-08-21 — replaced US \"credit reports\" reference with PH bank/e-wallet monitoring and optional Credit Information Corporation (CIC) self-check]","[LOCALIZED 2026-08-21 — replaced US credit-bureau fraud-alert process (Equifax/Experian/TransUnion) with PH evidence-preservation guidance and bank/e-wallet-first, then BSP Consumer Assistance escalation path]","[LOCALIZED 2026-08-21 — replaced US Federal Trade Commission (FTC) / IdentityTheft.gov referral with PH PNP Anti-Cybercrime Group, NBI Cybercrime Division, and National Privacy Commission referral path]","[LOCALIZED 2026-08-21 — replaced US FTC reference with PNP Anti-Cybercrime Group]"]},{"file":"POLICE_Kidnapping-Or-Unlawful-Custody.html","discipline":"POLICE","title":"911 Dispatch Protocol: Kidnapping Or Unlawful Custody","subtitle":null,"sections":[{"roman":"I","heading":"INITIAL CALL RECEIPT","prompts":[{"label":"Location & Callback — Every Call, First","lines":["“Where is your emergency? Give me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"],"asks":["“Where is your emergency? Give me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"]},{"label":"Location Confirmation","lines":["Immediately confirm the caller's exact location to ensure that police units are dispatched accurately and without delay."],"asks":[]}],"kind":"interrogation"},{"roman":"II","heading":"DETAILS OF THE INCIDENT","prompts":[{"label":"Nature of the Incident","lines":["\"Can you describe what happened?\"","\"When did you last see the person who has been taken?\""],"asks":["\"Can you describe what happened?\"","\"When did you last see the person who has been taken?\""]}],"kind":"interrogation"},{"roman":"III","heading":"VICTIM INFORMATION","prompts":[{"label":"Victim Details","lines":["\"Can you provide a description of the person who has been kidnapped or taken? This includes age, physical description, and what they were last wearing.\""],"asks":["\"Can you provide a description of the person who has been kidnapped or taken? This includes age, physical description, and what they were last wearing.\""]}],"kind":"interrogation"},{"roman":"IV","heading":"SUSPECT INFORMATION","prompts":[{"label":"Suspect Description","lines":["\"Can you describe the suspect or suspects involved? Include as many details as possible such as gender, age, race, clothing, and any distinctive features.\""],"asks":["\"Can you describe the suspect or suspects involved? Include as many details as possible such as gender, age, race, clothing, and any distinctive features.\""]}],"kind":"interrogation"},{"roman":"V","heading":"DIRECTION OF TRAVEL","prompts":[{"label":"Last Known Direction","lines":["\"Do you know which direction the suspects went after leaving the scene?\""],"asks":["\"Do you know which direction the suspects went after leaving the scene?\""]}],"kind":"interrogation"},{"roman":"VI","heading":"SAFETY AND SECURITY","prompts":[{"label":"Immediate Danger and Threats","lines":["\"Did the suspects make any threats during the incident? Were any weapons seen or mentioned?\""],"asks":["\"Did the suspects make any threats during the incident? Were any weapons seen or mentioned?\""]}],"kind":"interrogation"},{"roman":"IX","heading":"EVIDENCE PRESERVATION","prompts":[{"label":"Protecting Evidence","lines":["\"Please do not disturb any potential evidence related to the incident. Officers will need to examine the scene for any clues that could assist in the investigation.\""],"asks":["\"Please do not disturb any potential evidence related to the incident. Officers will need to examine the scene for any clues that could assist in the investigation.\""]}],"kind":"interrogation"},{"roman":"VII","heading":"LAW ENFORCEMENT DISPATCH","prompts":[{"label":"Urgent Police Dispatch","lines":["\"I am dispatching police units to your location immediately. They will be there as quickly as possible to gather more information and begin a search.\""],"asks":["\"I am dispatching police units to your location immediately. They will be there as quickly as possible to gather more information and begin a search.\""]}],"kind":"interrogation"},{"roman":"VIII","heading":"COMMUNICATION INSTRUCTIONS","prompts":[{"label":"Maintaining Open Lines","lines":["\"Please keep your phone line open and available for further communication. Officers may need to contact you for additional information or updates.\""],"asks":["\"Please keep your phone line open and available for further communication. Officers may need to contact you for additional information or updates.\""]}],"kind":"interrogation"},{"roman":"X","heading":"SUPPORT AND FOLLOW-UP","prompts":[{"label":"Post-Incident Support","lines":["\"After providing initial information to the police, there will be follow-up by detectives who specialize in kidnapping cases. They will keep you informed of any developments.\""],"asks":["\"After providing initial information to the police, there will be follow-up by detectives who specialize in kidnapping cases. They will keep you informed of any developments.\""]}],"kind":"interrogation"},{"roman":"XI","heading":"DOCUMENTATION AND REPORTING","prompts":[{"label":"Detailed Incident Logging","lines":["\"All details of this call and the responses initiated will be meticulously documented for ongoing investigation and coordination efforts.\""],"asks":["\"All details of this call and the responses initiated will be meticulously documented for ongoing investigation and coordination efforts.\""]},{"label":"Recognize the Call","lines":["Caller may report \"Dinukot siya\" (he/she was abducted/snatched) or that a ransom call has already been received. Treat any kidnap-for-ransom report as an immediate PNP Anti-Kidnapping Group (AKG) matter in addition to the responding patrol unit."],"asks":[]},{"label":"If a Ransom Call Has Already Come In","lines":["\"Has anyone contacted the family asking for money or demanding anything in exchange for their release?\"","Instruct the family: do NOT promise or confirm any payment amount over the phone and do not agree to terms — that decision belongs with AKG negotiators, not the caller.","Capture every detail the caller can give about the ransom contact: the number or account that reached them, the exact words used, background noise, the caller's voice or accent, and the time of contact."],"asks":["\"Has anyone contacted the family asking for money or demanding anything in exchange for their release?\""]},{"label":"PNP Anti-Kidnapping Group (AKG) Notification","lines":["Notify PNP-AKG in parallel with the responding local unit for any confirmed or suspected kidnap-for-ransom case — AKG carries the specialized negotiation and tracking capability this crime requires, and early notification improves recovery odds."],"asks":[]},{"label":"Targeting Pattern — Ask This","lines":["\"Does the victim or family have relatives working overseas (OFW), or does the family run a business?\""],"asks":["\"Does the victim or family have relatives working overseas (OFW), or does the family run a business?\""]},{"label":"Possible Staged (\"Kidnap-Me\") Scam","lines":["A known scam pattern exists where a family member — often a teen or young adult — colludes with an outside party to fake their own kidnapping and extort money from their own family. Listen for inconsistencies (the \"victim\" contacting the family directly, unusually specific payment instructions, no plausible abduction window) but never let suspicion of a hoax slow the response: dispatch and treat every report as a genuine kidnapping unless and until investigators determine otherwise."],"asks":[]}],"kind":"interrogation"}],"counts":{"sections":11,"prompts":17,"lines":21,"quoted_asks":15},"localize_flags":["[LOCALIZE: example]"]},{"file":"POLICE_Lock-In-Lock-Out.html","discipline":"POLICE","title":"911 Dispatch Protocol: Lock-In / Lock-Out","subtitle":null,"sections":[{"roman":"I","heading":"INITIAL CALL RECEIPT","prompts":[{"label":"Location & Callback — Every Call, First","lines":["“Where is your emergency? Give me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"],"asks":["“Where is your emergency? Give me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"]},{"label":"Location Confirmation","lines":["Immediately confirm the caller's exact location to ensure that assistance is dispatched accurately and without delay. Determine if the situation involves being locked inside (lock-in) or outside (lock-out) a structure or vehicle."],"asks":[]}],"kind":"interrogation"},{"roman":"II","heading":"ASSESSMENT OF THE SITUATION","prompts":[{"label":"Nature of the Incident","lines":["\"Can you explain how you or the individual ended up locked in or out?\""],"asks":["\"Can you explain how you or the individual ended up locked in or out?\""]}],"kind":"interrogation"},{"roman":"III","heading":"SAFETY ASSESSMENT","prompts":[{"label":"Ensure Caller Safety","lines":["\"Are you in any immediate danger or discomfort? For instance, are there any medical conditions that might be exacerbated by the current situation?\""],"asks":["\"Are you in any immediate danger or discomfort? For instance, are there any medical conditions that might be exacerbated by the current situation?\""]}],"kind":"interrogation"},{"roman":"IV","heading":"VICTIM INFORMATION (IF APPLICABLE)","prompts":[{"label":"Details of Individuals Involved","lines":["\"Is anyone with you, and do they have any urgent medical needs?\""],"asks":["\"Is anyone with you, and do they have any urgent medical needs?\""]}],"kind":"interrogation"},{"roman":"V","heading":"ALTERNATIVE ENTRY ASSESSMENT","prompts":[{"label":"Checking for Other Entry Methods","lines":["\"Have you checked if there are any other ways to unlock the door or another exit available?\""],"asks":["\"Have you checked if there are any other ways to unlock the door or another exit available?\""]}],"kind":"interrogation"},{"roman":"X","heading":"POST-RESOLUTION SUPPORT","prompts":[{"label":"Debrief and Preventative Advice","lines":["Once the situation is resolved, provide advice on how to prevent future lock-in or lock-out situations."],"asks":[]}],"kind":"interrogation"},{"roman":"VI","heading":"DISPATCHING APPROPRIATE SERVICES","prompts":[{"label":"Response Coordination","lines":["For residential or commercial lock-outs, dispatch locksmith services if there’s no immediate danger.","For lock-ins or when safety is compromised, dispatch emergency services immediately."],"asks":[]}],"kind":"interrogation"},{"roman":"VII","heading":"INSTRUCTIONS FOR THE CALLER","prompts":[{"label":"Guidance for Immediate Actions","lines":["\"Remain calm and stay near the phone or communication device so you can keep me updated.\""],"asks":["\"Remain calm and stay near the phone or communication device so you can keep me updated.\""]}],"kind":"interrogation"},{"roman":"VIII","heading":"FOLLOW-UP ACTIONS","prompts":[{"label":"Continued Assistance","lines":["\"I will stay on the line with you until help arrives. Please tell me if the situation changes or if you manage to resolve the issue before assistance reaches you.\""],"asks":["\"I will stay on the line with you until help arrives. Please tell me if the situation changes or if you manage to resolve the issue before assistance reaches you.\""]}],"kind":"interrogation"},{"roman":"IX","heading":"PREPARATION FOR HELP ARRIVAL","prompts":[{"label":"Information for Responders","lines":["\"Prepare to provide any necessary access information or codes that might assist in gaining entry quickly and safely.\""],"asks":["\"Prepare to provide any necessary access information or codes that might assist in gaining entry quickly and safely.\""]}],"kind":"interrogation"},{"roman":"XI","heading":"DOCUMENTATION AND REPORTING","prompts":[{"label":"Incident Reporting","lines":["\"All details of this call and the response will be documented for your safety and to improve our future service responses.\""],"asks":["\"All details of this call and the response will be documented for your safety and to improve our future service responses.\""]}],"kind":"interrogation"}],"counts":{"sections":11,"prompts":12,"lines":14,"quoted_asks":10},"localize_flags":["[LOCALIZE: example]"]},{"file":"POLICE_Lost-Person.html","discipline":"POLICE","title":"911 Dispatch Protocol: Lost Person","subtitle":null,"sections":[{"roman":"I","heading":"INITIAL CALL RECEIPT","prompts":[{"label":"Location & Callback — Every Call, First","lines":["“Where is your emergency? Give me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"],"asks":["“Where is your emergency? Give me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"]},{"label":"Location Confirmation","lines":["Immediately confirm the caller's exact location to ensure that search and rescue units are dispatched accurately and without delay."],"asks":[]}],"kind":"interrogation"},{"roman":"II","heading":"DETAILS OF THE LOST PERSON","prompts":[{"label":"Gathering Essential Information","lines":["\"Can you provide a description of the lost person? This includes their age, physical appearance, clothing, and any distinctive features.\"","\"When and where was the person last seen?\""],"asks":["\"Can you provide a description of the lost person? This includes their age, physical appearance, clothing, and any distinctive features.\"","\"When and where was the person last seen?\""]}],"kind":"interrogation"},{"roman":"III","heading":"VULNERABILITY ASSESSMENT","prompts":[{"label":"Assess Vulnerabilities","lines":["\"Does the lost person have any medical conditions that we should be aware of, such as Alzheimer’s, dementia, or any physical disabilities?\""],"asks":["\"Does the lost person have any medical conditions that we should be aware of, such as Alzheimer’s, dementia, or any physical disabilities?\""]}],"kind":"interrogation"},{"roman":"IV","heading":"SAFETY AND COMFORT","prompts":[{"label":"Ensure Caller’s Safety","lines":["\"Are you in a safe location while you’re calling? Is there anything immediate that you need help with?\""],"asks":["\"Are you in a safe location while you’re calling? Is there e search area.\""]}],"kind":"interrogation"},{"roman":"X","heading":"FOLLOW-UP AND SUPPORT","prompts":[{"label":"Continued Assistance","lines":["\"We will keep you updated with any developments and might need you to confirm if any found items belong to the lost person.\""],"asks":["\"We will keep you updated with any developments and might need you to confirm if any found items belong to the lost person.\""]}],"kind":"interrogation"},{"roman":"XI","heading":"DOCUMENTATION AND REPORTING","prompts":[{"label":"Incident Reporting","lines":["\"All details of this call and the response will be documented for ongoing reference during the search and for review afterward.\""],"asks":["\"All details of this call and the response will be documented for ongoing reference during the search and for review afterward.\""]}],"kind":"interrogation"}],"counts":{"sections":11,"prompts":12,"lines":14,"quoted_asks":13},"localize_flags":["[LOCALIZE: example]"]},{"file":"POLICE_Missing-Person-Incident.html","discipline":"POLICE","title":"911 Dispatch Protocol: Missing Person Incident","subtitle":null,"sections":[{"roman":"I","heading":"INITIAL CALL RECEIPT","prompts":[{"label":"Location & Callback — Every Call, First","lines":["“Where is your emergency? Give me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"],"asks":["“Where is your emergency? Give me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"]},{"label":"Location Confirmation","lines":["Immediately confirm the caller's exact location to ensure that police units are dispatched accurately and without delay, if immediate response is warranted."],"asks":[]}],"kind":"interrogation"},{"roman":"II","heading":"DETAILS OF THE MISSING PERSON","prompts":[{"label":"Gathering Essential Information","lines
