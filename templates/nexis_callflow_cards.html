"interrogation"},{"roman":"VII","heading":"RESOURCES AND SUPPORT","prompts":[{"label":"Mobilizing Additional Resources","lines":["\"We can coordinate with local community groups, and alert media if necessary, depending on the severity and specifics of the case.\"","\"The Philippines has no Amber-Alert-style public alert system (legislation is pending in Congress as of 2026). For children, refer immediately to the nearest PNP Women and Children Protection Desk (WCPD) — present at every city or municipal police station — and to the PNP Women and Children Protection Center (WCPC) at the national level; involve DSWD for child welfare support.\" [LOCALIZED 2026-08-21 — replaced US Amber Alert reference with PH PNP WCPD/WCPC and DSWD referral path]"],"asks":["\"We can coordinate with local community groups, and alert media if necessary, depending on the severity and specifics of the case.\"","\"The Philippines has no Amber-Alert-style public alert system (legislation is pending in Congress as of 2026). For children, refer immediately to the nearest PNP Women and Children Protection Desk (WCPD) — present at every city or municipal police station — and to the PNP Women and Children Protection Center (WCPC) at the national level; involve DSWD for child welfare support.\" [LOCALIZED 2026-08-21 — replaced US Amber Alert reference with PH PNP WCPD/WCPC and DSWD referral path]"]}],"kind":"interrogation"},{"roman":"VIII","heading":"COMMUNICATION STRATEGY","prompts":[{"label":"Keeping Lines Open","lines":["\"Keep your phone with you and maintain communication. The missing person might try to contact you, or you may need to provide further information.\""],"asks":["\"Keep your phone with you and maintain communication. The missing person might try to contact you, or you may need to provide further information.\""]}],"kind":"interrogation"},{"roman":"IX","heading":"PREPARATION FOR POLICE ARRIVAL","prompts":[{"label":"Scene Preparation","lines":["\"Prepare to provide any additional i ]}],"kind":"interrogation"},{"roman":"III","heading":"SAFETY AND SECURITY AT THE SCENE","prompts":[{"label":"Secure the Scene","lines":["Instruct responding units to approach with caution, particularly if the situation involves an active shooter or ongoing threat."],"asks":[]}],"kind":"interrogation"},{"roman":"IV","heading":"MEDICAL ATTENTION FOR THE INJURED OFFICER","prompts":[{"label":"Immediate Medical Assessment and Aid","lines":["Instruct any officers or first responders on the scene with medical training to begin immediate aid to the injured officer, if not already underway."],"asks":[]}],"kind":"interrogation"},{"roman":"VI","heading":"INFORMATION GATHERING","prompts":[{"label":"Collect Critical Information","lines":["Gather information about the nature of the incident that led to the officer being down — details about any suspects, including descriptions, number of suspects, direction of escape, and whether they are on foot or in a vehicle."],"asks":[]}],"kind":"interrogation"},{"roman":"VII","heading":"COMMUNICATION MANAGEMENT","prompts":[{"label":"Continuous Updates","lines":["Maintain an open and constant line of communication with on-scene commanders and all responding units."],"asks":[]}],"kind":"interrogation"},{"roman":"VIII","heading":"INCIDENT COMMAND SYSTEM","prompts":[{"label":"Establish an Incident Command","lines":["Establish or confirm the incident command structure as soon as possible to coordinate the response efforts effectively."],"asks":[]}],"kind":"interrogation"},{"roman":"IX","heading":"POST-INCIDENT PROCEDURES","prompts":[{"label":"Care and Investigation","lines":["Once the officer is transported to medical care and the immediate danger is addressed, begin the procedure for investigating the incident."],"asks":[]}],"kind":"interrogation"},{"roman":"II","heading":"URGENT ASSISTANCE DISPATCH","prompts":[{"label":"Priority Dispatch of Emergency Services","lines":["Dispatch additional police units, EMS, and if necessary, other specialized e me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"],"asks":["“Where is your emergency? Give me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"]},{"label":"Recognize the Call Type Immediately","lines":["Listen for the phrases \"riding-in-tandem,\" \"binaril,\" \"nabaril\" (\"shot\"/\"was shot\") — these signal a mobile, armed suspect fleeing right now, not a static crime scene. Treat this as a live, moving threat from the first sentence."],"asks":[]}],"kind":"interrogation"},{"roman":"II","heading":"MOTORCYCLE DESCRIPTION","prompts":[{"label":"Suspect Vehicle","lines":["\"What color and type of motorcycle was it? Did you catch a make or model?\"","\"Could you see a plate number?\" — Expect no plate, a covered/muddied plate, or a partial plate; this is normal for this crime type and does not mean the caller is unreliable."],"asks":["\"What color and type of motorcycle was it? Did you catch a make or model?\"","\"Could you see a plate number?\" — Expect no plate, a covered/muddied plate, or a partial plate; this is normal for this crime type and does not mean the caller is unreliable."]}],"kind":"interrogation"},{"roman":"III","heading":"SUSPECT DESCRIPTION","prompts":[{"label":"Riders","lines":["\"What were the riders wearing? Were they wearing helmets — full-face or open-face?\" (Full-face helmets are common and deliberately conceal identity.)","\"Which rider fired the weapon — the driver or the back rider?\" (Back rider is the typical shooter.)"],"asks":["\"What were the riders wearing? Were they wearing helmets — full-face or open-face?\" (Full-face helmets are common and deliberately conceal identity.)","\"Which rider fired the weapon — the driver or the back rider?\" (Back rider is the typical shooter.)"]}],"kind":"interrogation"},{"roman":"IV","heading":"DIRECTION OF TRAVEL","prompts":[{"label":"Flight Path","lines":["\"Which direction did they go? What street or intersection were they last seen at?\"","\"How fast were they moving, and did they turn anywhere?\""],"asks":["\"Which direction did they go? What street or intersection were they last seen at?\"","\"How fast were they moving, and did they turn anywhere?\""]}],"kind":"interrogation"},{"roman":"V","heading":"WEAPON","prompts":[{"label":"Weapon Used","lines":["\"What kind of weapon did you see — a handgun, a long firearm?\""],"asks":["\"What kind of weapon did you see — a handgun, a long firearm?\""]}],"kind":"interrogation"},{"roman":"VI","heading":"VICTIM STATUS","prompts":[{"label":"Casualty Assessment","lines":["\"How many people were hit? Is the victim conscious and breathing?\""],"asks":["\"How many people were hit? Is the victim conscious and breathing?\""]}],"kind":"interrogation"},{"roman":"VII","heading":"WITNESSES AND SCENE SAFETY","prompts":[{"label":"Scene Assessment","lines":["\"Are there other witnesses at the scene? Are they staying, or are people leaving?\""],"asks":["\"Are there other witnesses at the scene? Are they staying, or are people leaving?\""]}],"kind":"interrogation"},{"roman":"VIII","heading":"RAPID BOLO BROADCAST","prompts":[{"label":"Be-On-The-Lookout","lines":["Transmit the motorcycle description, plate status, rider descriptions, weapon, and direction of travel to responding PNP units and nearby checkpoints immediately — do not hold the broadcast until the call is complete."],"asks":[]}],"kind":"interrogation"},{"roman":"IX","heading":"PARALLEL EMS DISPATCH","prompts":[{"label":"Simultaneous Response","lines":["Dispatch EMS at the same time as police — do not wait for officers to declare the scene clear before EMS begins staging nearby, unless active shots are still being fired."],"asks":[]}],"kind":"interrogation"},{"roman":"X","heading":"CCTV / EVIDENCE CANVASS NOTE","prompts":[{"label":"     let body = "";
    sec.prompts.forEach(p => {
      body += `<div class="prompt">${p.label ? `<div class="label">${esc(p.label)}</div>` : ""}`;
      p.lines.forEach(line => {
        if (sec.kind === "procedure") { n += 1;
          body += `<div class="step"><span class="stepnum">${n}</span>${esc(line)}</div>`;
        } else {
          body += `<div class="qline">${esc(line)}</div>`;
        }
      });
      body += xlinkChips(c, sec, p);
      body += `</div>`;
    });
    secHtml += `<div class="section"><h2><span class="roman">${esc(sec.roman || "")}</span>${esc(sec.heading)}</h2>${body}</div>`;
  });

  const crumbs = state.stack.length ? `<div class="crumbs">
      <button id="backBtn">&larr; Back</button>
      ${state.stack.map(s => {
        const sc = cards().find(x => x.file === s.file);
        return `<span class="sep">›</span><button data-crumb="${esc(s.file)}">${esc(sc ? shortTitle(sc) : s.file)}</button>`;
      }).join("")}
      <span class="sep">›</span><span class="here">${esc(shortTitle(c))}</span>
    </div>` : "";

  const demo = DEMO_SLOTS[c.file];
  const tools = [];
  if (METRO_CARDS.has(c.file)) tools.push(`<button class="btn primary" data-tool="metro">♥ Start compression metronome</button>`);
  if (demo) tools.push(`<button class="btn" data-tool="demo" style="border-color:var(--navy)">${demo.src ? "▶ Watch" : "⊞ View"}: ${esc(demo.title)}</button>`);

  return `
    ${crumbs}
    <div class="cardhead">
      <span class="disc" style="background:var(--c-${d})">${d}</span>
      <h1>${esc(shortTitle(c))}</h1>
    </div>
    ${c.subtitle ? `<p style="margin:-6px 0 14px;color:var(--ink-soft)">${esc(c.subtitle)}</p>` : ""}
    ${tools.length ? `<div class="toolrow">${tools.join("")}</div>` : ""}
    ${secHtml}
    <p class="foot">PROPRIETARY &amp; CONFIDENTIAL · © NGA911 · Nexis Call Flow Cards™ ·
      PROTOTYPE — pending agency authorization &amp; medical review before any operational use.</p>`;
}

/* --------------------------------------------------------------- search */
function searchResults() {
  const q = state.q.trim().toLowerCase();
  if (!q) return null;
  return cards().filter(c => shortTitle(c).toLowerCase().includes(q)
    || JSON.stringify(c.sections).toLowerCase().includes(q)).slice(0, 30);
}
function renderResults() {
  const box = $("#results");
  const r = searchResults();
  if (!r) { box.hidden = true; box.innerHTML = ""; return; }
  box.hidden = false;
  box.innerHTML = r.length ? r.map(c => `<button data-goto="${esc(c.file)}"
      style="border-left-color:var(--c-${effDiscipline(c)})">${esc(shortTitle(c))}
      <small>${effDiscipline(c)}</small></button>`).join("")
    : `<div class="none">No card matches "${esc(state.q)}". Try a symptom or incident word.</div>`;
  box.querySelectorAll("[data-goto]").forEach(b => b.addEventListener("click", () => {
    openCard(b.dataset.goto);
  }));
}

/* ------------------------------------------------------------ navigation */
function openCard(file, opts) {
  const c = cards().find(x => x.file === file);
  if (!c) return;
  if (state.view === "card" && state.card && state.card.file !== file) {
    // A card-to-card hop remembers where we were, including scroll position.
    state.stack.push({ file: state.card.file, scroll: window.scrollY });
    if (state.stack.length > 12) state.stack.shift();
  }
  state.card = c; state.view = "card";
  state.q = ""; $("#q").value = "";
  render(); window.scrollTo(0, 0);
}
function goBack() {
  const prev = state.stack.pop();
  if (!prev) { goHome(); return; }
  const c = cards().find(x => x.file === prev.file);
  if (!c) { goHome(); return; }
  state.card = c; render(); window.scrollTo(0, prev.scroll || 0);
}
function goHome() {
  state.view = "home"; state.card = null; state.stack = [];
  state.q = ""; $("#q").value = "";
  render(); window.scrollTo(0, 0);
}
function setEdition(ed) {
  if (state.edition === ed) return;
  state.edition = ed;
  // Same card exists in the other edition under the same filename — stay on it.
  if (state.view === "card" && state.card) {
    const twin = cards().find(x => x.file === state.card.file);
    state.stack = state.stack.filter(s => cards().some(x => x.file === s.file));
    if (twin) { state.card = twin; render(); return; }
    goHome(); return;
  }
  render();
}

/* ------------------------------------------------------------- metronome
   CPR compression cadence, 100-110 BPM. Web Audio clicks are SYNTHESIZED
   (no recordings, no licensing) and scheduled on the audio clock with a
   lookahead loop so the cadence never drifts the way setInterval does.
   The count cycles 1-30: the 30:2 compressions-to-breaths cycle the CPR
   cards themselves instruct. */
const metro = (() => {
  let ctx = null, running = false, bpm = 110, nextT = 0, count = 0, timer = null;
  function ac() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === "suspended") ctx.resume().catch(() => {});
    return ctx;
  }
  function click(t, accent) {
    const c = ac(), o = c.createOscillator(), g = c.createGain(), f = c.createBiquadFilter();
    o.type = "square"; o.frequency.value = accent ? 1320 : 990;
    f.type = "lowpass"; f.frequency.value = 2400;
    o.connect(f); f.connect(g); g.connect(c.destination);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.5, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    o.start(t); o.stop(t + 0.07);
  }
  function loop() {
    const c = ac(), interval = 60 / bpm;
    while (nextT < c.currentTime + 0.12) {
      const beatCount = (count % 30) + 1;
      click(nextT, beatCount === 1);
      const at = nextT;
      // Visual pulse fires as close to the audio tick as setTimeout allows.
      setTimeout(() => { if (running) beatUI(beatCount); },
        Math.max(0, (at - c.currentTime) * 1000));
      count += 1; nextT += interval;
    }
  }
  function beatUI(n) {
    const p = $("#pulse");
    if (!p) return;
    p.classList.remove("beat"); void p.offsetWidth; p.classList.add("beat");
    const el = p.querySelector(".count");
    if (el) el.textContent = n;
  }
  return {
    get running() { return running; }, get bpm() { return bpm; },
    setBpm(v) { bpm = v; },
    start() {
      const c = ac();
      running = true; count = 0; nextT = c.currentTime + 0.08;
      loop(); timer = setInterval(loop, 25);
    },
    stop() {
      running = false; clearInterval(timer); timer = null;
      const p = $("#pulse"); if (p) p.classList.remove("beat");
    },
  };
})();

/* --------------------------------------------------------------- modals */
function renderModals() {
  const root = $("#modalRoot");
  let html = "";
  if (state.metroOpen) {
    html += `<div class="overlay" id="metroOverlay" role="dialog" aria-modal="true" aria-label="CPR compression metronome">
      <div class="modal">
        <h2>CPR compression metronome</h2>
        <p class="sub">Guides the caller's compression rate. Card content stays available behind this panel — close and reopen anytime; the beat keeps running.</p>
        <div class="mwrap">
          <div id="pulse"><span class="count">${metro.running ? "" : "—"}</span><span class="clabel">of 30 compressions</span></div>
          <div class="bpmrow">
            ${[100, 105, 110].map(v => `<button class="bpmbtn ${metro.bpm === v ? "on" : ""}" data-bpm="${v}">${v} <span style="font-size:11px;opacity:.7">BPM</span></button>`).join("")}
          </div>
          <button class="btn primary" id="metroToggle" style="min-width:180px">${metro.running ? "■ Stop" : "▶ Start the beat"}</button>
          <p class="mnote">Synthesized click — 100–110 compressions per minute, the rate the CPR
            cards instruct. High tick marks each new 30-compression cycle (30 compressions : 2 breaths).</p>
          <button class="btn quiet" id="metroClose">Close panel${metro.running ? " (beat keeps running)" : ""}</button>
        </div>
      </div></div>`;
  }
  if (state.demo) {
    const slot = DEMO_SLOTS[state.demo];
    html += `<div class="overlay" id="demoOverlay" role="dialog" aria-modal="true" aria-label="Demonstration clip">
      <div class="modal" style="max-width:680px">
        <h2>${esc(slot.title)}</h2>
        ${slot.diagram ? `
          <p class="sub">Original NGA911 diagram — labels are the card's own wording. Pending medical review.</p>
          <div style="border:1px solid var(--line);border-radius:8px;overflow:hidden">${DIAGRAMS[slot.diagram]}</div>` : ""}
        ${slot.src
          ? `<video controls style="width:100%;border-radius:8px;margin-top:12px" src="${esc(slot.src)}"></video>`
          : slot.diagram
            ? `<p class="tagline" style="margin:12px 0 0">Video demo slot still open — media source
                (AI-generated / licensed / filmed) pending decision + medical review. The approved clip
                drops in as a data change.</p>`
            : `<div class="demo-frame">
              <div class="play">▶</div>
              <div><b>DEMO CLIP PLACEHOLDER</b><br>
              Media source pending decision (AI-generated / licensed / filmed)<br>
              — every option requires medical-accuracy review before use.</div>
              <div class="tagline">Slot is wired: dropping in the approved clip is a data change, not a code change</div>
            </div>`}
        <p style="text-align:right;margin:14px 0 0">
          <button class="btn quiet" id="demoClose">Close</button></p>
      </div></div>`;
  }
  root.innerHTML = html;

  const mt = $("#metroToggle");
  if (mt) mt.addEventListener("click", () => {
    if (metro.running) metro.stop(); else metro.start();
    renderModals(); updateFab();
  });
  document.querySelectorAll("[data-bpm]").forEach(b => b.addEventListener("click", () => {
    metro.setBpm(Number(b.dataset.bpm)); renderModals(); updateFab();
  }));
  const mc = $("#metroClose");
  if (mc) mc.addEventListener("click", () => { state.metroOpen = false; renderModals(); });
  const mo = $("#metroOverlay");
  if (mo) mo.addEventListener("click", e => { if (e.target === mo) { state.metroOpen = false; renderModals(); } });
  const dc = $("#demoClose");
  if (dc) dc.addEventListener("click", () => { state.demo = null; renderModals(); });
  const dov = $("#demoOverlay");
  if (dov) dov.addEventListener("click", e => { if (e.target === dov) { state.demo = null; renderModals(); } });
}
function updateFab() {
  $("#metroFab").textContent = metro.running ? `♥ ${metro.bpm} BPM — tap to open` : "♥ CPR metronome";
}

/* ---------------------------------------------------------------- wiring */
function wire() {
  const m = $("#main");
  m.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => {
    state.disc = b.dataset.d; render();
  }));
  m.querySelectorAll("[data-open]").forEach(b => b.addEventListener("click", () => openCard(b.dataset.open)));
  m.querySelectorAll("[data-goto]").forEach(b => b.addEventListener("click", () => openCard(b.dataset.goto)));
  const back = $("#backBtn");
  if (back) back.addEventListener("click", goBack);
  m.querySelectorAll("[data-crumb]").forEach(b => b.addEventListener("click", () => {
    // Jump to a crumb: unwind the stack to that point.
    const i = state.stack.findIndex(s => s.file === b.dataset.crumb);
    if (i < 0) return;
    const target = state.stack[i];
    state.stack = state.stack.slice(0, i);
    const c = cards().find(x => x.file === target.file);
    if (c) { state.card = c; render(); window.scrollTo(0, target.scroll || 0); }
  }));
  m.querySelectorAll("[data-tool]").forEach(b => b.addEventListener("click", () => {
    if (b.dataset.tool === "metro") { state.metroOpen = true; renderModals(); }
    if (b.dataset.tool === "demo") { state.demo = state.card.file; renderModals(); }
  }));
}

/* ------------------------------------------------------------------ boot */
function boot() {
  if (!DATA) {
    $("#main").innerHTML = `<p>This is the unpackaged source. Run <code>package.py</code> to
      build the standalone file with both card editions inlined.</p>`;
    return;
  }
  ["us", "ph"].forEach(ed => DATA[ed].cards.sort((a, b) =>
    ORDER.indexOf(effDiscipline(a)) - ORDER.indexOf(effDiscipline(b))
    || shortTitle(a).localeCompare(shortTitle(b))));
  $("#edUS").addEventListener("click", () => setEdition("us"));
  $("#edPH").addEventListener("click", () => setEdition("ph"));
  $("#homeBtn").addEventListener("click", goHome);
  $("#metroFab").addEventListener("click", () => { state.metroOpen = true; renderModals(); });
  const q = $("#q");
  q.addEventListener("input", () => { state.q = q.value; renderResults(); });
  q.addEventListener("keydown", e => {
    if (e.key === "Enter") { const r = searchResults(); if (r && r.length) openCard(r[0].file); }
    if (e.key === "Escape") { state.q = ""; q.value = ""; renderResults(); q.blur(); }
  });
  document.addEventListener("keydown", e => {
    if (e.key === "/" && document.activeElement !== q) { e.preventDefault(); q.focus(); }
    if (e.key === "Escape") {
      if (state.demo) { state.demo = null; renderModals(); return; }
      if (state.metroOpen) { state.metroOpen = false; renderModals(); return; }
      if (state.view === "card") goBack();
    }
  });
  document.addEventListener("click", e => {
    // Click-away closes the search results dropdown.
    if (!e.target.closest(".hsearch")) { if (state.q) { state.q = ""; q.value = ""; renderResults(); } }
  });
  render();
}
boot();
</script>
