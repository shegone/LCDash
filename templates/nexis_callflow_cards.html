 in affected areas, not an improvised option."],"asks":[]},{"label":"Utility Line Cut","lines":["Where a home or area is reported energized and flooded, request the local electric utility (e.g. Meralco or the local electric cooperative) cut power to that line before entry, and relay this to responding units."],"asks":[]},{"label":"Agency Notification","lines":["Notify BFP/PNP water rescue assets as needed for swift-current or trapped-person calls; log with LGU DRRMO for area-wide flood tracking."],"asks":[]}],"kind":"interrogation"},{"roman":"VII","heading":"IMMEDIATE SAFETY INSTRUCTIONS","prompts":[{"label":"Do Not Enter Floodwater","lines":["\"Do not walk or drive through the floodwater. You cannot see what is underneath — open manholes, debris, or a strong current can sweep you away in seconds.\""],"asks":["\"Do not walk or drive through the floodwater. You cannot see what is underneath — open manholes, debris, or a strong current can sweep you away in seconds.\""]},{"label":"Move To Higher Ground","lines":["\"If the water is rising, move to the highest safe level of your home — the second floor or the roof — and stay there.\""],"asks":["\"If the water is rising, move to the highest safe level of your home — the second floor or the roof — and stay there.\""]},{"label":"Electrical Safety","lines":["\"Do not touch the breaker or any switch if your hands or feet are wet, and do not touch any metal fixture near the water. If it is dry and safe to reach, turn off the main breaker — otherwise leave it and wait for the utility to cut power.\""],"asks":["\"Do not touch the breaker or any switch if your hands or feet are wet, and do not touch any metal fixture near the water. If it is dry and safe to reach, turn off the main breaker — otherwise leave it and wait for the utility to cut power.\""]}],"kind":"interrogation"},{"roman":"VIII","heading":"IF TRAPPED / AWAITING RESCUE","prompts":[{"label":"Stay Visible And Reachable","lines":["\"Stay where rescuers can see you — near a window or on the roof — and wave or signal when you hear a boat or responders.\""],"asks":["\"Stay where rescuers can see you — near a window or on the roof — and wave or signal when you hear a boat or responders.\""]},{"label":"Evacuation Center","lines":["If self-evacuation becomes possible, direct the caller to the nearest barangay-designated evacuation center rather than a random location, so responders and family can find them."],"asks":[]}],"kind":"interrogation"},{"roman":"IX","heading":"AFTER THE WATER RECEDES — FOLLOW-UP ADVISORY","prompts":[{"label":"Leptospirosis Warning","lines":["\"If you or anyone in your household waded through floodwater, especially with any cuts or open wounds, watch for fever, muscle pain, chills, or headache in the days after — seek medical care right away and tell them you were exposed to floodwater. This is a real risk here, not a precaution to brush off.\""],"asks":["\"If you or anyone in your household waded through floodwater, especially with any cuts or open wounds, watch for fever, muscle pain, chills, or headache in the days after — seek medical care right away and tell them you were exposed to floodwater. This is a real risk here, not a precaution to brush off.\""]},{"label":"General Follow-Up","lines":["\"Boil or treat drinking water until your water supply is confirmed safe, and avoid letting floodwater contact any open wound.\""],"asks":["\"Boil or treat drinking water until your water supply is confirmed safe, and avoid letting floodwater contact any open wound.\""]}],"kind":"interrogation"}],"counts":{"sections":9,"prompts":20,"lines":21,"quoted_asks":14},"localize_flags":["[LOCALIZE: example]"]},{"file":"DISASTER_Maritime-Ferry-Emergency.html","discipline":"DISASTER","title":"911 Dispatch Protocol: Maritime / Ferry Emergency (Mass Casualty)","subtitle":null,"sections":[{"roman":"I","heading":"INITIAL CALL RECEIPT","prompts":[{"label":"Location & Callback — Every Call, First","lines":["“Where is your emergency? Give me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"],"asks":["“Where is your emergency? Give me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"]},{"label":"Nature of Report","lines":["\"Is this call about a boat or ferry — is it sinking, capsized, on fire, or overloaded?\""],"asks":["\"Is this call about a boat or ferry — is it sinking, capsized, on fire, or overloaded?\""]}],"kind":"interrogation"},{"roman":"II","heading":"VESSEL IDENTIFICATION","prompts":[{"label":"Vessel Details","lines":["\"What is the name of the vessel? Is it a passenger ferry, a inter-island RORO, or a bangka (outrigger boat)?\"","\"What is the route — where did it depart from, and where was it headed?\""],"asks":["\"What is the name of the vessel? Is it a passenger ferry, a inter-island RORO, or a bangka (outrigger boat)?\"","\"What is the route — where did it depart from, and where was it headed?\""]}],"kind":"interrogation"},{"roman":"III","heading":"VESSEL POSITION AND STATUS","prompts":[{"label":"Location and Condition","lines":["\"What is the last known position of the vessel — GPS coordinates if available, or distance and direction from the nearest port or landmark?\"","\"What time did it depart, and when was it due to arrive?\""],"asks":["\"What is the last known position of the vessel — GPS coordinates if available, or distance and direction from the nearest port or landmark?\"","\"What time did it depart, and when was it due to arrive?\""]}],"kind":"interrogation"},{"roman":"IV","heading":"PERSONS ABOARD","prompts":[{"label":"Passenger and Crew Count","lines":["\"About how many people were aboard — passengers and crew?\"","Treat manifest and headcounts as approximate. Callers will often say \"mga\" before a number (\"mga sampu ang pasahero\" — about ten passengers) — this is an estimate, not a verified count, especially for bangka trips that rarely keep a formal manifest."],"asks":["\"About how many people were aboard — passengers and crew?\""]}],"kind":"interrogation"},{"roman":"V","heading":"LIFE SAFETY EQUIPMENT","prompts":[{"label":"Life Jackets and Equipment","lines":["\"Were life jackets available and worn? How many, if known?\"","\"Are there life rafts, ring buoys, or working lights and flares on board?\""],"asks":["\"Were life jackets available and worn? How many, if known?\"","\"Are there life rafts, ring buoys, or working lights and flares on board?\""]}],"kind":"interrogation"},{"roman":"VI","heading":"PERSONS IN THE WATER","prompts":[{"label":"In-Water Victims","lines":["\"Are there people already in the water? About how many?\"","\"Are they conscious, swimming, or floating in place? Are they grouped together or scattered?\""],"asks":["\"Are there people already in the water? About how many?\"","\"Are they conscious, swimming, or floating in place? Are they grouped together or scattered?\""]}],"kind":"interrogation"},{"roman":"VII","heading":"PHILIPPINE COAST GUARD NOTIFICATION","prompts":[{"label":"Lead Agency Activation","lines":["The Philippine Coast Guard (PCG) is the lead agency for maritime search and rescue. Notify the nearest PCG station or National Coast Watch Center immediately with vessel name, route, last known position, and persons-aboard estimate."],"asks":[]}],"kind":"interrogation"},{"roman":"VIII","heading":"PARALLEL EMS AND AGENCY STAGING","prompts":[{"label":"Simultaneous Dispatch","lines":["Stage EMS for a mass-casualty response at the nearest functioning port or pier — do not wait for PCG confirmation before beginning EMS staging."],"asks":[]}],"kind":"interrogation"},{"roman":"IX","heading":"NIGHT AND WEATHER FACTORS","prompts":[{"label":"Conditions Affecting Rescue","lines":["\"Is it currently daylight or dark? What is the sea condition — calm, choppy, or rough? Is it raining or windy?\""],"asks":["\"Is it currently daylight or dark? What is the sea condition — calm, choppy, or rough? Is it raining or windy?\""]}],"kind":"interrogation"},{"roman":"X","heading":"INSTRUCTIONS FOR A CALLER IN THE WATER","prompts":[{"label":"In-Water Survival","lines":["\"Put on a life jacket now if you have one and are not already wearing it.\"","\"Do not remove your clothes or shoes — they help you float and stay warm.\"","\"If the vessel or any large floating debris is still on the surface, stay with it — do not swim away from it.\"","\"If there are other people near you, group together — it keeps you warmer and easier to spot.\""],"asks":["\"Put on a life jacket now if you have one and are not already wearing it.\"","\"Do not remove your clothes or shoes — they help you float and stay warm.\"","\"If the vessel or any large floating debris is still on the surface, stay with it — do not swim away from it.\"","\"If there are other people near you, group together — it keeps you warmer and easier to spot.\""]}],"kind":"interrogation"},{"roman":"XI","heading":"INSTRUCTIONS FOR A CALLER STILL ABOARD","prompts":[{"label":"Onboard Safety","lines":["\"Move to the vessel's designated assembly or muster point if it is safe to do so.\"","\"Life jackets should go to children and elderly passengers first.\"","\"Do not jump or abandon the vessel unless the crew or captain instructs you to — stay with the vessel as long as it is safe.\""],"asks":["\"Move to the vessel's designated assembly or muster point if it is safe to do so.\"","\"Life jackets should go to children and elderly passengers first.\"","\"Do not jump or abandon the vessel unless the crew or captain instructs you to — stay with the vessel as long as it is safe.\""]}],"kind":"interrogation"},{"roman":"XII","heading":"FOLLOW-UP AND MONITORING","prompts":[{"label":"Ongoing Contact","lines":["\"Stay on the line if you can. Tell me if your position changes or if you spot other survivors.\""],"asks":["\"Stay on the line if you can. Tell me if your position changes or if you spot other survivors.\""]}],"kind":"interrogation"}],"counts":{"sections":12,"prompts":13,"lines":24,"quoted_asks":21},"localize_flags":["[LOCALIZE: example]"],"crosslinks":[{"section":"VI","prompt":"In-Water Victims","when":"unresponsive in the water","skills":["EMS_CPR-Adult.html","EMS_CPR-Child.html","EMS_CPR-Infant.html","EMS_Monitoring-ABCs.html"]}]},{"file":"DISASTER_Storm-Surge.html","discipline":"DISASTER","title":"911 Dispatch Protocol: Storm Surge / Coastal Flooding","subtitle":null,"sections":[{"roman":"I","heading":"INITIAL CALL RECEIPT","prompts":[{"label":"Location & Callback — Every Call, First","lines":["“Where is your emergency? Give me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"],"asks":["“Where is your emergency? Give me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"]},{"label":"Location Confirmation","lines":["Get barangay, then purok/sitio, then the nearest landmark, and specifically the caller's distance from the shoreline. Coastal barangays are often the ones losing signal first as a typhoon closes in, so capture this before anything else."],"asks":[]}],"kind":"interrogation"},{"roman":"II","heading":"THREAT RECOGNITION","prompts":[{"label":"This Is Not An Ordinary Flood","lines":["A storm surge is seawater pushed inland by a typhoon's wind and pressure — it is a different, faster, and far more dangerous event than a river or rainfall flood, and a caller who says \"bumabaha\" near the coast during a typhoon may not realize which one they are describing. Ask directly: \"Is the water coming from the sea, and is it rising very fast?\""],"asks":[]},{"label":"Warning Status","lines":["\"Do you know if PAGASA has issued a storm surge warning or advisory for your coastal area?\""],"asks":["\"Do you know if PAGASA has issued a storm surge warning or advisory for your coastal area?\""]}],"kind":"interrogation"},{"roman":"III","heading":"HOUSEHOLD ASSESSMENT","prompts":[{"label":"Exposure","lines":["\"About how far are you from the shoreline — can you estimate in meters?\""],"asks":["\"About how far are you from the shoreline — can you estimate in meters?\""]},{"label":"Household Mobility","lines":["\"Who is with you, and can everyone move quickly — are there elderly, children, or persons with disability who will need help evacuating?\""],"asks":["\"Who is with you, and can everyone move quickly — are there elderly, children, or persons with disability who will need help evacuating?\""]}],"kind":"interrogation"},{"roman":"IV","heading":"EVACUATION STATUS","prompts":[{"label":"Current Movement","lines":["\"Have you already started evacuating? Are you heading inland, or moving up to a higher floor of a strong building?\""],"asks":["\"Have you already started evacuating? Are you heading inland, or moving up to a higher floor of a strong building?\""]}],"kind":"interrogation"},{"roman":"V","heading":"DISPATCH COORDINATION","prompts":[{"label":"Barangay Forced-Evacuation Coordination","lines":["Relay households that are not moving in a designated high-risk coastal zone to the barangay captain immediately — forced evacuation of at-risk coastal households is coordinated at the barangay/LGU level, and the barangay captain's team may be the only ones able to reach a household in time."],"asks":[]},{"label":"LGU DRRMO / NDRRMC","lines":["Log the call with the LGU DRRMO for evacuation-center capacity and routing, and ensure it feeds NDRRMC's monitoring picture for the affected coastline."],"asks":[]},{"label":"Maritime Advisory","lines":["If any boats or fishing vessels are still out or docked near the affected coast, relay to the Philippine Coast Guard for a maritime advisory."],"asks":[]}],"kind":"interrogation"},{"roman":"VI","heading":"IMMEDIATE EVACUATION INSTRUCTIONS","prompts":[{"label":"Move Now, Not When You See Water","lines":["\"If a storm surge warning is in effect for your area, evacuate now — move inland, or to the upper floor of the strongest, most solid concrete building nearby. Do not wait until you can see the water — a storm surge can arrive faster than you can react.\""],"asks":["\"If a storm surge warning is in effect for your area, evacuate now — move inland, or to the upper floor of the strongest, most solid concrete building nearby. Do not wait until you can see the water — a storm surge can arrive faster than you can react.\""]},{"label":"Timing","lines":["\"Leave while the wind and roads still allow you to move safely — once the typhoon's winds intensify, evacuation becomes much harder and much more dangerous.\""],"asks":["\"Leave while the wind and roads still allow you to move safely — once the typhoon's winds intensify, evacuation becomes much harder and much more dangerous.\""]}],"kind":"interrogation"},{"roman":"VII","heading":"IF EVACUATION IS NO LONGER POSSIBLE","prompts":[{"label":"Vertical Shelter As A Last Resort","lines":["\"If you truly cannot leave, go to the highest, most interior part of the strongest structure you have access to, away from any windows or walls facing the sea.\""],"asks":["\"If you truly cannot leave, go to the highest, most interior part of the strongest structure you have access to, away from any windows or walls facing the sea.\""]}],"kind":"interrogation"},{"roman":"VIII","heading":"WHY THIS IS DIFFERENT FROM A REGULAR FLOOD","prompts":[{"label":"Reinforce The Distinction","lines":["\"This is seawater being pushed in by the storm, not rainwater — it can rise very fast and very high along the coast. Please don't wait to see how bad it gets.\""],"asks":["\"This is seawater being pushed in by the storm, not rainwater — it can rise very fast and very high along the coast. Please don't wait to see how bad it gets.\""]}],"kind":"interrogation"}],"counts":{"sections":8,"prompts":14,"lines":15,"quoted_asks":10},"localize_flags":["[LOCALIZE: example]"]},{"file":"DISASTER_Tsunami.html","discipline":"DISASTER","title":"911 Dispatch Protocol: Tsunami Warning / Coastal Evacuation","subtitle":null,"sections":[{"roman":"I","heading":"INITIAL CALL RECEIPT","prompts":[{"label":"Location & Callback — Every Call, First","lines":["“Where is your emergency? Give me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"],"asks":["“Where is your emergency? Give me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"]},{"label":"Location Confirmation","lines":["Get barangay, purok/sitio, and nearest coastal landmark immediately. Ask directly: \"How far are you from the shoreline right now, and how high above sea level is your location?\""],"asks":[]},{"label":"Reason for the Call","lines":["\"What made you call — did you feel an earthquake, hear an official warning, or see something unusual happening with the sea?\""],"asks":["\"What made you call — did you feel an earthquake, hear an official warning, or see something unusual happening with the sea?\""]}],"kind":"interrogation"},{"roman":"II","heading":"ASSESSMENT OF THE WARNING SOURCE","prompts":[{"label":"Local-Source Earthquake (Self-Warning)","lines":["If the caller felt a strong or long-lasting earthquake near the coast, treat this as an active tsunami threat immediately — a local-source tsunami can arrive in minutes, faster than any official alert can be issued. Do not wait for a PHIVOLCS bulletin before instructing evacuation."],"asks":[]},{"label":"Natural Warning Signs","lines":["\"Did you notice the sea pulling back or receding unusually far from the shore?\""],"asks":["\"Did you notice the sea pulling back or receding unusually far from the shore?\""]},{"label":"Official Alert","lines":["\"Has PHIVOLCS or your barangay issued an official tsunami warning or sounded a siren?\" — treat any of the three triggers above (felt quake, natural signs, or official alert) as sufficient grounds to instruct immediate evacuation."],"asks":["\"Has PHIVOLCS or your barangay issued an official tsunami warning or sounded a siren?\" — treat any of the three triggers above (felt quake, natural signs, or official alert) as sufficient grounds to instruct immediate evacuation."]}],"kind":"interrogation"},{"roman":"III","heading":"CALLER LOCATION & EXPOSURE","prompts":[{"label":"Exposure Check","lines":["\"Are you in a house, a multi-story building, or in the open along the shore?\""],"asks":["\"Are you in a house, a multi-story building, or in the open along the shore?\""]}],"kind":"interrogation"},{"roman":"IV","heading":"EVACUATION STATUS","prompts":[{"label":"Movement Check","lines":["\"Are you already moving inland or to higher ground? On foot, or by vehicle?\""],"asks":["\"Are you already moving inland or to higher ground? On foot, or by vehicle?\""]}],"kind":"interrogation"},{"roman":"V","heading":"BANGKA / BOAT OWNERS AT SEA","prompts":[{"label":"If a Family Member Is on the Water","lines":["\"If your bangka or boat is already out at sea, do NOT tell them to return to the harbor — a boat is safer riding out a tsunami in deep water than caught in a harbor or near shore when the wave arrives. Tell them to head further out to deep water and stay there until the all-clear.\""],"asks":["\"If your bangka or boat is already out at sea, do NOT tell them to return to the harbor — a boat is safer riding out a tsunami in deep water than caught in a harbor or near shore when the wave arrives. Tell them to head further out to deep water and stay there until the all-clear.\""]}],"kind":"interrogation"},{"roman":"VI","heading":"ALERT COORDINATION","prompts":[{"label":"Agency Reference","lines":["Reference the active PHIVOLCS Tsunami Advisory level for the affected coastline where known, and relay confirmed local-source events to NDRRMC, the LGU DRRMO, and Philippine Coast Guard for coordinated evacuation and maritime notification."],"asks":[]},{"label":"Mass-Event Note","lines":["A single coastal tsunami event will generate simultaneous calls from many barangays along the same shoreline at once — log location clusters so responders and barangay officials can prioritize the lowest-elevation, most exposed areas first."],"asks":[]}],"kind":"interrogation"},{"roman":"VII","heading":"IMMEDIATE EVACUATION INSTRUCTIONS","prompts":[{"label":"Move Now, Move Inland/Up","lines":["\"Move to high ground or at least several hundred meters inland right now — do not wait to gather belongings.\"","\"If the road is blocked by traffic, leave the vehicle and go on foot, or get into the tallest sturdy concrete building nearby and go to the third floor or higher.\""],"asks":["\"Move to high ground or at least several hundred meters inland right now — do not wait to gather belongings.\"","\"If the road is blocked by traffic, leave the vehicle and go on foot, or get into the tallest sturdy concrete building nearby and go to the third floor or higher.\""]}],"kind":"interrogation"},{"roman":"VIII","heading":"WAVE SERIES WARNING","prompts":[{"label":"Do Not Return After the First Wave","lines":["\"Tsunamis arrive as a series of waves, sometimes over an hour apart, and the first wave is often not the biggest. Do NOT go back down to the shore or return home after the first wave passes — stay on high ground until your barangay or PHIVOLCS gives the official all-clear.\""],"asks":["\"Tsunamis arrive as a series of waves, sometimes over an hour apart, and the first wave is often not the biggest. Do NOT go back down to the shore or return home after the first wave passes — stay on high ground until your barangay or PHIVOLCS gives the official all-clear.\""]}],"kind":"interrogation"},{"roman":"IX","heading":"FOLLOW-UP ACTIONS","prompts":[{"label":"Staying Safe and Reachable","lines":["\"Stay where you are on high ground. Keep your phone charged if you can, and listen for the barangay siren or announcement confirming it is safe to return.\""],"asks":["\"Stay where you are on high ground. Keep your phone charged if you can, and listen for the barangay siren or announcement confirming it is safe to return.\""]}],"kind":"interrogation"}],"counts":{"sections":9,"prompts":14,"lines":16,"quoted_asks":12},"localize_flags":["[LOCALIZE: example]"]},{"file":"DISASTER_Typhoon.html","discipline":"DISASTER","title":"911 Dispatch Protocol: Typhoon / Tropical Cyclone (Signal 1–5)","subtitle":null,"sections":[{"roman":"I","heading":"INITIAL CALL RECEIPT","prompts":[{"label":"Location & Callback — Every Call, First","lines":["“Where is your emergency? Give me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"],"asks":["“Where is your emergency? Give me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"]},{"label":"Location Confirmation","lines":["Get the caller's barangay, then purok/sitio, then the nearest landmark (\"tapat ng sari-sari store,\" \"likod ng simbahan\"). Do not wait for a street address — many areas do not have one, and during a typhoon the caller may lose signal before giving more detail, so take the landmark first."],"asks":[]},{"label":"Caller Safety Check","lines":["\"Are you safe right now, at this moment?\""],"asks":["\"Are you safe right now, at this moment?\""]}],"kind":"interrogation"},{"roman":"II","heading":"STORM PHASE ASSESSMENT","prompts":[{"label":"Where Are We In The Storm","lines":["\"Has the typhoon already reached your area, or are you calling to prepare before it arrives?\""],"asks":["\"Has the typhoon already reached your area, or are you calling to prepare before it arrives?\""]},{"label":"PAGASA Signal Level","lines":["\"Do you know what Wind Signal number PAGASA has raised for your area?\" — log the number if the caller knows it; if not, dispatch determines it from the current PAGASA bulletin for that province/city. The signal number (1 lowest to 5 highest) sets both the caller-safety guidance you give and whether units can be sent right now."],"asks":["\"Do you know what Wind Signal number PAGASA has raised for your area?\" — log the number if the caller knows it; if not, dispatch determines it from the current PAGASA bulletin for that province/city. The signal number (1 lowest to 5 highest) sets both the caller-safety guidance you give and whether units can be sent right now."]}],"kind":"interrogation"},{"roman":"III","heading":"NATURE OF THE EMERGENCY","prompts":[{"label":"Pre-Landfall Calls","lines":["\"Are you calling because you need to evacuate, or because you need help securing your home before the storm hits?\""],"asks":["\"Are you calling because you need to evacuate, or because you need help securing your home before the storm hits?\""]},{"label":"During-Storm Calls","lines":["\"What is happening right now — is your roof damaged or gone, is anyone trapped, are there fallen trees or electrical lines?\""],"asks":["\"What is happening right now — is your roof damaged or gone, is anyone trapped, are there fallen trees or electrical lines?\""]}],"kind":"interrogation"},{"roman":"IV","heading":"SAFETY ASSESSMENT","prompts":[{"label":"Responder Rollout Feasibility","lines":["While winds remain at damaging levels for the caller's signal area, responders may NOT be able to roll safely — explain this plainly to the caller rather than promising an immediate arrival: \"Our teams cannot travel safely in winds this strong right now. I am going to help you stay as safe as possible until conditions allow them to reach you.\""],"asks":[]},{"label":"Household At-Risk Members","lines":["\"Who is with you right now — are there elderly, children, persons with disability, or anyone who cannot move quickly on their own?\""],"asks":["\"Who is with you right now — are there elderly, children, persons with disability, or anyone who cannot move quickly on their own?\""]}],"kind":"interrogation"},{"roman":"V","heading":"COMMUNICATION STATUS","prompts":[{"label":"Signal & Power Loss Risk","lines":["Power and cell signal commonly fail together during typhoons, sometimes for an entire province. Get the exact location, the callback number, and every critical instruction out early — front-load your instructions because this call may drop and not reconnect."],"asks":[]},{"label":"Battery Status","lines":["\"How much battery does your phone have left?\" — if low, prioritize getting location and the household's immediate needs before anything else."],"asks":["\"How much battery does your phone have left?\" — if low, prioritize getting location and the household's immediate needs before anything else."]}],"kind":"interrogation"},{"roman":"VI","heading":"DISPATCH COORDINATION","prompts":[{"label":"Barangay & LGU Coordination","lines":["Notify the barangay hall/tanod covering the caller's purok/sitio — they are frequently the first and only responder reachable during the height of a storm, and can confirm conditions before a unit is committed."],"asks":[]},{"label":"Hold-and-Stage Decision","lines":["If winds at the caller's location exceed safe travel conditions for the responding agency, stage units and hold dispatch until the signal level drops, while keeping the caller on self-protection instructions below. Re-attempt callback as soon as conditions and signal allow."],"asks":[]},{"label":"Evacuation Center Reference","lines":["If the caller has not evacuated and is in a designated risk area, confirm the nearest barangay-designated evacuation center from the LGU DRRMO list and relay the route."],"asks":[]}],"kind":"interrogation"},{"roman":"VII","heading":"PRE-LANDFALL INSTRUCTIONS","prompts":[{"label":"Evacuate Early, Not Late","lines":["\"If you are in a low-lying, coastal, riverside, or landslide-prone area, go now to your barangay evacuation center — do not wait until the wind or water arrives.\""],"asks":["\"If you are in a low-lying, coastal, riverside, or landslide-prone area, go now to your barangay evacuation center — do not wait until the wind or water arrives.\""]},{"label":"Securing The Home (If Staying, Not In A Risk Zone)","lines":["\"Secure or bring inside anything loose that can be blown around — roofing sheets, furniture, tanks, signage.\""],"asks":["\"Secure or bring inside anything loose that can be blown around — roofing sheets, furniture, tanks, signage.\""]}],"kind":"interrogation"},{"roman":"VIII","heading":"DURING-STORM SELF-PROTECTION INSTRUCTIONS","prompts":[{"label":"Shelter In Place Safely","lines":["\"Move to the most interior room of your house, away from windows, glass, and the roofline.\""],"asks":["\"Move to the most interior room of your house, away from windows, glass, and the roofline.\""]},{"label":"If The Roof Is Gone Or You Are Trapped","lines":["\"Find the lowest, most sheltered interior spot away from anything that can fall — a hallway, bathroom, or under a sturdy table.\""],"asks":["\"Find the lowest, most sheltered interior spot away from anything that can fall — a hallway, bathroom, or under a sturdy table.\""]},{"label":"Electrical & Debris Hazards","lines":["\"Stay away from any downed electrical lines or damaged wiring, even if the power looks off — treat every wire as live.\""],"asks":["\"Stay away from any downed electrical lines or damaged wiring, even if the power looks off — treat every wire as live.\""]}],"kind":"interrogation"},{"roman":"IX","heading":"POST-STORM / FOLLOW-UP","prompts":[{"label":"Expect A Surge In Calls","lines":["Call volume rises sharply once winds drop — structural damage, trapped persons, injuries, and downed-line reports arrive in a wave. Triage by immediate life safety first."],"asks":[]},{"label":"Caller Guidance After The Storm Passes","lines":["\"Do not walk through standing water — there may be downed lines, open holes, or debris you cannot see.\""],"asks":["\"Do not walk through standing water — there may be downed lines, open holes, or debris you cannot see.\""]}],"kind":"interrogation"}],"counts":{"sections":9,"prompts":21,"lines":22,"quoted_asks":15},"localize_flags":["[LOCALIZE: example]"]},{"file":"DISASTER_Volcanic-Eruption-Ashfall.html","discipline":"DISASTER","title":"911 Dispatch Protocol: Volcanic Eruption / Ashfall","subtitle":"PHIVOLCS Alert Levels 0–5","sections":[{"roman":"I","heading":"INITIAL CALL RECEIPT","prompts":[{"label":"Location & Callback — Every Call, First","lines":["“Where is your emergency? Give me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"],"asks":["“Where is your emergency? Give me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"]},{"label":"Location & Volcano Confirmation","lines":["\"What is your barangay, purok/sitio, and nearest landmark?\""],"asks":["\"What is your barangay, purok/sitio, and nearest landmark?\""]}],"kind":"interrogation"},{"roman":"II","heading":"ASSESSMENT OF ACTIVITY","prompts":[{"label":"What the Caller Observed","lines":["\"Is ash currently falling where you are? How heavy — light dusting, or thick enough that it's hard to see?\""],"asks":["\"Is ash currently falling where you are? How heavy — light dusting, or thick enough that it's hard to see?\""]},{"label":"Alert Level Context (for dispatcher reference)","lines":["PHIVOLCS uses Alert Levels 0–5 for each active volcano — roughly: 0 (quiet), 1 (low unrest), 2–3 (increasing unrest, hazardous eruption possible within weeks), 4 (hazardous eruption imminent, within days), 5 (eruption in progress). Alert Level 3 and above typically triggers evacuation of the Permanent Danger Zone; ask the caller if their barangay has been named in an evacuation advisory."],"asks":[]}],"kind":"interrogation"},{"roman":"III","heading":"ASHFALL SYMPTOMS","prompts":[{"label":"Respiratory Distress","lines":["\"Is anyone having trouble breathing (hindi makahinga), coughing heavily, or experiencing eye or throat irritation from the ash?\""],"asks":["\"Is anyone having trouble breathing (hindi makahinga), coughing heavily, or experiencing eye or throat irritation from the ash?\""]}],"kind":"interrogation"},{"roman":"IV","heading":"STRUCTURAL RISK FROM ASH","prompts":[{"label":"Roof Load Check","lines":["\"How thick is the ash accumulating on your roof? Wet ash is much heavier than dry ash and can collapse a roof.\""],"asks":["\"How thick is the ash accumulating on your roof? Wet ash is much heavier than dry ash and can collapse a roof.\""]}],"kind":"interrogation"},{"roman":"V","heading":"LAHAR (MUDFLOW) RISK","prompts":[{"label":"River/Creek Channel Proximity","lines":["\"Are you near a river, creek, or channel that drains from the volcano?\"","\"Is it raining now, or has it rained recently? Rain on loose ash deposits can trigger a lahar — a fast-moving wall of volcanic mud and debris — with little warning.\""],"asks":["\"Are you near a river, creek, or channel that drains from the volcano?\"","\"Is it raining now, or has it rained recently? Rain on loose ash deposits can trigger a lahar — a fast-moving wall of volcanic mud and debris — with little warning.\""]}],"kind":"interrogation"},{"roman":"VI","heading":"EVACUATION COORDINATION","prompts":[{"label":"Danger Zone Reference","lines":["Barangays inside the Permanent Danger Zone or Extended Danger Zone for the applicable Alert Level are evacuated proactively by the LGU DRRMO and barangay officials, often before individual emergency calls come in — confirm whether the caller's barangay has already been ordered to evacuate."],"asks":[]},{"label":"Evacuation Center & Livestock Coordination","lines":["Relay households needing transport to the barangay hall/LGU DRRMO for evacuation center placement. Note that many families delay evacuation over livestock (carabao, pigs, poultry) — acknowledge the concern and relay it to LGU DRRMO, which may coordinate separate livestock holding areas, rather than letting it stall the family's own evacuation."],"asks":[]}],"kind":"interrogation"},{"roman":"VII","heading":"RESPIRATORY PROTECTION","prompts":[{"label":"Immediate Instructions","lines":["\"Stay indoors and close all doors and windows to keep ash out.\"","\"Cover your nose and mouth with a damp cloth or an N95 mask if you have one, especially anyone with breathing difficulty.\""],"asks":["\"Stay indoors and close all doors and windows to keep ash out.\"","\"Cover your nose and mouth with a damp cloth or an N95 mask if you have one, especially anyone with breathing difficulty.\""]}],"kind":"interrogation"},{"roman":"VIII","heading":"ROOF & STRUCTURE SAFETY","prompts":[{"label":"Clearing Ash Safely","lines":["\"If it is safe and the ash is not yet too thick, you can carefully shovel wet ash off a flat or low-slope roof to reduce the weight — but do not climb onto a roof that is already sagging or creaking.\""],"asks":["\"If it is safe and the ash is not yet too thick, you can carefully shovel wet ash off a flat or low-slope roof to reduce the weight — but do not climb onto a roof that is already sagging or creaking.\""]}],"kind":"interrogation"},{"roman":"IX","heading":"DRIVING & WATER SAFETY","prompts":[{"label":"Driving in Ashfall","lines":["\"Avoid driving if possible — ashfall reduces visibility to near zero and makes roads slippery. If you must drive, go slowly, use your headlights, and use your wipers and a small amount of water to clear the windshield rather than wiping dry ash across the glass.\""],"asks":["\"Avoid driving if possible — ashfall reduces visibility to near zero and makes roads slippery. If you must drive, go slowly, use your headlights, and use your wipers and a small amount of water to clear the windshield rather than wiping dry ash across the glass.\""]},{"label":"Protecting Drinking Water","lines":["\"Cover any open water containers, tanks, or wells to keep ash out. If ash has already fallen into your drinking water, do not drink it — use a covered or alternate source until it can be checked.\""],"asks":["\"Cover any open water containers, tanks, or wells to keep ash out. If ash has already fallen into your drinking water, do not drink it — use a covered or alternate source until it can be checked.\""]}],"kind":"interrogation"},{"roman":"X","heading":"IF NEAR A RIVER CHANNEL (LAHAR)","prompts":[{"label":"Lahar Evacuation","lines":["\"If you are near a river or creek that drains from the volcano and it is raining now or has rained recently, move away from the channel and to higher ground immediately — do not wait to see the lahar arrive, and never attempt to cross a channel that is running with ash-laden water.\""],"asks":["\"If you are near a river or creek that drains from the volcano and it is raining now or has rained recently, move away from the channel and to higher ground immediately — do not wait to see the lahar arrive, and never attempt to cross a channel that is running with ash-laden water.\""]}],"kind":"interrogation"}],"counts":{"sections":10,"prompts":14,"lines":17,"quoted_asks":14},"localize_flags":["[LOCALIZE: example]"]},{"file":"EMS_AED-Instructions.html","discipline":"EMS","title":"911 Dispatch Protocol: AED Instructions","subtitle":"Skill Script · Step-by-Step Procedure","sections":[{"roman":"I","heading":"INITIAL CALL RECEIPT","kind":"procedure","prompts":[{"label":"Location Confirmation","lines":["Immediately confirm the caller’s exact location — barangay, street or landmark, and floor or unit — so responders are dispatched accurately."],"asks":[]},{"label":"Location Confirmation","step":"1","lines":["Verify the caller’s location to ensure emergency services are dispatched to the correct address."],"asks":[]},{"label":"Callback Number","lines":["Verify the number the caller is calling from, in case the call is disconnected."],"asks":[]},{"label":"Assessment of the Situation","step":"2","lines":["Quickly determine the need for AED use by identifying if the patient is unresponsive and not breathing normally."],"asks":[]}]},{"roman":"II","heading":"AED DEPLOYMENT INSTRUCTIONS","kind":"procedure","prompts":[{"label":"Locating the AED","step":"3","lines":["Instruct the caller to find an AED if not already located. Provide directions to the nearest AED if known and accessible."],"asks":[]},{"label":"Sending for Help","step":"4","lines":["If there are other people nearby, instruct someone to retrieve the AED while the caller stays with the patient."],"asks":[]}]},{"roman":"III","heading":"PREPARING TO USE THE AED","kind":"procedure","prompts":[{"label":"Powering On","step":"5","lines":["Tell the caller to turn on the AED. The device will provide verbal instructions."],"asks":[]},{"label":"Bare Chest Preparation","step":"6","lines":["Instruct the caller to remove any clothing from the patient’s chest. Check for and remove any medication patches or metallic items."],"asks":[]}]},{"roman":"IV","heading":"PAD PLACEMENT","kind":"procedure","prompts":[{"label":"Applying Pads","step":"7","lines":["Guide the caller to place the AED pads on the patient’s bare chest:","One pad on the right side of the chest, just below the collarbone.","The other pad on the lower left side of the chest."],"asks":[]},{"label":"Positioning for Children or Infants","step":"8","lines":["If the patient is a child under 8 years or weighs less than 55 pounds, use pediatric pads if available. If not, use adult pads and ensure they do not touch each other."],"asks":[]}]},{"roman":"V","heading":"ANALYZING AND SHOCK DELIVERY","kind":"procedure","prompts":[{"label":"Clear the Area","step":"9","lines":["Ensure that everyone is clear of the patient. Instruct the caller to loudly announce, “Stand clear!”"],"asks":[]},{"label":"Press Shock Button","step":"10","lines":["If the AED advises a shock, ensure that nobody is touching the patient and tell the caller to press the shock button."],"asks":[]}]},{"roman":"VI","heading":"POST-SHOCK GUIDANCE","kind":"procedure","prompts":[{"label":"CPR Instructions","step":"11","lines":["After delivering a shock, or if no shock is advised, instruct the caller to begin CPR immediately, guided by the dispatcher if necessary."],"asks":[]},{"label":"Continued Monitoring","step":"12","lines":["Instruct the caller to continue following the AED’s prompts. If additional shocks are indicated, repeat the safety checks and shock delivery process."],"asks":[]}]},{"roman":"VII","heading":"ARRIVAL OF EMERGENCY SERVICES","kind":"procedure","prompts":[{"label":"Handover","step":"13","lines":["Once emergency services arrive, instruct the caller to inform them about the actions taken and any shocks delivered."],"asks":[]},{"label":"Stay on the Line","step":"14","lines":["Encourage the caller to stay on the line until help has taken over and they are told they can hang up."],"asks":[]}]},{"roman":"VIII","heading":"CALL CONCLUSION","kind":"procedure","prompts":[{"label":"Documentation","step":"15","lines":["Ensure detailed documentation of all steps taken and instructions given during the call."],"asks":[]},{"label":"Debrief the Caller","step":"16","lines":["Thank the caller for their bravery and cooperation in a stressful situation."],"asks":[]},{"label":"Dispatcher Review","step":"17","lines":["After the call, review the process to ensure all procedures were followed correctly and to discuss any improvements for future responses."],"asks":[]}]},{"roman":"IX","heading":"CPR INTEGRATION","kind":"procedure","prompts":[{"label":"Cross-Referencing CPR Protocols","step":"18","lines":["Immediately after an AED shock is delivered or if no shock is advised, instruct the caller to begin CPR. The dispatcher must cross-reference the latest CPR protocols to provide accurate, step-by-step guidance to the caller. This includes:","Compression-Only CPR: For untrained callers, instruct them to perform hands-only CPR at a rate of 100 to 120 compressions per minute. Explain the proper hand placement and depth.","Full CPR: For callers trained in CPR, instruct them to give 30 compressions followed by two rescue breaths. Continue to guide them through the cycles."],"asks":[]},{"label":"Regular Updates","step":"19","lines":["Regularly update CPR protocols in the dispatch system to reflect current guidelines from authoritative sources like the American Heart Association or equivalent."],"asks":[]}]}],"counts":{"sections":9,"prompts":21,"lines":25,"quoted_asks":0},"localize_flags":["[LOCALIZE: example]"]},{"file":"EMS_Abdominal-Pain.html","discipline":"EMS","title":"911 Dispatch Protocol: Abdominal Pain","subtitle":null,"sections":[{"roman":"I","heading":"INITIAL ASSESSMENT","prompts":[{"label":"Location & Callback — Every Call, First","lines":["“Where is your emergency? Give me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"],"asks":["“Where is your emergency? Give me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"]},{"label":"Age","lines":["How old is the patient?"],"asks":[]},{"label":"Consciousness","lines":["Is the patient alert and able to speak?"],"asks":[]},{"label":"Breathing","lines":["Is the patient breathing normally?"],"asks":[]},{"label":"Gender","lines":["What is the patient's gender?"],"asks":[]}],"kind":"interrogation"},{"roman":"II","heading":"ASSESSMENT QUESTIONS","prompts":[{"label":"Chest Pain Presence","lines":["Does the patient have any chest pain?"],"asks":[]},{"label":"Signs of Shock or Distress","lines":["Is the patient experiencing symptoms like faintness, dizziness, excessive sweating, or appearing pale?"],"asks":[]},{"label":"Potential Pregnancy","lines":["Is there any possibility that the patient could be pregnant?"],"asks":[]},{"label":"Communication Abilities","lines":["Can the patient still talk and respond clearly?"],"asks":[]},{"label":"Recent Physical Trauma","lines":["Has the patient had any recent injuries or surgeries?"],"asks":[]}],"kind":"interrogation"},{"roman":"III","heading":"SECONDARY ASSESSMENT QUESTIONS","prompts":[{"label":"Pain Location","lines":["Where exactly is the pain located in the abdomen?"],"asks":[]},{"label":"Medical History","lines":["Has the patient had similar symptoms in the past?"],"asks":[]},{"label":"Gastrointestinal Symptoms","lines":["Has the patient vomited blood or had any bloody or black bowel movements?"],"asks":[]},{"label":"Substance Use","lines":["Has the patient recently taken any medications, drugs, or alcohol?"],"asks":[]}],"kind":"interrogation"},{"roman":"IV","heading":"PRE-ARRIVAL INSTRUCTIONS","prompts":[{"label":"Patient Mobility","lines":["Avoid moving the patient. If movement is necessary, it should be minimized."],"asks":[]},{"label":"Clothing and Comfort","lines":["Loosen any tight clothing to alleviate discomfort."],"asks":[]},{"label":"Dietary Restrictions","lines":["Do not give the patient anything to eat or drink, even if they request it and are conscious."],"asks":[]}],"kind":"interrogation"},{"roman":"V","heading":"ADDITIONAL CONSIDERATIONS","prompts":[{"label":"Vital Signs Confirmation","lines":["Re-confirm the patient's vital signs as needed to monitor for any changes or deterioration."],"asks":[]},{"label":"Age and Gender Relevance","lines":["Double-check the age and gender details provided, as these may influence the seriousness of potential cardiac issues and appropriate medical response."],"asks":[]}],"kind":"interrogation"}],"counts":{"sections":5,"prompts":19,"lines":20,"quoted_asks":2},"localize_flags":["[LOCALIZE: example]"]},{"file":"EMS_Allergic-Reaction-Sting.html","discipline":"EMS","title":"911 Dispatch Protocol: Allergic Reaction / Sting","subtitle":null,"sections":[{"roman":"I","heading":"VITAL SIGNS ASSESSMENT","prompts":[{"label":"Location & Callback — Every Call, First","lines":["“Where is your emergency? Give me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"],"asks":["“Where is your emergency? Give me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"]},{"label":"Age","lines":["How old is the patient?"],"asks":[]},{"label":"Consciousness","lines":["Is the patient awake and able to speak?"],"asks":[]},{"label":"Breathing","lines":["Is the patient having any trouble breathing or swallowing?"],"asks":[]},{"label":"Gender","lines":["What is the patient's gender?"],"asks":[]}],"kind":"interrogation"},{"roman":"II","heading":"PRIMARY ASSESSMENT QUESTIONS","prompts":[{"label":"Exposure","lines":["What were they exposed to — food, an insect sting, a medication, or something unknown? When?"],"asks":[]},{"label":"Severe Signs — Anaphylaxis","lines":["Any swelling of the face, lips, or tongue? Tightness in the throat? Wheezing or trouble breathing? Widespread hives? (Any of these = severe reaction.)"],"asks":[]},{"label":"How Fast","lines":["Are the symptoms getting worse? How quickly?"],"asks":[]}],"kind":"interrogation"},{"roman":"III","heading":"SECONDARY ASSESSMENT QUESTIONS","prompts":[{"label":"History","lines":["Does the patient have a known allergy? Have they had a severe reaction before?"],"asks":[]},{"label":"Epinephrine Auto-Injector","lines":["Does the patient have an epinephrine auto-injector (EpiPen) with them or nearby?"],"asks":[]},{"label":"Stinger","lines":["If a sting: is the stinger still in the skin?"],"asks":[]}],"kind":"interrogation"},{"roman":"IV","heading":"PRE-ARRIVAL INSTRUCTIONS","prompts":[{"label":"Severe Reaction — Use the Auto-Injector Now","lines":["If there is trouble breathing or swelling of the face or throat and an auto-injector is available: use it now — I will talk you through it step by step."],"asks":[]},{"label":"Position","lines":["Trouble breathing: let them sit upright. Feeling faint, pale, or weak: lie them flat and raise the legs — and watch for shock."],"asks":[]},{"label":"Nothing by Mouth","lines":["If there is any swelling or trouble swallowing, give nothing to eat or drink."],"asks":[]},{"label":"Sting Care","lines":["Scrape the stinger out sideways with a card edge or fingernail — do not squeeze it. A cold pack over the site helps swelling."],"asks":[]},{"label":"Stay on the Line — It Can Come Back","lines":["Severe reactions can ease and then return. Stay with the patient and stay on the line with me; if they become unresponsive or stop breathing normally, tell me immediately — I will guide you through CPR."],"asks":[]}],"kind":"interrogation"}],"localize_flags":[],"crosslinks":[{"section":"IV","prompt":"Severe Reaction — Use the Auto-Injector Now","when":"severe reaction with auto-injector available","skills":["EMS_EpiPen-Administration.html"]},{"section":"IV","prompt":"Position","when":"faint / pale / shock signs","skills":["EMS_Treating-Shock.html"]},{"section":"IV","prompt":"Stay on the Line — It Can Come Back","when":"unresponsive / not breathing normally","skills":["EMS_CPR-Adult.html","EMS_CPR-Child.html","EMS_AED-Instructions.html"]}],"counts":{"sections":4,"prompts":16,"lines":17,"quoted_asks":2}},{"file":"EMS_Childbirth-Pregnancy.html","discipline":"EMS","title":"911 Dispatch Protocol: Childbirth / Pregnancy / Miscarriage","subtitle":null,"sections":[{"roman":"I","heading":"VITAL SIGNS ASSESSMENT","prompts":[{"label":"Location & Callback — Every Call, First","lines":["“Where is your emergency? Give me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"],"asks":["“Where is your emergency? Give me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"]},{"label":"Age","lines":["How old is the mother?"],"asks":[]},{"label":"Consciousness & Breathing","lines":["Is she awake, alert, and breathing normally?"],"asks":[]},{"label":"How Far Along","lines":["How many weeks or months pregnant is she? When is the baby due?"],"asks":[]}],"kind":"interrogation"},{"roman":"II","heading":"PRIMARY ASSESSMENT QUESTIONS","prompts":[{"label":"Contractions","lines":["Is she having contractions? How many minutes apart, and how long does each one last?"],"asks":[]},{"label":"Urge to Push / Crowning","lines":["Does she feel the urge to push or to have a bowel movement? Can you see any part of the baby? (If yes — delivery is happening; go to the instructions now.)"],"asks":[]},{"label":"Water Broken","lines":["Has her water broken? Was the fluid clear, or green/brown?"],"asks":[]},{"label":"First Baby","lines":["Is this her first baby? (Later babies often come faster.)"],"asks":[]}],"kind":"interrogation"},{"roman":"III","heading":"SECONDARY ASSESSMENT QUESTIONS","prompts":[{"label":"Bleeding","lines":["Is there heavy bleeding — soaking through pads or clothing?"],"asks":[]},{"label":"Cord Visible","lines":["Can you see the umbilical cord at the opening? (If yes — this is urgent: have her get on knees and chest, hips up, and do not touch or push the cord.)"],"asks":[]},{"label":"Complications & History","lines":["Any known complications — twins, breech, high blood pressure, prior fast deliveries?"],"asks":[]},{"label":"Under 20 Weeks / Miscarriage","lines":["If she is less than about 5 months along with bleeding or severe constant pain: treat as a medical emergency — use pads or towels, save any passed tissue for the hospital, and watch for signs of shock."],"asks":[]}],"kind":"interrogation"},{"roman":"IV","heading":"PRE-ARRIVAL INSTRUCTIONS — DELIVERY","prompts":[{"label":"Prepare","lines":["Do not try to delay or hold back the baby. Get her flat on her back or propped with pillows, clothing off below the waist, clean towels ready, hands washed if possible."],"asks":[]},{"label":"As the Baby Delivers","lines":["Support the baby's head as it comes — never pull. If the cord is around the neck, gently slip it over the head. The baby will be slippery — support the whole body."],"asks":[]},{"label":"Right After Delivery","lines":["Note the time of birth. Dry the baby vigorously and place skin-to-skin on the mother's chest, covered with something warm — head covered too. Do not cut or pull the cord."],"asks":[]},{"label":"If the Baby Is Not Crying or Breathing","lines":["Tell me immediately — rub the baby's back firmly with a towel; if the baby still is not breathing, I will guide you through infant CPR."],"asks":[]},{"label":"Placenta & Bleeding","lines":["The placenta will deliver on its own — never pull the cord. If heavy bleeding continues after delivery, firmly massage the mother's lower belly and use pads or towels; watch her for signs of shock."],"asks":[]}],"kind":"interrogation"}],"localize_flags":[],"crosslinks":[{"section":"IV","prompt":"If the Baby Is Not Crying or Breathing","when":"newborn not breathing","skills":["EMS_CPR-Infant.html"]},{"section":"IV","prompt":"Placenta & Bleeding","when":"heavy bleeding / shock signs","skills":["EMS_Treating-Shock.html"]},{"section":"III","prompt":"Under 20 Weeks / Miscarriage","when":"shock signs","skills":["EMS_Treating-Shock.html"]}],"counts":{"sections":4,"prompts":17,"lines":18,"quoted_asks":2}},{"file":"EMS_Stroke-CVA-TIA.html","discipline":"EMS","title":"911 Dispatch Protocol: Stroke (CVA) / TIA","subtitle":null,"sections":[{"roman":"I","heading":"VITAL SIGNS ASSESSMENT","prompts":[{"label":"Location & Callback — Every Call, First","lines":["“Where is your emergency? Give me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"],"asks":["“Where is your emergency? Give me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"]},{"label":"Age","lines":["How old is the patient?"],"asks":[]},{"label":"Consciousness","lines":["Is the patient awake and able to respond to you?"],"asks":[]},{"label":"Breathing","lines":["Is the patient breathing normally?"],"asks":[]},{"label":"Gender","lines":["What is the patient's gender?"],"asks":[]}],"kind":"interrogation"},{"roman":"II","heading":"PRIMARY ASSESSMENT QUESTIONS — THE FAST TEST","prompts":[{"label":"Face","lines":["Ask the patient to smile. Does one side of the face droop or look uneven?"],"asks":[]},{"label":"Arms","lines":["Ask the patient to raise both arms and hold them up. Does one arm drift down or fail to lift?"],"asks":[]},{"label":"Speech","lines":["Ask the patient to repeat a simple sentence. Is the speech slurred, garbled, or wrong?"],"asks":[]},{"label":"Time — Critical","lines":["When did the symptoms start? When was the patient last seen normal? (Write this time down — hospital treatment decisions depend on it.)"],"asks":[]}],"kind":"interrogation"},{"roman":"III","heading":"SECONDARY ASSESSMENT QUESTIONS","prompts":[{"label":"Other Sudden Symptoms","lines":["Any sudden severe headache, sudden loss of vision, sudden dizziness, or sudden trouble walking or keeping balance?"],"asks":[]},{"label":"Improving or Worsening","lines":["Are the symptoms getting better, worse, or staying the same? (Symptoms that pass may be a TIA — the response still comes; treat it as a stroke until proven otherwise.)"],"asks":[]},{"label":"History & Medications","lines":["Any history of stroke, heart problems, or diabetes? Is the patient on blood thinners? (Gather medication names for responders if easy to reach.)"],"asks":[]}],"kind":"interrogation"},{"roman":"IV","heading":"PRE-ARRIVAL INSTRUCTIONS","prompts":[{"label":"Nothing by Mouth","lines":["Do not give the patient anything to eat or drink — not even water or medication. Swallowing may not be safe."],"asks":[]},{"label":"Position","lines":["Help them rest in a comfortable position, sitting up or lying with head and shoulders slightly raised. If they are drowsy, drooling, or vomiting, roll them onto their side."],"asks":[]},{"label":"Note the Time & Meds","lines":["Write down the time the symptoms started and gather their medication list or bottles for the responders — it saves treatment time at the hospital."],"asks":[]},{"label":"If the Patient Stops Responding","lines":["If the patient becomes unresponsive or stops breathing normally, tell me immediately — I will guide you through CPR, and send someone for an AED if one is nearby."],"asks":[]},{"label":"Stay & Monitor","lines":["Stay with the patient and watch their breathing and alertness until responders arrive. Tell me if anything changes."],"asks":[]}],"kind":"interrogation"}],"localize_flags":[],"crosslinks":[{"section":"IV","prompt":"If the Patient Stops Responding","when":"unresponsive / not breathing normally","skills":["EMS_CPR-Adult.html","EMS_AED-Instructions.html"]},{"section":"IV","prompt":"Stay & Monitor","when":"monitoring until arrival","skills":["EMS_Monitoring-ABCs.html"]}],"counts":{"sections":4,"prompts":17,"lines":18,"quoted_asks":2}},{"file":"EMS_Administering-Narcan.html","discipline":"EMS","title":"Suspected Overdose — Supportive Care","subtitle":"(Naloxone if available) · Skill Script · Step-by-Step Procedure","sections":[{"roman":"I","heading":"INITIAL CALL RECEIPT","kind":"procedure","prompts":[{"label":"Location Confirmation","step":"1","lines":["Immediately confirm the caller's exact location to ensure that emergency services are dispatched accurately and without delay."],"asks":[]},{"label":"Callback Number","lines":["Verify the number the caller is calling from, in case the call is disconnected."],"asks":[]},{"label":"Situation Assessment","step":"2","lines":["Ask what happened and quickly assess whether the person may have taken or been exposed to drugs or alcohol. Ask whether they are breathing and conscious, and note any visible signs such as slow or irregular breathing, unresponsiveness, vomiting, or bluish lips or fingertips."],"asks":[]}]},{"roman":"II","heading":"SCENE SAFETY","kind":"procedure","prompts":[{"label":"Check for Hazards","step":"3","lines":["Ask the caller whether the immediate area is safe — for example, whether there are other agitated or intoxicated people nearby, drug paraphernalia, needles, weapons, or an unstable environment.","If the scene is not safe, instruct the caller to move to a safe distance and wait for police or EMS before approaching the patient."],"asks":[]}]},{"roman":"III","heading":"REASSURANCE AND SUPPORT","kind":"procedure","prompts":[{"label":"Immediate Assurance","step":"4","lines":["Reassure the caller that help is on the way. Instruct them to keep the phone on speaker mode to continue receiving guidance."],"asks":[]}]},{"roman":"IV","heading":"ASSESS THE PATIENT","kind":"procedure","prompts":[{"label":"Check Responsiveness and Breathing","step":"5","lines":["Instruct the caller to gently tap the person and shout their name. Have the caller look, listen, and feel for breathing for several seconds, checking whether the chest is rising and whether breathing sounds normal."],"asks":[]},{"label":"Open the Airway","step":"6","lines":["If the person is unresponsive, guide the caller to tilt the head back and lift the chin to open the airway, and to check the mouth for anything blocking it — vomit, pills, or other objects — without reaching in blindly."],"asks":[]}]},{"roman":"V","heading":"BREATHING SUPPORT","kind":"procedure","prompts":[{"label":"Rescue Breathing (If Not Breathing Normally)","step":"7","lines":["If the person is not breathing normally, guide the caller to tilt the head back and lift the chin, pinch the nose closed, seal their mouth over the person's mouth, and give one slow breath every 5 to 6 seconds, watching for the chest to rise.","If there is no pulse, or the only breathing present is occasional gasping (agonal breathing), stop rescue breathing and hand off immediately to the CPR protocol for chest compressions."],"asks":[]},{"label":"Recovery Position (If Breathing)","step":"8","lines":["If the person is breathing normally on their own, help the caller place them in the recovery position — on their side, head tilted slightly back and downward — to keep the airway clear and reduce the risk of choking if they vomit."],"asks":[]},{"label":"Continuous Monitoring","step":"9","lines":["Instruct the caller to keep checking breathing and responsiveness continuously, about once a minute, until help arrives, and to be ready to start CPR immediately if breathing stops."],"asks":[]}]},{"roman":"VI","heading":"GATHER SUBSTANCE INFORMATION","kind":"procedure","prompts":[{"label":"What Was Taken","step":"10","lines":["Ask the caller what the person took or was exposed to, when, and how much, if this can be found out without delaying care. Common local possibilities include shabu (methamphetamine), alcohol, and unknown or unlabeled pills.","Note that callers often report this secondhand — \"daw,\" \"raw\" — rather than as something they saw directly. Record it as reported information, not confirmed fact, and pass it on to responders as such."],"asks":[]},{"label":"Preserve the Sample for Responders","step":"11","lines":["If it is safe to do so, ask the caller to set aside — without touching, tasting, or discarding — any pill container, sachet, wrapper, or remaining substance found at the scene, so responders can identify what was taken."],"asks":[]}]},{"roman":"VII","heading":"NALOXONE (IF AVAILABLE)","kind":"procedure","prompts":[{"label":"Conditional Administration","step":"12","lines":["If naloxone or a labeled opioid antidote is at the scene and someone present knows how to give it, they may administer it while rescue breathing continues."],"asks":[]}]},{"roman":"VIII","heading":"STIMULANT OVERSTIMULATION (SUSPECTED SHABU)","kind":"procedure","prompts":[{"label":"Recognize and Manage","step":"13","lines":["If the person shows signs of overstimulation rather than sedation — chest pain, seizures, very high body temperature, or severe agitation — this may be shabu-related rather than an opioid effect.","Keep the person calm and cool. Do not restrain them face-down. Hand off to the seizure protocol or the chest-pain protocol as symptoms dictate."],"asks":[]}]},{"roman":"IX","heading":"ARRIVAL OF EMERGENCY SERVICES","kind":"procedure","prompts":[{"label":"Handover Information","step":"14","lines":["Inform the caller to report to responders what was found or suspected, whether naloxone was given, and any changes in the person's condition."],"asks":[]},{"label":"Stay on the Line","step":"15","lines":["Encourage the caller to stay on the line and stay with the patient until emergency personnel arrive and take over."],"asks":[]}]}],"counts":{"sections":9,"prompts":16,"lines":20,"quoted_asks":0},"localize_flags":[]},{"file":"EMS_Animal-Bites.html","discipline":"EMS","title":"911 Dispatch Protocol: Animal Bites","subtitle":null,"sections":[{"roman":"I","heading":"INITIAL ASSESSMENT","prompts":[{"label":"Location & Callback — Every Call, First","lines":["“Where is your emergency? Give me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"],"asks":["“Where is your emergency? Give me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"]},{"label":"Age","lines":["How old is the patient?"],"asks":[]},{"label":"Consciousness","lines":["Is the patient alert and able to speak?"],"asks":[]},{"label":"Breathing","lines":["Can the patient breathe normally?"],"asks":[]},{"label":"Gender","lines":["What is the patient's gender?"],"asks":[]}],"kind":"interrogation"},{"roman":"II","heading":"PRIMARY ASSESSMENT QUESTIONS","prompts":[{"label":"Animal Identification","lines":["What kind of animal caused the bite?"],"asks":[]},{"label":"Safety Measures","lines":["Ensure that the victim and any bystanders are safe from further attacks. Is the animal still nearby? Where is it now?"],"asks":[]},{"label":"Bite Details","lines":["What part of the body was bitten?"],"asks":[]},{"label":"Immediate Concerns","lines":["If there are life-threatening symptoms (e.g., difficulty breathing, swelling), treat for shock immediately."],"asks":[]},{"label":"Bite Severity","lines":["Assess whether the bite is from a snake, spider, or insect, noting specific symptoms that indicate severe reactions."],"asks":[]}],"kind":"interrogation"},{"roman":"III","heading":"SECONDARY ASSESSMENT QUESTIONS","prompts":[{"label":"Witness Information","lines":["Did anyone witness the incident who can confirm details about the animal or the attack?"],"asks":[]}],"kind":"interrogation"},{"roman":"IV","heading":"PRE-ARRIVAL INSTRUCTIONS","prompts":[{"label":"Animal Control","lines":["If possible and safe, keep the animal away or have someone control or isolate it."],"asks":[]},{"label":"Injury Management","lines":["Keep the bitten area immobilized and below the heart level if possible."],"asks":[]},{"label":"First Aid","lines":["Wash the bite area with soap and clean water."],"asks":[]},{"label":"What Not to Do","lines":["DO NOT apply ice directly to the bite.","DO NOT use a tourniquet.","DO NOT incise or suction the wound."],"asks":[]},{"label":"Communication","lines":["Stay on the line with the caller if necessary until emergency responders arrive to ensure ongoing assessment and support."],"asks":[]},{"label":"Recognize the Call","lines":["Caller may say \"Nakagat ako ng aso\" (I was bitten by a dog) or \"Nakalmot ng pusa\" (scratched by a cat). Treat every dog, cat, or monkey bite or scratch — even a lick on already-broken skin — as a possible rabies exposure until an animal bite center clears it."],"asks":[]},{"label":"Scale of the Problem","lines":["The Philippines records roughly 400 rabies deaths and about 4 million animal-bite consultations every year. Once rabies symptoms appear in a human, the disease is almost always fatal — which is why pre-arrival wound care and same-day referral matter more here than for most bite calls."],"asks":[]},{"label":"Immediate Wound Washing (highest-value instruction)","lines":["Instruct the caller to wash the bite or scratch immediately with soap and running water for a full 10 to 15 minutes, working the soap into the wound rather than just rinsing over it.","This single step is the most effective rabies-prevention action available before the patient reaches a facility — give it before any other first-aid instruction for this call."],"asks":[]},{"label":"Urgent Referral — Do Not Wait for Symptoms","lines":["Direct the caller to the nearest Animal Bite Treatment Center (ABTC) — typically at the city or municipal health office — the same day for possible post-exposure prophylaxis (PEP), regardless of how minor the wound looks."],"asks":[]},{"label":"Folk-Remedy Probe","lines":["Ask non-judgmentally what has already been done: \"Ano na po ang nagawa niyo?\" Some families first bring the patient to a local healer for \"tandok\" (suction/extraction of the \"poison\"). Acknowledge respectfully, then redirect firmly: \"That's good you're taking care of the wound — the ABTC visit still needs to happen today. Tandok does not take the place of that.\""],"asks":[]},{"label":"The Animal","lines":["If it can be done safely, advise the household to capture or confine the biting animal rather than kill it if avoidable — a healthy dog or cat observed for 14 days without signs of rabies helps rule out exposure."],"asks":[]}],"kind":"interrogation"}],"counts":{"sections":4,"prompts":22,"lines":26,"quoted_asks":2},"localize_flags":["[LOCALIZE: example]"],"crosslinks":[{"section":"II","prompt":"Immediate Concerns","when":"life-threatening symptoms","skills":["EMS_Treating-Shock.html"]}]},{"file":"EMS_Applying-A-Tourniquet.html","discipline":"EMS","title":"911 Dispatch Protocol: Applying A Tourniquet","subtitle":"Skill Script · Step-by-Step Procedure","sections":[{"roman":"I","heading":"INITIAL CALL RECEIPT","kind":"procedure","prompts":[{"label":"Location Confirmation","step":"1","lines":["Immediately confirm the caller's exact location to ensure that emergency services are dispatched accurately and without delay."],"asks":[]},{"label":"Callback Number","lines":["Verify the number the caller is calling from, in case the call is disconnected."],"asks":[]},{"label":"Situation Assessment","step":"2","lines":["Quickly determine if the bleeding is severe enough to warrant a tourniquet, such as arterial bleeding where blood is spurting or the wound is pumping blood."],"asks":[]}]},{"roman":"II","heading":"SAFETY AND SCENE ASSESSMENT","kind":"procedure","prompts":[{"label":"Ensure Safety","step":"3","lines":["Instruct the caller to ensure their own safety and that of the victim by using gloves if available. If not, use a clean cloth or similar barrier to avoid direct contact with blood."],"asks":[]}]},{"roman":"III","heading":"TOURNIQUET APPLICATION","kind":"procedure","prompts":[{"label":"Identify the Location","step":"4","lines":["Guide the caller to apply the tourniquet 5 to 8 centimeters [LOCALIZE: source gave \"2-3 inches\" → converted to metric] above the wound, but not on a joint (knee or elbow). If the wound is on the forearm or lower leg, it may be necessary to apply the tourniquet above the elbow or knee."],"asks":[]},{"label":"Using a Commercial Tourniquet","step":"5","lines":["Placement: Instruct the caller to loop the tourniquet around the limb and pass the tip through the buckle, tightening it.","Tighten: Tell them to twist the rod until the bleeding stops.","Secure the Rod: Advise them to secure the rod in place once the bleeding has stopped and no pulse is felt below the tourniquet."],"asks":[]},{"label":"Using an Improvised Tourniquet","step":"6","lines":["Material: If a commercial tourniquet is not available, instruct the caller to use a piece of cloth and a rigid object like a stick or rod.","Placement: Have them tie the cloth around the limb, then place the stick over the cloth.","Twisting: Instruct them to twist the stick to tighten the cloth until the bleeding stops.","Secure: Advise them to tie the ends of the cloth to keep the stick from unwinding."],"asks":[]}]},{"roman":"IV","heading":"AFTER APPLICATION","kind":"procedure","prompts":[{"label":"Mark Time","step":"7","lines":["Instruct the caller to note the time the tourniquet was applied. This is important for medical personnel to know upon their arrival."],"asks":[]},{"label":"Monitor the Victim","step":"8","lines":["Remind the caller to keep an eye on the victim for signs of shock or changes in consciousness."],"asks":[]},{"label":"Comfort and Reassure","step":"9","lines":["Encourage the caller to keep the victim calm and reassured, explaining that help is on the way."],"asks":[]}]},{"roman":"V","heading":"PREPARE FOR EMS ARRIVAL","kind":"procedure","prompts":[{"label":"Inform the Caller","step":"10","lines":["Make sure the caller knows to inform the emergency responders about the tourniquet application, including the time it was applied."],"asks":[]},{"label":"Keep the Line Open","step":"11","lines":["Advise the caller to stay on the line until help arrives and to follow any further instructions from the emergency dispatcher."],"asks":[]}]},{"roman":"VI","heading":"ARRIVAL OF EMERGENCY SERVICES","kind":"procedure","prompts":[{"label":"Handover to EMS","step":"12","lines":["Ensure that the caller knows to provide all relevant information to the emergency responders when they arrive."],"asks":[]}]}],"counts":{"sections":6,"prompts":13,"lines":18,"quoted_asks":0},"localize_flags":["[LOCALIZE: example]","[LOCALIZE: source gave \"2-3 inches\" → converted to metric]"]},{"file":"EMS_Back-Pain.html","discipline":"EMS","title":"911 Dispatch Protocol: Back Pain","subtitle":null,"sections":[{"roman":"I","heading":"VITAL SIGNS ASSESSMENT","prompts":[{"label":"Location & Callback — Every Call, First","lines":["“Where is your emergency? Give me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"],"asks":["“Where is your emergency? Give me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"]},{"label":"Age","lines":["How old is the patient?"],"asks":[]},{"label":"Consciousness","lines":["Is the patient alert and able to speak?"],"asks":[]},{"label":"Breathing","lines":["Can the patient breathe normally?"],"asks":[]},{"label":"Gender","lines":["What is the patient's gender?"],"asks":[]}],"kind":"interrogation"},{"roman":"II","heading":"PRIMARY ASSESSMENT QUESTIONS","prompts":[{"label":"Onset of Pain","lines":["How long ago did the back pain start?"],"asks":[]},{"label":"Incident Description","lines":["What exactly happened that might have led to the back pain?"],"asks":[]},{"label":"Potential Causes","lines":["Determine if the pain might be related to:","Traumatic Causes: Such as spinal injuries, fractured ribs, sprained back, or bruises."],"asks":[]},{"label":"Associated Symptoms","lines":["Does the patient have any chest or abdominal pain?"],"asks":[]}],"kind":" r paper towel, not bare hands.","Flush the burn with cool running water to cool the area and reduce damage; avoid contaminating unaffected areas."],"asks":[]},{"label":"Electrical Burns","lines":["If the burn involves electricity and the victim is still in contact with the source, DO NOT TOUCH the victim."],"asks":[]},{"label":"Cooling and Covering","lines":["Apply cool compresses or continue to flush the area with water.","Cover large burns with a clean, lint-free cloth or sheet."],"asks":[]},{"label":"Support and Monitoring","lines":["Stay with the patient, continually monitor their Airway, Breathing, and Circulation (ABCs)."],"asks":[]}],"kind":"interrogation"}],"counts":{"sections":4,"prompts":17,"lines":20,"quoted_asks":2},"localize_flags":["[LOCALIZE: example]"],"crosslinks":[{"section":"IV","prompt":"Support and Monitoring","when":"ongoing monitoring","skills":["EMS_Monitoring-ABCs.html"]}]},{"file":"EMS_CPR-Adult.html","discipline":"EMS","title":"911 Dispatch Protocol: CPR Adult","subtitle":"Skill Script · Step-by-Step Procedure","sections":[{"roman":"I","heading":"INITIAL CALL RECEIPT","kind":"procedure","prompts":[{"label":"Location Confirmation","step":"1","lines":["Immediately confirm the caller's exact location to ensure that emergency services are dispatched accurately and without delay."],"asks":[]},{"label":"Callback Number","lines":["Verify the number the caller is calling from, in case the call is disconnected."],"asks":[]},{"label":"Situation Assessment","step":"2","lines":["Quickly determine if the adult victim is unresponsive and not breathing or only gasping."],"asks":[]}]},{"roman":"II","heading":"REASSURANCE AND SUPPORT","kind":"procedure","prompts":[{"label":"Immediate Assurance","step":"3","lines":["Reassure the caller that EMS is on the way and to keep the phone on speaker mode to continue receiving instructions."],"asks":[]}]},{"roman":"III","heading":"INSTRUCTIONS FOR CPR","kind":"procedure","prompts":[{"label":"Confirm Unresponsiveness","step":"4","lines":["Instruct the caller to gently shake the victim’s shoulder and shout loudly, “Are you okay?”","If there is no response, tell the caller they are doing the right thing by staying with the victim."],"asks":[]}]},{"roman":"IV","heading":"AIRWAY AND BREATHING","kind":"procedure","prompts":[{"label":"Clearing the Airway","step":"5","lines":["Instruct the caller to carefully tilt the victim's head back and lift the chin to open the airway.","Tell the caller to check for breathing: “Look at the chest, listen for breathing sounds, and feel for breath on your cheek for no more than 10 seconds.”"],"asks":[]}]},{"roman":"V","heading":"CHEST COMPRESSIONS","kind":"procedure","prompts":[{"label":"Starting Compressions","step":"6","lines":["Instruct the caller to place the heel of one hand on the center of the victim’s chest, placing the other hand on top, interlocking the fingers.","Ensure elbows are straight and shoulders are directly above the hands.","Guide the caller to push hard and fast, at least about 5 centimeters [LOCALIZED 2026-08-21 — metric conversion verified vs AHA standard] deep but not more than about 6 centimeters [LOCALIZED 2026-08-21 — metric conversion verified vs AHA standard], at a rate of 100 to 120 compressions per minute. Set the pace by counting aloud with the caller — \"Push with me: one-two-three-four…\" — steadily at about two pushes every second, and keep counting with them so they hold the rate. [LOCALIZED 2026-08-21 — US song cue replaced with dispatcher count-aloud pacing per decision]"],"asks":[]}]},{"roman":"VI","heading":"RESCUE BREATHS (If trained)","kind":"procedure","prompts":[{"label":"Administering Rescue Breaths","step":"7","lines":["After 30 compressions, tell the caller to give 2 rescue breaths by pinching the nose shut, placing their mouth over the victim’s, and blowing to make the chest rise.","Continue with cycles of 30 compressions and 2 breaths."],"asks":[]}]},{"roman":"VII","heading":"AED AVAILABILITY","kind":"procedure","prompts":[{"label":"Inquire About AED","step":"8","lines":["Ask the caller if there is an Automated External Defibrillator (AED) available nearby.","If yes, instruct them to send someone to retrieve it while continuing CPR, or guide them on its use if they are alone."],"asks":[]}]},{"roman":"VIII","heading":"CONTINUING CPR","kind":"procedure","prompts":[{"label":"Repeat and Rotate","step":"9","lines":["Instruct the caller to continue CPR cycles without stopping, except to recheck breathing if the victim shows signs of life or movement.","If another person is present, advise them to rotate performing CPR every 2 minutes to prevent fatigue."],"asks":[]}]},{"roman":"IX","heading":"ARRIVAL OF EMERGENCY SERVICES","kind":"procedure","prompts":[{"label":"Prepare for Handover","step":"10","lines":["Inform the caller to continue CPR until emergency responders arrive and take over."],"asks":[]},{"label":"Stay on the Line","step":"11","lines":["Encourage the caller to stay on the line until they are told they can disconnect by the emergency personnel."],"asks":[]}]}],"counts":{"sections":9,"prompts":12,"lines":19,"quoted_asks":0},"localize_flags":["[LOCALIZE: example]","[LOCALIZED 2026-08-21 — metric conversion verified vs AHA standard]","[LOCALIZED 2026-08-21 — metric conversion verified vs AHA standard]","[LOCALIZED 2026-08-21 — US song cue replaced with dispatcher count-aloud pacing per decision]"]},{"file":"EMS_CPR-Child.html","discipline":"EMS","title":"911 Dispatch Protocol: CPR Child","subtitle":"Skill Script · Step-by-Step Procedure","sections":[{"roman":"I","heading":"INITIAL CALL RECEIPT","kind":"procedure","prompts":[{"label":"Location Confirmation","step":"1","lines":["Immediately confirm the caller's exact location to ensure that emergency services are dispatched accurately and without delay."],"asks":[]},{"label":"Callback Number","lines":["Verify the number the caller is calling from, in case the call is disconnected."],"asks":[]},{"label":"Situatio
