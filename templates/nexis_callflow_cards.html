<html lang="en">
<head>

<title>Nexis Call Flow Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Single-theme by design: this is the printed card set's certified look
     (navy/red/amber on paper white). Every ground is painted explicitly so
     the page holds on any host theme. */
  :root {
    --navy: #0d1f38; --red: #c7233b; --amber: #f5a020;
    --ground: #f4f6f8; --panel: #ffffff; --ink: #17222f; --ink-soft: #55677c;
    --line: #d9e0e7;
    --c-SKILLS: #c7233b; --c-EMS: #1d5fa8; --c-FIRE: #d06010;
    --c-POLICE: #47586c; --c-DISASTER: #8d1f37;
    --ok: #1d7a4f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--ground); color: var(--ink);
    font-family: "DM Sans", "Segoe UI", system-ui, sans-serif;
    font-size: 15.5px; line-height: 1.5;
  }
  /* ---------- prototype ribbon ---------- */
  .ribbon {
    background: repeating-linear-gradient(-45deg, #7a1220, #7a1220 14px, #8d1f37 14px, #8d1f37 28px);
    color: #fff; text-align: center; font-size: 12.5px; font-weight: 700;
    letter-spacing: .06em; padding: 5px 12px; text-transform: uppercase;
  }
  header {
    background: var(--navy); color: #fff; border-bottom: 4px solid var(--amber);
    padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    position: sticky; top: 0; z-index: 30;
  }
  header .brand { font-weight: 700; font-size: 17px; letter-spacing: .01em; white-space: nowrap; }
  header .brand span { color: var(--amber); }
  header .brand .tm { font-size: 10px; vertical-align: super; opacity: .8; }
  header .prod { font-size: 11px; opacity: .7; letter-spacing: .12em; text-transform: uppercase; margin-top: -3px; }
  .edswitch { display: flex; border: 1px solid rgba(255,255,255,.35); border-radius: 6px; overflow: hidden; }
  .edswitch button {
    font: inherit; font-size: 12.5px; font-weight: 700; padding: 5px 12px; cursor: pointer;
    background: transparent; color: #fff; border: none; letter-spacing: .04em;
  }
  .edswitch button.on { background: var(--amber); color: #1c1200; }
  header .spacer { flex: 1; }
  .hsearch { position: relative; flex: 1 1 260px; max-width: 420px; }
  .hsearch input {
    width: 100%; font: inherit; font-size: 14px; padding: 7px 12px; border-radius: 6px;
    border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.12); color: #fff;
  }
  .hsearch input::placeholder { color: rgba(255,255,255,.65); }
  .hsearch input:focus { outline: 2px solid var(--amber); background: rgba(255,255,255,.2); }
  .results {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 40;
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; box-shadow: 0 10px 30px rgba(13,31,56,.35);
    max-height: 60vh; overflow: auto;
  }
  .results button {
    display: block; width: 100%; text-align: left; font: inherit; cursor: pointer;
    background: none; border: none; border-left: 5px solid var(--line);
    border-bottom: 1px solid var(--line); padding: 8px 12px; color: var(--ink);
  }
  .results button:last-child { border-bottom: none; }
  .results button:hover, .results button:focus-visible { background: #eef2f6; outline: none; }
  .results small { color: var(--ink-soft); display: block; font-size: 12px; }
  .results .none { padding: 10px 12px; color: var(--ink-soft); font-size: 13.5px; }

  main { max-width: 1080px; margin: 0 auto; padding: 18px 16px 120px; }

  /* ---------- browse ---------- */
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .tab {
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    border-radius: 6px; padding: 8px 15px; font: inherit; font-weight: 700;
    cursor: pointer; border-left: 6px solid var(--line);
  }
  .tab[data-d="SKILLS"]   { border-left-color: var(--c-SKILLS); }
  .tab[data-d="EMS"]      { border-left-color: var(--c-EMS); }
  .tab[data-d="FIRE"]     { border-left-color: var(--c-FIRE); }
  .tab[data-d="POLICE"]   { border-left-color: var(--c-POLICE); }
  .tab[data-d="DISASTER"] { border-left-color: var(--c-DISASTER); }
  .tab.on { background: var(--navy); color: #fff; border-color: var(--navy); }
  .cardlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 8px; }
  .cardbtn {
    text-align: left; background: var(--panel); border: 1px solid var(--line);
    border-left: 6px solid var(--line); border-radius: 6px; padding: 11px 13px;
    cursor: pointer; font: inherit; font-weight: 500; color: var(--ink);
  }
  .cardbtn:hover, .cardbtn:focus-visible { outline: 2px solid var(--navy); }
  .cardbtn small { display: block; color: var(--ink-soft); font-size: 12px; margin-top: 2px; font-weight: 400; }
  .d-SKILLS { border-left-color: var(--c-SKILLS) !important; }
  .d-EMS { border-left-color: var(--c-EMS) !important; }
  .d-FIRE { border-left-color: var(--c-FIRE) !important; }
  .d-POLICE { border-left-color: var(--c-POLICE) !important; }
  .d-DISASTER { border-left-color: var(--c-DISASTER) !important; }

  /* ---------- card view ---------- */
  .crumbs { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 0 0 10px; font-size: 13px; }
  .crumbs button {
    font: inherit; font-size: 13px; cursor: pointer; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); border-radius: 99px; padding: 3px 12px;
  }
  .crumbs button:hover { border-color: var(--navy); }
  .crumbs .here { font-weight: 700; color: var(--ink-soft); padding: 3px 4px; }
  .crumbs .sep { color: var(--ink-soft); }
  .cardhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 4px 0 14px; }
  .disc {
    font-family: "DM Mono", monospace; font-size: 12.5px; font-weight: 500;
    color: #fff; border-radius: 4px; padding: 3px 9px;
  }
  .cardhead h1 { font-size: 22px; margin: 0; flex: 1 1 300px; text-wrap: balance; }
  .btn {
    font: inherit; font-weight: 700; border-radius: 6px; cursor: pointer;
    padding: 8px 16px; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  }
  .btn.primary { background: var(--red); border-color: var(--red); color: #fff; }
  .btn.quiet { font-weight: 500; }
  .btn:focus-visible { outline: 2px solid var(--navy); outline-offset: 1px; }
  .section {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    margin-bottom: 12px; overflow: hidden;
  }
  .section > h2 {
    margin: 0; padding: 9px 14px; font-size: 13.5px; letter-spacing: .06em;
    text-transform: uppercase; background: var(--navy); color: #fff; font-weight: 700;
  }
  .section > h2 .roman { color: var(--amber); margin-right: 8px; font-family: "DM Mono", monospace; }
  .prompt { padding: 10px 14px; border-top: 1px solid var(--line); }
  .prompt:first-of-type { border-top: none; }
  .prompt .label { font-weight: 700; font-size: 13px; color: var(--ink-soft); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .04em; }
  .qline { padding: 5px 10px 5px 30px; position: relative; }
  .qline::before {
    content: "?"; position: absolute; left: 6px; top: 8px; width: 16px; height: 16px;
    border-radius: 50%; background: var(--line); color: var(--ink-soft);
    font-size: 11px; font-weight: 700; text-align: center; line-height: 16px;
  }
  .step { padding: 6px 10px 6px 36px; position: relative; }
  .stepnum {
    position: absolute; left: 6px; top: 8px; width: 22px; height: 22px; border-radius: 4px;
    background: var(--line); color: var(--ink-soft); font-family: "DM Mono", monospace;
    font-size: 12.5px; font-weight: 700; text-align: center; line-height: 22px;
  }
  /* Guide-card -> skill-card cross-links (SME-approved map 2026-09-01) */
  .xlinks { margin: 8px 0 2px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .xwhen { font-size: 12px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .04em; }
  .xchip { font: inherit; font-size: 13.5px; font-weight: 700; padding: 5px 12px; border-radius: 999px;
    border: 1.5px solid var(--amber); background: #fff8ec; color: #7a5200; cursor: pointer; }
  .xchip:hover, .xchip:focus-visible { background: var(--amber); color: #1c1200; }
  .toolrow { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 14px; }
  .foot { margin-top: 34px; font-size: 11.5px; color: var(--ink-soft); }

  /* ---------- metronome ---------- */
  #metroFab {
    position: fixed; right: 18px; bottom: 18px; z-index: 50;
    font: inherit; font-weight: 700; font-size: 15px; cursor: pointer;
    background: var(--red); color: #fff; border: none; border-radius: 999px;
    padding: 12px 20px; box-shadow: 0 6px 18px rgba(13,31,56,.35);
  }
  #metroFab:focus-visible { outline: 3px solid var(--amber); }
  .overlay {
    position: fixed; inset: 0; z-index: 60; background: rgba(13,31,56,.6);
    display: flex; align-items: center; justify-content: center; padding: 20px 12px; overflow: auto;
  }
  .modal {
    background: var(--panel); color: var(--ink); border-radius: 12px; max-width: 560px; width: 100%;
    padding: 20px 24px 26px; box-shadow: 0 12px 40px rgba(0,0,0,.4);
  }
  .modal h2 { margin: 0 0 4px; font-size: 19px; }
  .modal .sub { color: var(--ink-soft); font-size: 13.5px; margin: 0 0 16px; }
  .mwrap { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  #pulse {
    width: 150px; height: 150px; border-radius: 50%;
    background: radial-gradient(circle at 38% 34%, #e4536b, var(--red) 68%);
    box-shadow: 0 0 0 0 rgba(199,35,59,.45);
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    color: #fff; font-weight: 700; transition: transform .06s ease-out;
  }
  #pulse.beat { transform: scale(1.12); box-shadow: 0 0 0 16px rgba(199,35,59,0); }
  #pulse .count { font-family: "DM Mono", monospace; font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }
  #pulse .clabel { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; opacity: .85; }
  .bpmrow { display: flex; gap: 8px; align-items: center; }
  .bpmrow .bpmbtn {
    font: inherit; font-family: "DM Mono", monospace; font-weight: 700; cursor: pointer;
    border: 1.5px solid var(--line); background: var(--panel); color: var(--ink);
    border-radius: 8px; padding: 8px 14px; font-size: 15px;
  }
  .bpmrow .bpmbtn.on { background: var(--navy); color: #fff; border-color: var(--navy); }
  .mnote { font-size: 12.5px; color: var(--ink-soft); text-align: center; max-width: 380px; }
  /* ---------- demo pop-out ---------- */
  .demo-frame {
    aspect-ratio: 16 / 9; width: 100%; border-radius: 8px; border: 2px dashed var(--line);
    background: #eef1f4; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 8px; color: var(--ink-soft); text-align: center; padding: 16px;
  }
  .demo-frame .play {
    width: 58px; height: 58px; border-radius: 50%; background: var(--navy); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 22px;
  }
  .demo-frame b { color: var(--ink); }
  .tagline { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
  @media (prefers-reduced-motion: reduce) {
    #pulse, #pulse.beat { transition: none; transform: none; }
    #pulse.beat { outline: 6px solid var(--amber); }
  }
  @media (prefers-reduced-motion: no-preference) {
    .tab, .cardbtn, .btn, .xchip, .bpmbtn { transition: background .12s, border-color .12s; }
  }
</style>
</head>
<body>
<div class="ribbon">Prototype — not for operational use — pending agency authorization &amp; medical review</div>
<header>
  <div>
    <div class="brand">NEXIS<span> Call Flow Cards</span><span class="tm">™</span></div>
    <div class="prod">NGA911 Emergency Dispatch</div>
  </div>
  <div class="edswitch" role="group" aria-label="Edition">
    <button id="edUS">US</button><button id="edPH">Philippines</button>
  </div>
  <div class="spacer"></div>
  <div class="hsearch">
    <input id="q" type="search" autocomplete="off"
      placeholder="Search cards — press / from anywhere" aria-label="Search all cards">
    <div class="results" id="results" hidden></div>
  </div>
  <button class="btn quiet" id="homeBtn" style="display:none">All cards</button>
</header>
<main id="main"></main>
<button id="metroFab" title="CPR compression metronome" aria-haspopup="dialog">♥ CPR metronome</button>
<div id="modalRoot"></div>

<script>
window.NEXIS_DATA = {"us":{"cards":[{"file":"DISASTER_Crowd-Crush.html","discipline":"DISASTER","title":"911 Dispatch Protocol: Mass Gathering / Crowd Crush","subtitle":null,"sections":[{"roman":"I","heading":"INITIAL CALL RECEIPT","prompts":[{"label":"Location & Callback — Every Call, First","lines":["“Where is your emergency? Give me the exact address — street address, nearest cross street or landmark, and the apartment, floor, or unit if you're inside a building.”","“What number are you calling from, in case we get disconnected?”"],"asks":["“Where is your emergency? Give me the exact address — street address, nearest cross street or landmark, and the apartment, floor, or unit if you're inside a building.”","“What number are you calling from, in case we get disconnected?”"]},{"label":"Event & Location","lines":["\"What event is this — a parade, festival, concert, game-day crowd, or something else? What is the neighborhood, street, or venue?\""],"asks":["\"What event is this — a parade, festival, concert, game-day crowd, or something else? What is the neighborhood, street, or venue?\""]}],"kind":"interrogation"},{"roman":"II","heading":"RECOGNIZING CROWD CRUSH CONDITIONS","prompts":[{"label":"Distinguishing a Crush from a Normal Dense Crowd","lines":["\"Can you move your arms freely, or are they pinned to your sides?\"","\"Are you seeing people fall and not get back up, or people being pushed off their feet?\"","\"Do you feel the crowd moving in waves, pressing you back and forth even though you're not walking?\""],"asks":["\"Can you move your arms freely, or are they pinned to your sides?\"","\"Are you seeing people fall and not get back up, or people being pushed off their feet?\"","\"Do you feel the crowd moving in waves, pressing you back and forth even though you're not walking?\""]}],"kind":"interrogation"},{"roman":"III","heading":"SCALE ASSESSMENT","prompts":[{"label":"Size and Trend","lines":["\"About how many people are in this crowd — hundreds, thousands? Give me your best estimate.\""],"asks":["\"About how many people are in this crowd — hundreds, thousands? Give me your best estimate.\""]}],"kind":"interrogation"},{"roman":"IV","heading":"CASUALTY & MEDICAL STATUS","prompts":[{"label":"Immediate Triage Questions","lines":["\"How many people appear to be down or trapped underfoot, as best you can tell?\"","\"Look at the person nearest to you who is down — are they breathing? Are they conscious?\""],"asks":["\"How many people appear to be down or trapped underfoot, as best you can tell?\"","\"Look at the person nearest to you who is down — are they breathing? Are they conscious?\""]}],"kind":"interrogation"},{"roman":"V","heading":"ACCESS ASSESSMENT","prompts":[{"label":"Responder Access","lines":["\"Can an ambulance or fire truck actually drive to where you are, or is the street completely packed with people?\""],"asks":["\"Can an ambulance or fire truck actually drive to where you are, or is the street completely packed with people?\""]}],"kind":"interrogation"},{"roman":"VI","heading":"RESOURCE COORDINATION","prompts":[{"label":"Mass-Casualty Activation","lines":["A confirmed crowd crush at a large event activates mass-casualty triage staffing and multiple EMS units rather than a single ambulance response."],"asks":[]},{"label":"Law Enforcement Crowd Corridor","lines":["Because vehicles cannot enter a dense crowd, request law enforcement to open and hold a crowd corridor from the nearest accessible street to the casualty point, and direct EMS/fire units to stage at that access point rather than attempting to drive in."],"asks":[]},{"label":"Event Organizer & Local Liaison","lines":["Coordinate with event organizers, venue security, or [LOCAL INSERT: local government/parks & recreation liaison] for crowd-control announcements and to identify the nearest first-aid or medical tent already on site."],"asks":[]},{"label":"Multiple-Caller Triangulation","lines":["Expect many simultaneous callers describing the same crush from different vantage points — do not dismiss repeat calls as duplicates. Cross-reference each caller's described landmark (stage, main entrance, specific street corner) to pinpoint the exact crush location within the larger crowd for responders."],"asks":[]}],"kind":"interrogation"},{"roman":"VII","heading":"SELF-PROTECTION IF STILL IN THE CROWD","prompts":[{"label":"Boxer Position & Movement","lines":["\"Bring your arms up in front of your chest, like a boxer guarding — this protects your chest and airway from the pressure around you and keeps a small pocket of space to breathe.\"","\"Do not push straight against the crowd. Move diagonally, angling across the flow of the crowd toward the nearest edge or open space, rather than fighting directly against it.\""],"asks":["\"Bring your arms up in front of your chest, like a boxer guarding — this protects your chest and airway from the pressure around you and keeps a small pocket of space to breathe.\"","\"Do not push straight against the crowd. Move diagonally, angling across the flow of the crowd toward the nearest edge or open space, rather than fighting directly against it.\""]}],"kind":"interrogation"},{"roman":"VIII","heading":"HELPING OTHERS SAFELY","prompts":[{"label":"Assisting Without Losing Footing","lines":["\"If someone near you has fallen and you can help them up without losing your own footing or being pulled down, do so. But if helping them would put you at risk of falling too, keep moving toward the edge yourself and alert anyone you pass on the way out.\""],"asks":["\"If someone near you has fallen and you can help them up without losing your own footing or being pulled down, do so. But if helping them would put you at risk of falling too, keep moving toward the edge yourself and alert anyone you pass on the way out.\""]}],"kind":"interrogation"},{"roman":"IX","heading":"AFTER REACHING SAFETY","prompts":[{"label":"Once Clear of the Crush","lines":["\"Once you are out, move well away from the crowd's edge — do not stop right next to it, and do not go back in to look for anyone.\""],"asks":["\"Once you are out, move well away from the crowd's edge — do not stop right next to it, and do not go back in to look for anyone.\""]}],"kind":"interrogation"}],"counts":{"sections":9,"prompts":13,"lines":18,"quoted_asks":14},"localize_flags":["[LOCAL INSERT: local government/parks & recreation liaison]"],"crosslinks":[{"section":"IV","prompt":"Immediate Triage Questions","when":"person down","skills":["EMS_CPR-Adult.html","EMS_CPR-Child.html","EMS_CPR-Infant.html","EMS_Monitoring-ABCs.html"]}]},{"file":"DISASTER_Earthquake.html","discipline":"DISASTER","title":"911 Dispatch Protocol: Earthquake / Mass Structural Collapse","subtitle":null,"sections":[{"roman":"I","heading":"INITIAL CALL RECEIPT","prompts":[{"label":"Location & Callback — Every Call, First","lines":["“Where is your emergency? Give me the exact address — street address, nearest cross street or landmark, and the apartment, floor, or unit if you're inside a building.”","“What number are you calling from, in case we get disconnected?”"],"asks":["“Where is your emergency? Give me the exact address — street address, nearest cross street or landmark, and the apartment, floor, or unit if you're inside a building.”","“What number are you calling from, in case we get disconnected?”"]},{"label":"Location Confirmation","lines":["Immediately confirm the caller's exact location — street address, nearest cross street or landmark, and the apartment, floor, or unit if inside a building — so responders are dispatched accurately and without delay."],"asks":[]},{"label":"Caller's Own Safety","lines":["\"Are you safe right now? Is the ground still shaking?\""],"asks":["\"Are you safe right now? Is the ground still shaking?\""]}],"kind":"interrogation"},{"roman":"II","heading":"SELF-PROTECTION WHILE SHAKING CONTINUES","prompts":[{"label":"Drop, Cover, Hold","lines":["\"If the ground is still moving, drop to the floor now, get under a sturdy table or desk, and hold on until the shaking stops. Stay away from windows, glass, and heavy furniture that can fall.\"","\"If you are outdoors, move away from buildings, walls, posts, and trees — go to open ground if you can do so safely.\""],"asks":["\"If the ground is still moving, drop to the floor now, get under a sturdy table or desk, and hold on until the shaking stops. Stay away from windows, glass, and heavy furniture that can fall.\"","\"If you are outdoors, move away from buildings, walls, posts, and trees — go to open ground if you can do so safely.\""]}],"kind":"interrogation"},{"roman":"III","heading":"ASSESSMENT OF DAMAGE","prompts":[{"label":"Nature of the Collapse","lines":["\"What kind of structure is this — a house, an apartment building, a school, a store, or a mobile home?\"","\"Did the whole structure collapse, or just part of it — a wall, a ceiling, a floor?\""],"asks":["\"What kind of structure is this — a house, an apartment building, a school, a store, or a mobile home?\"","\"Did the whole structure collapse, or just part of it — a wall, a ceiling, a floor?\""]}],"kind":"interrogation"},{"roman":"IV","heading":"TRAPPED VICTIM DETAILS","prompts":[{"label":"Recognizing Indirect Language","lines":["Callers will often say \"he's stuck,\" \"she's pinned,\" or \"I can't get her out\" rather than using the word \"trapped\" directly. Treat any of these phrases as an active entrapment call requiring the same urgency as \"trapped.\""],"asks":[]},{"label":"Locating the Victim","lines":["\"Where in the building is the person trapped — which floor, which room, near which wall?\"","\"Can the trapped person tap on a pipe or wall, or shout to make contact? Ask them to tap three times, then listen.\""],"asks":["\"Where in the building is the person trapped — which floor, which room, near which wall?\"","\"Can the trapped person tap on a pipe or wall, or shout to make contact? Ask them to tap three times, then listen.\""]}],"kind":"interrogation"},{"roman":"V","heading":"CASUALTIES & MEDICAL STATUS","prompts":[{"label":"Injury Check","lines":["\"How many people are injured? Is anyone bleeding heavily or not breathing?\""],"asks":["\"How many people are injured? Is anyone bleeding heavily or not breathing?\""]}],"kind":"interrogation"},{"roman":"VI","heading":"SECONDARY HAZARDS","prompts":[{"label":"Fire, Gas, and Aftershocks","lines":["\"Do you smell gas, or see any smoke or fire starting near the collapse?\"","\"Are there broken water pipes or downed electrical lines nearby?\""],"asks":["\"Do you smell gas, or see any smoke or fire starting near the collapse?\"","\"Are there broken water pipes or downed electrical lines nearby?\""]},{"label":"Coastal Proximity Check","lines":["If the caller's area is coastal and the quake was strong or long, ask: \"Are you near the shoreline? A strong earthquake felt near the coast is itself the tsunami warning — do not wait for an official alert before moving to higher ground.\" (See Tsunami Warning protocol.)"],"asks":[]}],"kind":"interrogation"},{"roman":"VII","heading":"MASS-EVENT PRIORITIZATION","prompts":[{"label":"High-Seismic-Risk-Area / Mass-Casualty Mode","lines":["A major earthquake in a densely populated, high-seismic-risk area [LOCAL INSERT: regional fault system / seismic zone] is expected to generate many hundreds of simultaneous calls at once, with entrapments and fires reported together. When call volume exceeds available units, dispatchers shift to triage-based prioritization: confirmed entrapments and active fires outrank damage-only reports; group calls reporting the same address or neighborhood to avoid duplicate dispatch; log every call even when a unit cannot be sent immediately."],"asks":[]},{"label":"Intensity Reference","lines":["Ask the caller to describe what happened during the shaking (furniture toppled, unable to stand, structures visibly damaged) — this maps to the USGS Modified Mercalli Intensity (MMI) scale and helps responders prioritize which areas likely have the worst damage before ground reports come in."],"asks":[]},{"label":"Coordination","lines":["Confirmed collapses and entrapments are relayed to fire department urban search-and-rescue and law enforcement, with [LOCAL INSERT: local emergency management agency (EMA)] notified for local staging, evacuation shelter activation, and state/FEMA situational reporting."],"asks":[]}],"kind":"interrogation"},{"roman":"VIII","heading":"INSTRUCTIONS WHILE WAITING FOR RESCUE","prompts":[{"label":"If Free to Move","lines":["\"Move to open ground away from buildings, walls, and power lines. Expect aftershocks — do not re-enter any damaged structure, and do not use elevators.\""],"asks":["\"Move to open ground away from buildings, walls, and power lines. Expect aftershocks — do not re-enter any damaged structure, and do not use elevators.\""]},{"label":"If Trapped","lines":["\"Stay as still and calm as possible to conserve air and energy. Tap on a pipe or wall in a steady pattern rather than shouting continuously — shouting uses up air and energy faster.\""],"asks":["\"Stay as still and calm as possible to conserve air and energy. Tap on a pipe or wall in a steady pattern rather than shouting continuously — shouting uses up air and energy faster.\""]}],"kind":"interrogation"},{"roman":"IX","heading":"IF NEAR THE COAST","prompts":[{"label":"Tsunami Awareness","lines":["\"If you are near the shoreline and just felt a strong or long earthquake, do not wait for an official tsunami warning — move to higher ground or at least several hundred yards inland now. The earthquake itself is the warning.\""],"asks":["\"If you are near the shoreline and just felt a strong or long earthquake, do not wait for an official tsunami warning — move to higher ground or at least several hundred yards inland now. The earthquake itself is the warning.\""]}],"kind":"interrogation"},{"roman":"X","heading":"FOLLOW-UP ACTIONS","prompts":[{"label":"Staying Reachable","lines":["\"Keep this number reachable if you can. If units are delayed because of the scale of this event, that does not mean you were forgotten — responders are working through confirmed entrapments and fires first.\""],"asks":["\"Keep this number reachable if you can. If units are delayed because of the scale of this event, that does not mean you were forgotten — responders are working through confirmed entrapments and fires first.\""]}],"kind":"interrogation"}],"counts":{"sections":10,"prompts":17,"lines":22,"quoted_asks":16},"localize_flags":["[LOCAL INSERT: local emergency management agency (EMA)]","[LOCAL INSERT: regional fault system / seismic zone]"],"crosslinks":[{"section":"V","prompt":"Injury Check","when":"heavy bleeding / not breathing","skills":["EMS_Applying-A-Tourniquet.html","EMS_CPR-Adult.html","EMS_CPR-Child.html","EMS_CPR-Infant.html"]}]},{"file":"DISASTER_Flood.html","discipline":"DISASTER","title":"911 Dispatch Protocol: Flood / Flash Flood","subtitle":null,"sections":[{"roman":"I","heading":"INITIAL CALL RECEIPT","prompts":[{"label":"Location & Callback — Every Call, First","lines":["“Where is your emergency? Give me the exact address — street address, nearest cross street or landmark, and the apartment, floor, or unit if you're inside a building.”","“What number are you calling from, in case we get disconnected?”"],"asks":["“Where is your emergency? Give me the exact address — street address, nearest cross street or landmark, and the apartment, floor, or unit if you're inside a building.”","“What number are you calling from, in case we get disconnected?”"]},{"label":"Recognition Phrases","lines":["Recognize \"There's a flood!\" or \"It's flooding right now!\" as the caller's opening line — treat both as an active, in-progress flood event."],"asks":[]},{"label":"Location Confirmation","lines":["Immediately confirm the caller's exact location — street address, nearest cross street or landmark, and the apartment, floor, or unit if inside a building — so responders are dispatched accurately and without delay."],"asks":[]}],"kind":"interrogation"},{"roman":"II","heading":"FLOOD ASSESSMENT","prompts":[{"label":"Depth","lines":["\"How deep is the water where you are right now — ankle-deep, knee-deep, waist-deep, or higher than that?\""],"asks":["\"How deep is the water where you are right now — ankle-deep, knee-deep, waist-deep, or higher than that?\""]},{"label":"Trend & Current","lines":["\"Is the water still rising, or has it stayed the same or started to go down?\""],"asks":["\"Is the water still rising, or has it stayed the same or started to go down?\""]}],"kind":"interrogation"},{"roman":"III","heading":"PERSONS AT RISK","prompts":[{"label":"Trapped Status","lines":["\"Are you trapped inside the house, or have you moved to the roof?\""],"asks":["\"Are you trapped inside the house, or have you moved to the roof?\""]},{"label":"Vehicle Involvement","lines":["\"Is anyone stuck inside a vehicle in the floodwater?\""],"asks":["\"Is anyone stuck inside a vehicle in the floodwater?\""]}],"kind":"interrogation"},{"roman":"IV","heading":"SAFETY ASSESSMENT — ELECTROCUTION HAZARD","prompts":[{"label":"Downed Lines / Energized Structure","lines":["\"Are there any downed or hanging electrical lines near the water?\""],"asks":["\"Are there any downed or hanging electrical lines near the water?\""]},{"label":"Immediate Warning","lines":["Treat any home with water touching outlets or wiring as electrically live until the utility confirms otherwise — do not let the caller touch metal fixtures, switches, or the breaker if hands or feet are wet."],"asks":[]}],"kind":"interrogation"},{"roman":"V","heading":"TRANSPORT / MOBILITY STATUS","prompts":[{"label":"Bystander Rescue Already Underway","lines":["\"Is a neighbor or family member already trying to move you by boat or on foot?\" — in many communities neighbors act before responders arrive; find out whether the caller is already being moved so dispatch can plan an intercept rather than a standard pickup."],"asks":["\"Is a neighbor or family member already trying to move you by boat or on foot?\" — in many communities neighbors act before responders arrive; find out whether the caller is already being moved so dispatch can plan an intercept rather than a standard pickup."]}],"kind":"interrogation"},{"roman":"VI","heading":"DISPATCH COORDINATION","prompts":[{"label":"Boat Rescue Staging","lines":["Coordinate with [LOCAL INSERT: local emergency management agency/fire department] for boat rescue staging where roads are impassable — this is a standard flood-rescue transport method in affected areas, not an improvised option."],"asks":[]},{"label":"Utility Line Cut","lines":["Where a home or area is reported energized and flooded, request [LOCAL INSERT: local electric utility] cut power to that line before entry, and relay this to responding units."],"asks":[]},{"label":"Agency Notification","lines":["Notify fire department/law enforcement water rescue assets as needed for swift-current or trapped-person calls; log with [LOCAL INSERT: local emergency management agency] for area-wide flood tracking."],"asks":[]}],"kind":"interrogation"},{"roman":"VII","heading":"IMMEDIATE SAFETY INSTRUCTIONS","prompts":[{"label":"Do Not Enter Floodwater","lines":["\"Do not walk or drive through the floodwater. You cannot see what is underneath — open manholes, debris, or a strong current can sweep you away in seconds.\""],"asks":["\"Do not walk or drive through the floodwater. You cannot see what is underneath — open manholes, debris, or a strong current can sweep you away in seconds.\""]},{"label":"Move To Higher Ground","lines":["\"If the water is rising, move to the highest safe level of your home — the second floor or the roof — and stay there.\""],"asks":["\"If the water is rising, move to the highest safe level of your home — the second floor or the roof — and stay there.\""]},{"label":"Electrical Safety","lines":["\"Do not touch the breaker or any switch if your hands or feet are wet, and do not touch any metal fixture near the water. If it is dry and safe to reach, turn off the main breaker — otherwise leave it and wait for the utility to cut power.\""],"asks":["\"Do not touch the breaker or any switch if your hands or feet are wet, and do not touch any metal fixture near the water. If it is dry and safe to reach, turn off the main breaker — otherwise leave it and wait for the utility to cut power.\""]}],"kind":"interrogation"},{"roman":"VIII","heading":"IF TRAPPED / AWAITING RESCUE","prompts":[{"label":"Stay Visible And Reachable","lines":["\"Stay where rescuers can see you — near a window or on the roof — and wave or signal when you hear a boat or responders.\""],"asks":["\"Stay where rescuers can see you — near a window or on the roof — and wave or signal when you hear a boat or responders.\""]},{"label":"Evacuation Center","lines":["If self-evacuation becomes possible, direct the caller to [LOCAL INSERT: designated local evacuation shelter] rather than a random location, so responders and family can find them."],"asks":[]}],"kind":"interrogation"},{"roman":"IX","heading":"AFTER THE WATER RECEDES — FOLLOW-UP ADVISORY","prompts":[{"label":"Leptospirosis Warning","lines":["\"If you or anyone in your household waded through floodwater, especially with any cuts or open wounds, watch for fever, muscle pain, chills, or headache in the days after — seek medical care right away and tell them you were exposed to floodwater. This is a real risk, not a precaution to brush off.\""],"asks":["\"If you or anyone in your household waded through floodwater, especially with any cuts or open wounds, watch for fever, muscle pain, chills, or headache in the days after — seek medical care right away and tell them you were exposed to floodwater. This is a real risk, not a precaution to brush off.\""]},{"label":"General Follow-Up","lines":["\"Boil or treat drinking water until your water supply is confirmed safe, and avoid letting floodwater contact any open wound.\""],"asks":["\"Boil or treat drinking water until your water supply is confirmed safe, and avoid letting floodwater contact any open wound.\""]}],"kind":"interrogation"}],"counts":{"sections":9,"prompts":20,"lines":21,"quoted_asks":14},"localize_flags":["[LOCAL INSERT: designated local evacuation shelter]","[LOCAL INSERT: local electric utility]","[LOCAL INSERT: local emergency management agency/fire department]","[LOCAL INSERT: local emergency management agency]"]},{"file":"DISASTER_Maritime-Ferry-Emergency.html","discipline":"DISASTER","title":"911 Dispatch Protocol: Maritime / Ferry Emergency (Mass Casualty)","subtitle":null,"sections":[{"roman":"I","heading":"INITIAL CALL RECEIPT","prompts":[{"label":"Location & Callback — Every Call, First","lines":["“Where is your emergency? Give me the exact address — street address, nearest cross street or landmark, and the apartment, floor, or unit if you're inside a building.”","“What number are you calling from, in case we get disconnected?”"],"asks":["“Where is your emergency? Give me the exact address — street address, nearest cross street or landmark, and the apartment, floor, or unit if you're inside a building.”","“What number are you calling from, in case we get disconnected?”"]},{"label":"Nature of Report","lines":["\"Is this call about a boat or ferry — is it sinking, capsized, on fire, or overloaded?\""],"asks":["\"Is this call about a boat or ferry — is it sinking, capsized, on fire, or overloaded?\""]}],"kind":"interrogation"},{"roman":"II","heading":"VESSEL IDENTIFICATION","prompts":[{"label":"Vessel Details","lines":["\"What is the name of the vessel? Is it a passenger ferry, a cargo/vehicle ferry, or a smaller recreational or fishing boat?\"","\"What is the route — where did it depart from, and where was it headed?\""],"asks":["\"What is the name of the vessel? Is it a passenger ferry, a cargo/vehicle ferry, or a smaller recreational or fishing boat?\"","\"What is the route — where did it depart from, and where was it headed?\""]}],"kind":"interrogation"},{"roman":"III","heading":"VESSEL POSITION AND STATUS","prompts":[{"label":"Location and Condition","lines":["\"What is the last known position of the vessel — GPS coordinates if available, or distance and direction from the nearest port or landmark?\"","\"What time did it depart, and when was it due to arrive?\""],"asks":["\"What is the last known position of the vessel — GPS coordinates if available, or distance and direction from the nearest port or landmark?\"","\"What time did it depart, and when was it due to arrive?\""]}],"kind":"interrogation"},{"roman":"IV","heading":"PERSONS ABOARD","prompts":[{"label":"Passenger and Crew Count","lines":["\"About how many people were aboard — passengers and crew?\"","Treat manifest and headcounts as approximate. Callers will often give an estimate rather than a verified count — especially for smaller boats that rarely keep a formal manifest."],"asks":["\"About how many people were aboard — passengers and crew?\""]}],"kind":"interrogation"},{"roman":"V","heading":"LIFE SAFETY EQUIPMENT","prompts":[{"label":"Life Jackets and Equipment","lines":["\"Were life jackets available and worn? How many, if known?\"","\"Are there life rafts, ring buoys, or working lights and flares on board?\""],"asks":["\"Were life jackets available and worn? How many, if known?\"","\"Are there life rafts, ring buoys, or working lights and flares on board?\""]}],"kind":"interrogation"},{"roman":"VI","heading":"PERSONS IN THE WATER","prompts":[{"label":"In-Water Victims","lines":["\"Are there people already in the water? About how many?\"","\"Are they conscious, swimming, or floating in place? Are they grouped together or scattered?\""],"asks":["\"Are there people already in the water? About how many?\"","\"Are they conscious, swimming, or floating in place? Are they grouped together or scattered?\""]}],"kind":"interrogation"},{"roman":"VII","heading":"U.S. COAST GUARD NOTIFICATION","prompts":[{"label":"Lead Agency Activation","lines":["The U.S. Coast Guard (USCG) is the lead federal agency for maritime search and rescue. Notify the nearest USCG Sector or station immediately with vessel name, route, last known position, and persons-aboard estimate. [LOCAL INSERT: for inland lakes/rivers outside USCG jurisdiction, substitute local marine patrol/water rescue unit]"],"asks":[]}],"kind":"interrogation"},{"roman":"VIII","heading":"PARALLEL EMS AND AGENCY STAGING","prompts":[{"label":"Simultaneous Dispatch","lines":["Stage EMS for a mass-casualty response at the nearest functioning port or pier — do not wait for USCG confirmation before beginning EMS staging."],"asks":[]}],"kind":"interrogation"},{"roman":"IX","heading":"NIGHT AND WEATHER FACTORS","prompts":[{"label":"Conditions Affecting Rescue","lines":["\"Is it currently daylight or dark? What is the sea condition — calm, choppy, or rough? Is it raining or windy?\""],"asks":["\"Is it currently daylight or dark? What is the sea condition — calm, choppy, or rough? Is it raining or windy?\""]}],"kind":"interrogation"},{"roman":"X","heading":"INSTRUCTIONS FOR A CALLER IN THE WATER","prompts":[{"label":"In-Water Survival","lines":["\"Put on a life jacket now if you have one and are not already wearing it.\"","\"Do not remove your clothes or shoes — they help you float and stay warm.\"","\"If the vessel or any large floating debris is still on the surface, stay with it — do not swim away from it.\"","\"If there are other people near you, group together — it keeps you warmer and easier to spot.\""],"asks":["\"Put on a life jacket now if you have one and are not already wearing it.\"","\"Do not remove your clothes or shoes — they help you float and stay warm.\"","\"If the vessel or any large floating debris is still on the surface, stay with it — do not swim away from it.\"","\"If there are other people near you, group together — it keeps you warmer and easier to spot.\""]}],"kind":"interrogation"},{"roman":"XI","heading":"INSTRUCTIONS FOR A CALLER STILL ABOARD","prompts":[{"label":"Onboard Safety","lines":["\"Move to the vessel's designated assembly or muster point if it is safe to do so.\"","\"Life jackets should go to children and elderly passengers first.\"","\"Do not jump or abandon the vessel unless the crew or captain instructs you to — stay with the vessel as long as it is safe.\""],"asks":["\"Move to the vessel's designated assembly or muster point if it is safe to do so.\"","\"Life jackets should go to children and elderly passengers first.\"","\"Do not jump or abandon the vessel unless the crew or captain instructs you to — stay with the vessel as long as it is safe.\""]}],"kind":"interrogation"},{"roman":"XII","heading":"FOLLOW-UP AND MONITORING","prompts":[{"label":"Ongoing Contact","lines":["\"Stay on the line if you can. Tell me if your position changes or if you spot other survivors.\""],"asks":["\"Stay on the line if you can. Tell me if your position changes or if you spot other survivors.\""]}],"kind":"interrogation"}],"counts":{"sections":12,"prompts":13,"lines":24,"quoted_asks":21},"localize_flags":["[LOCAL INSERT: for inland lakes/rivers outside USCG jurisdiction, substitute local marine patrol/water rescue unit]"],"crosslinks":[{"section":"VI","prompt":"In-Water Victims","when":"unresponsive in the water","skills":["EMS_CPR-Adult.html","EMS_CPR-Child.html","EMS_CPR-Infant.html","EMS_Monitoring-ABCs.html"]}]},{"file":"DISASTER_Storm-Surge.html","discipline":"DISASTER","title":"911 Dispatch Protocol: Storm Surge / Coastal Flooding","subtitle":null,"sections":[{"roman":"I","heading":"INITIAL CALL RECEIPT","prompts":[{"label":"Location & Callback — Every Call, First","lines":["“Where is your emergency? Give me the exact address — street address, nearest cross street or landmark, and the apartment, floor, or unit if you're inside a building.”","“What number are you calling from, in case we get disconnected?”"],"asks":["“Where is your emergency? Give me the exact address — street address, nearest cross street or landmark, and the apartment, floor, or unit if you're inside a building.”","“What number are you calling from, in case we get disconnected?”"]},{"label":"Location Confirmation","lines":["Immediately confirm the caller's exact location — street address, nearest cross street or landmark, and the apartment, floor, or unit if inside a building — so responders are dispatched accurately and without delay."],"asks":[]}],"kind":"interrogation"},{"roman":"II","heading":"THREAT RECOGNITION","prompts":[{"label":"This Is Not An Ordinary Flood","lines":["A storm surge is seawater pushed inland by a hurricane's wind and pressure — it is a different, faster, and far more dangerous event than a river or rainfall flood, and a caller near the coast during a hurricane may not realize which one they are describing. Ask directly: \"Is the water coming from the sea, and is it rising very fast?\""],"asks":[]},{"label":"Warning Status","lines":["\"Do you know if the National Weather Service has issued a storm surge warning or watch for your coastal area?\""],"asks":["\"Do you know if the National Weather Service has issued a storm surge warning or watch for your coastal area?\""]}],"kind":"interrogation"},{"roman":"III","heading":"HOUSEHOLD ASSESSMENT","prompts":[{"label":"Exposure","lines":["\"About how far are you from the shoreline — can you estimate in feet or yards?\""],"asks":["\"About how far are you from the shoreline — can you estimate in feet or yards?\""]},{"label":"Household Mobility","lines":["\"Who is with you, and can everyone move quickly — are there elderly, children, or persons with disability who will need help evacuating?\""],"asks":["\"Who is with you, and can everyone move quickly — are there elderly, children, or persons with disability who will need help evacuating?\""]}],"kind":"interrogation"},{"roman":"IV","heading":"EVACUATION STATUS","prompts":[{"label":"Current Movement","lines":["\"Have you already started evacuating? Are you heading inland, or moving up to a higher floor of a strong building?\""],"asks":["\"Have you already started evacuating? Are you heading inland, or moving up to a higher floor of a strong building?\""]}],"kind":"interrogation"},{"roman":"V","heading":"DISPATCH COORDINATION","prompts":[{"label":"Local Forced-Evacuation Coordination","lines":["Relay households that are not moving in a designated high-risk coastal zone to [LOCAL INSERT: local law enforcement/emergency management agency] immediately — forced evacuation of at-risk coastal households is coordinated at the local/county level, and that team may be the only one able to reach a household in time."],"asks":[]},{"label":"Local & State Emergency Management","lines":["Log the call with [LOCAL INSERT: local emergency management agency] for evacuation-shelter capacity and routing, and ensure it feeds the state EMA/FEMA monitoring picture for the affected coastline."],"asks":[]},{"label":"Maritime Advisory","lines":["If any boats or fishing vessels are still out or docked near the affected coast, relay to the U.S. Coast Guard for a maritime advisory."],"asks":[]}],"kind":"interrogation"},{"roman":"VI","heading":"IMMEDIATE EVACUATION INSTRUCTIONS","prompts":[{"label":"Move Now, Not When You See Water","lines":["\"If a storm surge warning is in effect for your area, evacuate now — move inland, or to the upper floor of the strongest, most solid concrete building nearby. Do not wait until you can see the water — a storm surge can arrive faster than you can react.\""],"asks":["\"If a storm surge warning is in effect for your area, evacuate now — move inland, or to the upper floor of the strongest, most solid concrete building nearby. Do not wait until you can see the water — a storm surge can arrive faster than you can react.\""]},{"label":"Timing","lines":["\"Leave while the wind and roads still allow you to move safely — once the hurricane's winds intensify, evacuation becomes much harder and much more dangerous.\""],"asks":["\"Leave while the wind and roads still allow you to move safely — once the hurricane's winds intensify, evacuation becomes much harder and much more dangerous.\""]}],"kind":"interrogation"},{"roman":"VII","heading":"IF EVACUATION IS NO LONGER POSSIBLE","prompts":[{"label":"Vertical Shelter As A Last Resort","lines":["\"If you truly cannot leave, go to the highest, most interior part of the strongest structure you have access to, away from any windows or walls facing the sea.\""],"asks":["\"If you truly cannot leave, go to the highest, most interior part of the strongest structure you have access to, away from any windows or walls facing the sea.\""]}],"kind":"interrogation"},{"roman":"VIII","heading":"WHY THIS IS DIFFERENT FROM A REGULAR FLOOD","prompts":[{"label":"Reinforce The Distinction","lines":["\"This is seawater being pushed in by the storm, not rainwater — it can rise very fast and very high along the coast. Please don't wait to see how bad it gets.\""],"asks":["\"This is seawater being pushed in by the storm, not rainwater — it can rise very fast and very high along the coast. Please don't wait to see how bad it gets.\""]}],"kind":"interrogation"}],"counts":{"sections":8,"prompts":14,"lines":15,"quoted_asks":10},"localize_flags":["[LOCAL INSERT: local emergency management agency]","[LOCAL INSERT: local law enforcement/emergency management agency]"]},{"file":"DISASTER_Tsunami.html","discipline":"DISASTER","title":"911 Dispatch Protocol: Tsunami Warning / Coastal Evacuation","subtitle":null,"sections":[{"roman":"I","heading":"INITIAL CALL RECEIPT","prompts":[{"label":"Location & Callback — Every Call, First","lines":["“Where is your emergency? Give me the exact address — street address, nearest cross street or landmark, and the apartment, floor, or unit if you're inside a building.”","“What number are you calling from, in case we get disconnected?”"],"asks":["“Where is your emergency? Give me the exact address — street address, nearest cross street or landmark, and the apartment, floor, or unit if you're inside a building.”","“What number are you calling from, in case we get disconnected?”"]},{"label":"Location Confirmation","lines":["Immediately confirm the caller's exact location — street address, nearest cross street or landmark, and the apartment, floor, or unit if inside a building — so responders are dispatched accurately and without delay."],"asks":[]},{"label":"Reason for the Call","lines":["\"What made you call — did you feel an earthquake, hear an official warning, or see something unusual happening with the sea?\""],"asks":["\"What made you call — did you feel an earthquake, hear an official warning, or see something unusual happening with the sea?\""]}],"kind":"interrogation"},{"roman":"II","heading":"ASSESSMENT OF THE WARNING SOURCE","prompts":[{"label":"Local-Source Earthquake (Self-Warning)","lines":["If the caller felt a strong or long-lasting earthquake near the coast, treat this as an active tsunami threat immediately — a local-source tsunami can arrive in minutes, faster than any official alert can be issued. Do not wait for a National Weather Service/Tsunami Warning Center bulletin before instructing evacuation."],"asks":[]},{"label":"Natural Warning Signs","lines":["\"Did you notice the sea pulling back or receding unusually far from the shore?\""],"asks":["\"Did you notice the sea pulling back or receding unusually far from the shore?\""]},{"label":"Official Alert","lines":["\"Has the National Weather Service or your local emergency management agency issued an official tsunami warning or sounded a siren?\" — treat any of the three triggers above (felt quake, natural signs, or official alert) as sufficient grounds to instruct immediate evacuation."],"asks":["\"Has the National Weather Service or your local emergency management agency issued an official tsunami warning or sounded a siren?\" — treat any of the three triggers above (felt quake, natural signs, or official alert) as sufficient grounds to instruct immediate evacuation."]}],"kind":"interrogation"},{"roman":"III","heading":"CALLER LOCATION & EXPOSURE","prompts":[{"label":"Exposure Check","lines":["\"Are you in a house, a multi-story building, or in the open along the shore?\""],"asks":["\"Are you in a house, a multi-story building, or in the open along the shore?\""]}],"kind":"interrogation"},{"roman":"IV","heading":"EVACUATION STATUS","prompts":[{"label":"Movement Check","lines":["\"Are you already moving inland or to higher ground? On foot, or by vehicle?\""],"asks":["\"Are you already moving inland or to higher ground? On foot, or by vehicle?\""]}],"kind":"interrogation"},{"roman":"V","heading":"SMALL BOAT OWNERS AT SEA","prompts":[{"label":"If a Family Member Is on the Water","lines":["\"If your boat is already out at sea, do NOT tell them to return to the harbor — a boat is safer riding out a tsunami in deep water than caught in a harbor or near shore when the wave arrives. Tell them to head further out to deep water and stay there until the all-clear.\""],"asks":["\"If your boat is already out at sea, do NOT tell them to return to the harbor — a boat is safer riding out a tsunami in deep water than caught in a harbor or near shore when the wave arrives. Tell them to head further out to deep water and stay there until the all-clear.\""]}],"kind":"interrogation"},{"roman":"VI","heading":"ALERT COORDINATION","prompts":[{"label":"Agency Reference","lines":["Reference the active National Weather Service/Tsunami Warning Center advisory level for the affected coastline where known, and relay confirmed local-source events to [LOCAL INSERT: state/local emergency management agency] and the U.S. Coast Guard for coordinated evacuation and maritime notification."],"asks":[]},{"label":"Mass-Event Note","lines":["A single coastal tsunami event will generate simultaneous calls from many communities along the same shoreline at once — log location clusters so responders and local officials can prioritize the lowest-elevation, most exposed areas first."],"asks":[]}],"kind":"interrogation"},{"roman":"VII","heading":"IMMEDIATE EVACUATION INSTRUCTIONS","prompts":[{"label":"Move Now, Move Inland/Up","lines":["\"Move to high ground or at least several hundred yards inland right now — do not wait to gather belongings.\"","\"If the road is blocked by traffic, leave the vehicle and go on foot, or get into the tallest sturdy concrete building nearby and go to the third floor or higher.\""],"asks":["\"Move to high ground or at least several hundred yards inland right now — do not wait to gather belongings.\"","\"If the road is blocked by traffic, leave the vehicle and go on foot, or get into the tallest sturdy concrete building nearby and go to the third floor or higher.\""]}],"kind":"interrogation"},{"roman":"VIII","heading":"WAVE SERIES WARNING","prompts":[{"label":"Do Not Return After the First Wave","lines":["\"Tsunamis arrive as a series of waves, sometimes over an hour apart, and the first wave is often not the biggest. Do NOT go back down to the shore or return home after the first wave passes — stay on high ground until your local officials or the National Weather Service give the official all-clear.\""],"asks":["\"Tsunamis arrive as a series of waves, sometimes over an hour apart, and the first wave is often not the biggest. Do NOT go back down to the shore or return home after the first wave passes — stay on high ground until your local officials or the National Weather Service give the official all-clear.\""]}],"kind":"interrogation"},{"roman":"IX","heading":"FOLLOW-UP ACTIONS","prompts":[{"label":"Staying Safe and Reachable","lines":["\"Stay where you are on high ground. Keep your phone charged if you can, and listen for [LOCAL INSERT: local siren/alert system] confirming it is safe to return.\""],"asks":["\"Stay where you are on high ground. Keep your phone charged if you can, and listen for [LOCAL INSERT: local siren/alert system] confirming it is safe to return.\""]}],"kind":"interrogation"}],"counts":{"sections":9,"prompts":14,"lines":16,"quoted_asks":12},"localize_flags":["[LOCAL INSERT: local siren/alert system]","[LOCAL INSERT: state/local emergency management agency]"]},{"file":"DISASTER_Hurricane.html","discipline":"DISASTER","title":"911 Dispatch Protocol: Hurricane / Tropical Storm (Category 1–5)","subtitle":null,"sections":[{"roman":"I","heading":"INITIAL CALL RECEIPT","prompts":[{"label":"Location & Callback — Every Call, First","lines":["“Where is your emergency? Give me the exact address — street address, nearest cross street or landmark, and the apartment, floor, or unit if you're inside a building.”","“What number are you calling from, in case we get disconnected?”"],"asks":["“Where is your emergency? Give me the exact address — street address, nearest cross street or landmark, and the apartment, floor, or unit if you're inside a building.”","“What number are you calling from, in case we get disconnected?”"]},{"label":"Location Confirmation","lines":["Immediately confirm the caller's exact location — street address, nearest cross street or landmark, and the apartment, floor, or unit if inside a building — so responders are dispatched accurately and without delay."],"asks":[]},{"label":"Caller Safety Check","lines":["\"Are you safe right now, at this moment?\""],"asks":["\"Are you safe right now, at this moment?\""]}],"kind":"interrogation"},{"roman":"II","heading":"STORM PHASE ASSESSMENT","prompts":[{"label":"Where Are We In The Storm","lines":["\"Has the storm already reached your area, or are you calling to prepare before it arrives?\""],"asks":["\"Has the storm already reached your area, or are you calling to prepare before it arrives?\""]},{"label":"NWS Category / Warning Level","lines":["\"Do you know what Hurricane Category the National Weather Service/National Hurricane Center has assigned, or whether a Tornado Warning has been issued for your area?\" — log the category or warning type if the caller knows it; if not, dispatch determines it from the current National Weather Service bulletin for that area. The category or warning level (Category 1 lowest to 5 highest for hurricanes; Tornado Watch vs. Tornado Warning for tornadoes) sets both the caller-safety guidance you give and whether units can be sent right now."],"asks":["\"Do you know what Hurricane Category the National Weather Service/National Hurricane Center has assigned, or whether a Tornado Warning has been issued for your area?\" — log the category or warning type if the caller knows it; if not, dispatch determines it from the current National Weather Service bulletin for that area. The category or warning level (Category 1 lowest to 5 highest for hurricanes; Tornado Watch vs. Tornado Warning for tornadoes) sets both the caller-safety guidance you give and whether units can be sent right now."]}],"kind":"interrogation"},{"roman":"III","heading":"NATURE OF THE EMERGENCY","prompts":[{"label":"Pre-Landfall Calls","lines":["\"Are you calling because you need to evacuate, or because you need help securing your home before the storm hits?\""],"asks":["\"Are you calling because you need to evacuate, or because you need help securing your home before the storm hits?\""]},{"label":"During-Storm Calls","lines":["\"What is happening right now — is your roof damaged or gone, is anyone trapped, are there fallen trees or electrical lines, or have you seen a tornado or funnel cloud?\""],"asks":["\"What is happening right now — is your roof damaged or gone, is anyone trapped, are there fallen trees or electrical lines, or have you seen a tornado or funnel cloud?\""]}],"kind":"interrogation"},{"roman":"IV","heading":"SAFETY ASSESSMENT","prompts":[{"label":"Responder Rollout Feasibility","lines":["While winds remain at damaging levels for the caller's area, responders may NOT be able to roll safely — explain this plainly to the caller rather than promising an immediate arrival: \"Our teams cannot travel safely in winds this strong right now. I am going to help you stay as safe as possible until conditions allow them to reach you.\""],"asks":[]},{"label":"Household At-Risk Members","lines":["\"Who is with you right now — are there elderly, children, persons with disability, or anyone who cannot move quickly on their own?\""],"asks":["\"Who is with you right now — are there elderly, children, persons with disability, or anyone who cannot move quickly on their own?\""]}],"kind":"interrogation"},{"roman":"V","heading":"COMMUNICATION STATUS","prompts":[{"label":"Signal & Power Loss Risk","lines":["Power and cell signal commonly fail together during hurricanes, sometimes across an entire county or region. Get the exact location, the callback number, and every critical instruction out early — front-load your instructions because this call may drop and not reconnect."],"asks":[]},{"label":"Battery Status","lines":["\"How much battery does your phone have left?\" — if low, prioritize getting location and the household's immediate needs before anything else."],"asks":["\"How much battery does your phone have left?\" — if low, prioritize getting location and the household's immediate needs before anything else."]}],"kind":"interrogation"},{"roman":"VI","heading":"DISPATCH COORDINATION","prompts":[{"label":"Local Coordination","lines":["Notify [LOCAL INSERT: local emergency management agency/volunteer fire department] covering the caller's area — they are frequently the first and only responder reachable during the height of a storm, and can confirm conditions before a unit is committed."],"asks":[]},{"label":"Hold-and-Stage Decision","lines":["If winds at the caller's location exceed safe travel conditions for the responding agency, stage units and hold dispatch until conditions improve, while keeping the caller on self-protection instructions below. Re-attempt callback as soon as conditions and signal allow."],"asks":[]},{"label":"Evacuation Center Reference","lines":["If the caller has not evacuated and is in a designated risk area, confirm the nearest [LOCAL INSERT: designated local evacuation shelter] and relay the route."],"asks":[]}],"kind":"interrogation"},{"roman":"VII","heading":"PRE-LANDFALL INSTRUCTIONS","prompts":[{"label":"Evacuate Early, Not Late","lines":["\"If you are in a low-lying, coastal, riverside, or landslide-prone area, go now to [LOCAL INSERT: your designated local evacuation shelter] — do not wait until the wind or water arrives.\""],"asks":["\"If you are in a low-lying, coastal, riverside, or landslide-prone area, go now to [LOCAL INSERT: your designated local evacuation shelter] — do not wait until the wind or water arrives.\""]},{"label":"Securing The Home (If Staying, Not In A Risk Zone)","lines":["\"Secure or bring inside anything loose that can be blown around — roofing sheets, furniture, tanks, signage.\""],"asks":["\"Secure or bring inside anything loose that can be blown around — roofing sheets, furniture, tanks, signage.\""]}],"kind":"interrogation"},{"roman":"VIII","heading":"DURING-STORM SELF-PROTECTION INSTRUCTIONS","prompts":[{"label":"Shelter In Place Safely","lines":["\"Move to the most interior room of your house, away from windows, glass, and the roofline.\""],"asks":["\"Move to the most interior room of your house, away from windows, glass, and the roofline.\""]},{"label":"If The Roof Is Gone Or You Are Trapped","lines":["\"Find the lowest, most sheltered interior spot away from anything that can fall — a hallway, closet, bathroom, or under a sturdy table. If a tornado has been reported and you have access to a basement or storm shelter, go there now.\""],"asks":["\"Find the lowest, most sheltered interior spot away from anything that can fall — a hallway, closet, bathroom, or under a sturdy table. If a tornado has been reported and you have access to a basement or storm shelter, go there now.\""]},{"label":"Electrical & Debris Hazards","lines":["\"Stay away from any downed electrical lines or damaged wiring, even if the power looks off — treat every wire as live.\""],"asks":["\"Stay away from any downed electrical lines or damaged wiring, even if the power looks off — treat every wire as live.\""]}],"kind":"interrogation"},{"roman":"IX","heading":"POST-STORM / FOLLOW-UP","prompts":[{"label":"Expect A Surge In Calls","lines":["Call volume rises sharply once winds drop — structural damage, trapped persons, injuries, and downed-line reports arrive in a wave. Triage by immediate life safety first."],"asks":[]},{"label":"Caller Guidance After The Storm Passes","lines":["\"Do not walk through standing water — there may be downed lines, open holes, or debris you cannot see.\""],"asks":["\"Do not walk through standing water — there may be downed lines, open holes, or debris you cannot see.\""]}],"kind":"interrogation"}],"counts":{"sections":9,"prompts":21,"lines":22,"quoted_asks":15},"localize_flags":["[LOCAL INSERT: designated local evacuation shelter]","[LOCAL INSERT: local emergency management agency/volunteer fire department]","[LOCAL INSERT: your designated local evacuation shelter]"]},{"file":"DISASTER_Volcanic-Eruption-Ashfall.html","discipline":"DISASTER","title":"911 Dispatch Protocol: Volcanic Eruption / Ashfall — Regional Hazard","subtitle":"USGS Volcano Alert Levels: Normal – Advisory – Watch – Warning","sections":[{"roman":"I","heading":"INITIAL CALL RECEIPT","prompts":[{"label":"Location & Callback — Every Call, First","lines":["“Where is your emergency? Give me the exact address — street address, nearest cross street or landmark, and the apartment, floor, or unit if you're inside a building.”","“What number are you calling from, in case we get disconnected?”"],"asks":["“Where is your emergency? Give me the exact address — street address, nearest cross street or landmark, and the apartment, floor, or unit if you're inside a building.”","“What number are you calling from, in case we get disconnected?”"]},{"label":"Location & Volcano Confirmation","lines":["\"What is your neighborhood, nearest cross street, and nearest landmark? Which volcano is this regarding?\" [LOCAL INSERT: name of nearest monitored volcano/USGS Volcano Observatory]"],"asks":["\"What is your neighborhood, nearest cross street, and nearest landmark? Which volcano is this regarding?\" [LOCAL INSERT: name of nearest monitored volcano/USGS Volcano Observatory]"]}],"kind":"interrogation"},{"roman":"II","heading":"ASSESSMENT OF ACTIVITY","prompts":[{"label":"What the Caller Observed","lines":["\"Is ash currently falling where you are? How heavy — light dusting, or thick enough that it's hard to see?\""],"asks":["\"Is ash currently falling where you are? How heavy — light dusting, or thick enough that it's hard to see?\""]},{"label":"Alert Level Context (for dispatcher reference)","lines":["This is a regional hazard applicable only to jurisdictions near an actively monitored volcano [LOCAL INSERT: nearest volcano and USGS Volcano Observatory — e.g., Cascades Volcano Observatory, Alaska Volcano Observatory, Hawaiian Volcano Observatory]. USGS uses Volcano Alert Levels for each monitored volcano — roughly: Normal (background activity), Advisory (elevated unrest above background), Watch (heightened unrest with increased potential for eruption, timeframe uncertain to weeks), Warning (hazardous eruption imminent, underway, or suspected). Watch and above typically triggers evacuation planning for the nearest at-risk zone; ask the caller if their neighborhood has been named in an evacuation advisory. [LOCAL INSERT: local evacuation zone reference]"],"asks":[]}],"kind":"interrogation"},{"roman":"III","heading":"ASHFALL SYMPTOMS","prompts":[{"label":"Respiratory Distress","lines":["\"Is anyone having trouble breathing, coughing heavily, or experiencing eye or throat irritation from the ash?\""],"asks":["\"Is anyone having trouble breathing, coughing heavily, or experiencing eye or throat irritation from the ash?\""]}],"kind":"interrogation"},{"roman":"IV","heading":"STRUCTURAL RISK FROM ASH","prompts":[{"label":"Roof Load Check","lines":["\"How thick is the ash accumulating on your roof? Wet ash is much heavier than dry ash and can collapse a roof.\""],"asks":["\"How thick is the ash accumulating on your roof? Wet ash is much heavier than dry ash and can collapse a roof.\""]}],"kind":"interrogation"},{"roman":"V","heading":"LAHAR (MUDFLOW) RISK","prompts":[{"label":"River/Creek Channel Proximity","lines":["\"Are you near a river, creek, or channel that drains from the volcano?\"","\"Is it raining now, or has it rained recently? Rain on loose ash deposits can trigger a lahar — a fast-moving wall of volcanic mud and debris — with little warning.\""],"asks":["\"Are you near a river, creek, or channel that drains from the volcano?\"","\"Is it raining now, or has it rained recently? Rain on loose ash deposits can trigger a lahar — a fast-moving wall of volcanic mud and debris — with little warning.\""]}],"kind":"interrogation"},{"roman":"VI","heading":"EVACUATION COORDINATION","prompts":[{"label":"Danger Zone Reference","lines":["Neighborhoods inside the designated hazard zone for the applicable Alert Level are evacuated proactively by [LOCAL INSERT: local/state emergency management agency] and local officials, often before individual emergency calls come in — confirm whether the caller's neighborhood has already been ordered to evacuate."],"asks":[]},{"label":"Evacuation Center & Livestock Coordination","lines":["Relay households needing transport to [LOCAL INSERT: local emergency management agency] for evacuation shelter placement. Note that many families delay evacuation over livestock or pets — acknowledge the concern and relay it to [LOCAL INSERT: local emergency management agency], which may coordinate separate animal holding areas, rather than letting it stall the family's own evacuation."],"asks":[]}],"kind":"interrogation"},{"roman":"VII","heading":"RESPIRATORY PROTECTION","prompts":[{"label":"Immediate Instructions","lines":["\"Stay indoors and close all doors and windows to keep ash out.\"","\"Cover your nose and mouth with a damp cloth or an N95 mask if you have one, especially anyone with breathing difficulty.\""],"asks":["\"Stay indoors and close all doors and windows to keep ash out.\"","\"Cover your nose and mouth with a damp cloth or an N95 mask if you have one, especially anyone with breathing difficulty.\""]}],"kind":"interrogation"},{"roman":"VIII","heading":"ROOF & STRUCTURE SAFETY","prompts":[{"label":"Clearing Ash Safely","lines":["\"If it is safe and the ash is not yet too thick, you can carefully shovel wet ash off a flat or low-slope roof to reduce the weight — but do not climb onto a roof that is already sagging or creaking.\""],"asks":["\"If it is safe and the ash is not yet too thick, you can carefully shovel wet ash off a flat or low-slope roof to reduce the weight — but do not climb onto a roof that is already sagging or creaking.\""]}],"kind":"interrogation"},{"roman":"IX","heading":"DRIVING & WATER SAFETY","prompts":[{"label":"Driving in Ashfall","lines":["\"Avoid driving if possible — ashfall reduces visibility to near zero and makes roads slippery. If you must drive, go slowly, use your headlights, and use your wipers and a small amount of water to clear the windshield rather than wiping dry ash across the glass.\""],"asks":["\"Avoid driving if possible — ashfall reduces visibility to near zero and makes roads slippery. If you must drive, go slowly, use your headlights, and use your wipers and a small amount of water to clear the windshield rather than wiping dry ash across the glass.\""]},{"label":"Protecting Drinking Water","lines":["\"Cover any open water containers, tanks, or wells to keep ash out. If ash has already fallen into your drinking water, do not drink it — use a covered or alternate source until it can be checked.\""],"asks":["\"Cover any open water containers, tanks, or wells to keep ash out. If ash has already fallen into your drinking water, do not drink it — use a covered or alternate source until it can be checked.\""]}],"kind":"interrogation"},{"roman":"X","heading":"IF NEAR A RIVER CHANNEL (LAHAR)","prompts":[{"label":"Lahar Evacuation","lines":["\"If you are near a river or creek that drains from the volcano and it is raining now or has rained recently, move away from the channel and to higher ground immediately — do not wait to see the lahar arrive, and never attempt to cross a channel that is running with ash-laden water.\""],"asks":["\"If you are near a river or creek that drains from the volcano and it is raining now or has rained recently, move away from the channel and to higher ground immediately — do not wait to see the lahar arrive, and never attempt to cross a channel that is running with ash-laden water.\""]}],"kind":"interrogation"}],"counts":{"sections":10,"prompts":14,"lines":17,"quoted_asks":14},"localize_flags":["[LOCAL INSERT: local emergency management agency]","[LOCAL INSERT: local evacuation zone reference]","[LOCAL INSERT: local/state emergency management agency]","[LOCAL INSERT: name of nearest monitored volcano/USGS Volcano Observatory]","[LOCAL INSERT: nearest volcano and USGS Volcano Observatory — e.g., Cascades Volcano Observatory, Alaska Volcano Observatory, Hawaiian Volcano Observatory]"]},{"file":"EMS_AED-Instructions.html","discipline":"EMS","title":"911 Dispatch Protocol: AED Instructions","subtitle":"Skill Script · Step-by-Step Procedure","sections":[{"roman":"I","heading":"INITIAL CALL RECEIPT","kind":"procedure","prompts":[{"label":"Location Confirmation","lines":["Immediately confirm the caller's exact location — street address, nearest cross street or landmark, and the apartment, floor, or unit if inside a building — so responders are dispatched accurately and without delay."],"asks":[]},{"label":"Location Confirmation","step":"1","lines":["Verify the caller's location to ensure emergency services are dispatched to the correct address."],"asks":[]},{"label":"Callback Number","lines":["Verify the number the caller is calling from, in case the call is disconnected."],"asks":[]},{"label":"Assessment of the Situation","step":"2","lines":["Quickly determine the need for AED use by identifying if the patient is unresponsive and not breathing normally."],"asks":[]}]},{"roman":"II","heading":"AED DEPLOYMENT INSTRUCTIONS","kind":"procedure","prompts":[{"label":"Locating the AED","step":"3","lines":["Instruct the caller to find an AED if not already located. Provide directions to the nearest AED if known and accessible."],"asks":[]},{"label":"Sending for Help","step":"4","lines":["If there are other people nearby, instruct someone to retrieve the AED while the caller stays with the patient."],"asks":[]}]},{"roman":"III","heading":"PREPARING TO USE THE AED","kind":"procedure","prompts":[{"label":"Powering On","step":"5","lines":["Tell the caller to turn on the AED. The device will provide verbal instructions."],"asks":[]},{"label":"Bare Chest Preparation","step":"6","lines":["Instruct the caller to remove any clothing from the patient's chest. Check for and remove any medication patches or metallic items."],"asks":[]}]},{"roman":"IV","heading":"PAD PLACEMENT","kind":"procedure","prompts":[{"label":"Applying Pads","step":"7","lines":["Guide the caller to place the AED pads on the patient's bare chest:","One pad on the right side of the chest, just below the collarbone.","The other pad on the lower left side of the chest."],"asks":[]},{"label":"Positioning for Children or Infants","step":"8","lines":["If the patient is a child under 8 years or weighs less than 55 pounds, use pediatric pads if available. If not, use adult pads and ensure they do not touch each other."],"asks":[]}]},{"roman":"V","heading":"ANALYZING AND SHOCK DELIVERY","kind":"procedure","prompts":[{"label":"Clear the Area","step":"9","lines":["Ensure that everyone is clear of the patient. Instruct the caller to loudly announce, “Stand clear!”"],"asks":[]},{"label":"Press Shock Button","step":"10","lines":["If the AED advises a shock, ensure that nobody is touching the patient and tell the caller to press the shock button."],"asks":[]}]},{"roman":"VI","heading":"POST-SHOCK GUIDANCE","kind":"procedure","prompts":[{"label":"CPR Instructions","step":"11","lines":["After delivering a shock, or if no shock is advised, instruct the caller to begin CPR immediately, guided by the dispatcher if necessary."],"asks":[]},{"label":"Continued Monitoring","step":"12","lines":["Instruct the caller to continue following the AED's prompts. If additional shocks are indicated, repeat the safety checks and shock delivery process."],"asks":[]}]},{"roman":"VII","heading":"ARRIVAL OF EMERGENCY SERVICES","kind":"procedure","prompts":[{"label":"Handover","step":"13","lines":["Once emergency services arrive, instruct the caller to inform them about the actions taken and any shocks delivered."],"asks":[]},{"label":"Stay on the Line","step":"14","lines":["Encourage the caller to stay on the line until help has taken over and they are told they can hang up."],"asks":[]}]},{"roman":"VIII","heading":"CALL CONCLUSION","kind":"procedure","prompts":[{"label":"Documentation","step":"15","lines":["Ensure detailed documentation of all steps taken and instructions given during the call."],"asks":[]},{"label":"Debrief the Caller","step":"16","lines":["Thank the caller for their bravery and cooperation in a stressful situation."],"asks":[]},{"label":"Dispatcher Review","step":"17","lines":["After the call, review the process to ensure all procedures were followed correctly and to discuss any improvements for future responses."],"asks":[]}]},{"roman":"IX","heading":"CPR INTEGRATION","kind":"procedure","prompts":[{"label":"Cross-Referencing CPR Protocols","step":"18","lines":["Immediately after an AED shock is delivered or if no shock is advised, instruct the caller to begin CPR. The dispatcher must cross-reference the latest CPR protocols to provide accurate, step-by-step guidance to the caller. This includes:","Compression-Only CPR: For untrained callers, instruct them to perform hands-only CPR at a rate of 100 to 120 compressions per minute. Explain the proper hand placement and depth.","Full CPR: For callers trained in CPR, instruct them to give 30 compressions followed by two rescue breaths. Continue to guide them through the cycles."],"asks":[]},{"label":"Regular Updates","step":"19","lines":["Regularly update CPR protocols in the dispatch system to reflect current guidelines from authoritative sources like the American Heart Association or equivalent."],"asks":[]}]}],"counts":{"sections":9,"prompts":21,"lines":25,"quoted_asks":0},"localize_flags":[]},{"file":"EMS_Abdominal-Pain.html","discipline":"EMS","title":"911 Dispatch Protocol: Abdominal Pain","subtitle":null,"sections":[{"roman":"I","heading":"INITIAL ASSESSMENT","prompts":[{"label":"Location & Callback — Every Call, First","lines":["“Where is your emergency? Give me the exact address — street address, nearest cross street or landmark, and the apartment, floor, or unit if you're inside a building.”","“What number are you calling from, in case we get disconnected?”"],"asks":["“Where is your emergency? Give me the exact address — street address, nearest cross street or landmark, and the apartment, floor, or unit if you're inside a building.”","“What number are you calling from, in case we get disconnected?”"]},{"label":"Age","lines":["How old is the patient?"],"asks":[]},{"label":"Consciousness","lines":["Is the patient alert and able to speak?"],"asks":[]},{"label":"Breathing","lines":["Is the patient breathing normally?"],"asks":[]},{"label":"Gender","lines":["What is the patient's gender?"],"asks":[]}],"kind":"interrogation"},{"roman":"II","heading":"ASSESSMENT QUESTIONS","prompts":[{"label":"Chest Pain Presence","lines":["Does the patient have any chest pain?"],"asks":[]},{"label":"Signs of Shock or Distress","lines":["Is the patient experi
