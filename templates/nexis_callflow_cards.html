encing symptoms like faintness, dizziness, excessive sweating, or appearing pale?"],"asks":[]},{"label":"Potential Pregnancy","lines":["Is there any possibility that the patient could be pregnant?"],"asks":[]},{"label":"Communication Abilities","lines":["Can the patient still talk and respond clearly?"],"asks":[]},{"label":"Recent Physical Trauma","lines":["Has the patient had any recent injuries or surgeries?"],"asks":[]}],"kind":"interrogation"},{"roman":"III","heading":"SECONDARY ASSESSMENT QUESTIONS","prompts":[{"label":"Pain Location","lines":["Where exactly is the pain located in the abdomen?"],"asks":[]},{"label":"Medical History","lines":["Has the patient had similar symptoms in the past?"],"asks":[]},{"label":"Gastrointestinal Symptoms","lines":["Has the patient vomited blood or had any bloody or black bowel movements?"],"asks":[]},{"label":"Substance Use","lines":["Has the patient recently taken any medications, drugs, or alcohol?"],"asks":[]}],"kind":"interrogation"},{"roman":"IV","heading":"PRE-ARRIVAL INSTRUCTIONS","prompts":[{"label":"Patient Mobility","lines":["Avoid moving the patient. If movement is necessary, it should be minimized."],"asks":[]},{"label":"Clothing and Comfort","lines":["Loosen any tight clothing to alleviate discomfort."],"asks":[]},{"label":"Dietary Restrictions","lines":["Do not give the patient anything to eat or drink, even if they request it and are conscious."],"asks":[]}],"kind":"interrogation"},{"roman":"V","heading":"ADDITIONAL CONSIDERATIONS","prompts":[{"label":"Vital Signs Confirmation","lines":["Re-confirm the patient's vital signs as needed to monitor for any changes or deterioration."],"asks":[]},{"label":"Age and Gender Relevance","lines":["Double-check the age and gender details provided, as these may influence the seriousness of potential cardiac issues and appropriate medical response."],"asks":[]}],"kind":"interrogation"}],"counts":{"sections":5,"prompts":19,"lines":20,"quoted_asks":2},"localize_flags":[]},{"file":"EMS_Allergic-Reaction-Sting.html","discipline":"EMS","title":"911 Dispatch Protocol: Allergic Reaction / Sting","subtitle":null,"sections":[{"roman":"I","heading":"VITAL SIGNS ASSESSMENT","prompts":[{"label":"Location & Callback — Every Call, First","lines":["\"Where is your emergency? Give me the exact address — street address, nearest cross street or landmark, and the apartment, floor, or unit if you're inside a building.\"","\"What number are you calling from, in case we get disconnected?\""],"asks":["\"Where is your emergency? Give me the exact address — street address, nearest cross street or landmark, and the apartment, floor, or unit if you're inside a building.\"","\"What number are you calling from, in case we get disconnected?\""]},{"label":"Age","lines":["How old is the patient?"],"asks":[]},{"label":"Consciousness","lines":["Is the patient awake and able to speak?"],"asks":[]},{"label":"Breathing","lines":["Is the patient having any trouble breathing or swallowing?"],"asks":[]},{"label":"Gender","lines":["What is the patient's gender?"],"asks":[]}],"kind":"interrogation"},{"roman":"II","heading":"PRIMARY ASSESSMENT QUESTIONS","prompts":[{"label":"Exposure","lines":["What were they exposed to — food, an insect sting, a medication, or something unknown? When?"],"asks":[]},{"label":"Severe Signs — Anaphylaxis","lines":["Any swelling of the face, lips, or tongue? Tightness in the throat? Wheezing or trouble breathing? Widespread hives? (Any of these = severe reaction.)"],"asks":[]},{"label":"How Fast","lines":["Are the symptoms getting worse? How quickly?"],"asks":[]}],"kind":"interrogation"},{"roman":"III","heading":"SECONDARY ASSESSMENT QUESTIONS","prompts":[{"label":"History","lines":["Does the patient have a known allergy? Have they had a severe reaction before?"],"asks":[]},{"label":"Epinephrine Auto-Injector","lines":["Does the patient have an epinephrine auto-injector (EpiPen) with them or nearby?"],"asks":[]},{"label":"Stinger","lines":["If a sting: is the stinger still in the skin?"],"asks":[]}],"kind":"interrogation"},{"roman":"IV","heading":"PRE-ARRIVAL INSTRUCTIONS","prompts":[{"label":"Severe Reaction — Use the Auto-Injector Now","lines":["If there is trouble breathing or swelling of the face or throat and an auto-injector is available: use it now — I will talk you through it step by step."],"asks":[]},{"label":"Position","lines":["Trouble breathing: let them sit upright. Feeling faint, pale, or weak: lie them flat and raise the legs — and watch for shock."],"asks":[]},{"label":"Nothing by Mouth","lines":["If there is any swelling or trouble swallowing, give nothing to eat or drink."],"asks":[]},{"label":"Sting Care","lines":["Scrape the stinger out sideways with a card edge or fingernail — do not squeeze it. A cold pack over the site helps swelling."],"asks":[]},{"label":"Stay on the Line — It Can Come Back","lines":["Severe reactions can ease and then return. Stay with the patient and stay on the line with me; if they become unresponsive or stop breathing normally, tell me immediately — I will guide you through CPR."],"asks":[]}],"kind":"interrogation"}],"localize_flags":[],"crosslinks":[{"section":"IV","prompt":"Severe Reaction — Use the Auto-Injector Now","when":"severe reaction with auto-injector available","skills":["EMS_EpiPen-Administration.html"]},{"section":"IV","prompt":"Position","when":"faint / pale / shock signs","skills":["EMS_Treating-Shock.html"]},{"section":"IV","prompt":"Stay on the Line — It Can Come Back","when":"unresponsive / not breathing normally","skills":["EMS_CPR-Adult.html","EMS_CPR-Child.html","EMS_AED-Instructions.html"]}],"counts":{"sections":4,"prompts":16,"lines":17,"quoted_asks":2}},{"file":"EMS_Childbirth-Pregnancy.html","discipline":"EMS","title":"911 Dispatch Protocol: Childbirth / Pregnancy / Miscarriage","subtitle":null,"sections":[{"roman":"I","heading":"VITAL SIGNS ASSESSMENT","prompts":[{"label":"Location & Callback — Every Call, First","lines":["\"Where is your emergency? Give me the exact address — street address, nearest cross street or landmark, and the apartment, floor, or unit if you're inside a building.\"","\"What number are you calling from, in case we get disconnected?\""],"asks":["\"Where is your emergency? Give me the exact address — street address, nearest cross street or landmark, and the apartment, floor, or unit if you're inside a building.\"","\"What number are you calling from, in case we get disconnected?\""]},{"label":"Age","lines":["How old is the mother?"],"asks":[]},{"label":"Consciousness & Breathing","lines":["Is she awake, alert, and breathing normally?"],"asks":[]},{"label":"How Far Along","lines":["How many weeks or months pregnant is she? When is the baby due?"],"asks":[]}],"kind":"interrogation"},{"roman":"II","heading":"PRIMARY ASSESSMENT QUESTIONS","prompts":[{"label":"Contractions","lines":["Is she having contractions? How many minutes apart, and how long does each one last?"],"asks":[]},{"label":"Urge to Push / Crowning","lines":["Does she feel the urge to push or to have a bowel movement? Can you see any part of the baby? (If yes — delivery is happening; go to the instructions now.)"],"asks":[]},{"label":"Water Broken","lines":["Has her water broken? Was the fluid clear, or green/brown?"],"asks":[]},{"label":"First Baby","lines":["Is this her first baby? (Later babies often come faster.)"],"asks":[]}],"kind":"interrogation"},{"roman":"III","heading":"SECONDARY ASSESSMENT QUESTIONS","prompts":[{"label":"Bleeding","lines":["Is there heavy bleeding — soaking through pads or clothing?"],"asks":[]},{"label":"Cord Visible","lines":["Can you see the umbilical cord at the opening? (If yes — this is urgent: have her get on knees and chest, hips up, and do not touch or push the cord.)"],"asks":[]},{"label":"Complications & History","lines":["Any known complications — twins, breech, high blood pressure, prior fast deliveries?"],"asks":[]},{"label":"Under 20 Weeks / Miscarriage","lines":["If she is less than about 5 months along with bleeding or severe constant pain: treat as a medical emergency — use pads or towels, save any passed tissue for the hospital, and watch for signs of shock."],"asks":[]}],"kind":"interrogation"},{"roman":"IV","heading":"PRE-ARRIVAL INSTRUCTIONS — DELIVERY","prompts":[{"label":"Prepare","lines":["Do not try to delay or hold back the baby. Get her flat on her back or propped with pillows, clothing off below the waist, clean towels ready, hands washed if possible."],"asks":[]},{"label":"As the Baby Delivers","lines":["Support the baby's head as it comes — never pull. If the cord is around the neck, gently slip it over the head. The baby will be slippery — support the whole body."],"asks":[]},{"label":"Right After Delivery","lines":["Note the time of birth. Dry the baby vigorously and place skin-to-skin on the mother's chest, covered with something warm — head covered too. Do not cut or pull the cord."],"asks":[]},{"label":"If the Baby Is Not Crying or Breathing","lines":["Tell me immediately — rub the baby's back firmly with a towel; if the baby still is not breathing, I will guide you through infant CPR."],"asks":[]},{"label":"Placenta & Bleeding","lines":["The placenta will deliver on its own — never pull the cord. If heavy bleeding continues after delivery, firmly massage the mother's lower belly and use pads or towels; watch her for signs of shock."],"asks":[]}],"kind":"interrogation"}],"localize_flags":[],"crosslinks":[{"section":"IV","prompt":"If the Baby Is Not Crying or Breathing","when":"newborn not breathing","skills":["EMS_CPR-Infant.html"]},{"section":"IV","prompt":"Placenta & Bleeding","when":"heavy bleeding / shock signs","skills":["EMS_Treating-Shock.html"]},{"section":"III","prompt":"Under 20 Weeks / Miscarriage","when":"shock signs","skills":["EMS_Treating-Shock.html"]}],"counts":{"sections":4,"prompts":17,"lines":18,"quoted_asks":2}},{"file":"EMS_Stroke-CVA-TIA.html","discipline":"EMS","title":"911 Dispatch Protocol: Stroke (CVA) / TIA","subtitle":null,"sections":[{"roman":"I","heading":"VITAL SIGNS ASSESSMENT","prompts":[{"label":"Location & Callback — Every Call, First","lines":["\"Where is your emergency? Give me the exact address — street address, nearest cross street or landmark, and the apartment, floor, or unit if you're inside a building.\"","\"What number are you calling from, in case we get disconnected?\""],"asks":["\"Where is your emergency? Give me the exact address — street address, nearest cross street or landmark, and the apartment, floor, or unit if you're inside a building.\"","\"What number are you calling from, in case we get disconnected?\""]},{"label":"Age","lines":["How old is the patient?"],"asks":[]},{"label":"Consciousness","lines":["Is the patient awake and able to respond to you?"],"asks":[]},{"label":"Breathing","lines":["Is the patient breathing normally?"],"asks":[]},{"label":"Gender","lines":["What is the patient's gender?"],"asks":[]}],"kind":"interrogation"},{"roman":"II","heading":"PRIMARY ASSESSMENT QUESTIONS — THE FAST TEST","prompts":[{"label":"Face","lines":["Ask the patient to smile. Does one side of the face droop or look uneven?"],"asks":[]},{"label":"Arms","lines":["Ask the patient to raise both arms and hold them up. Does one arm drift down or fail to lift?"],"asks":[]},{"label":"Speech","lines":["Ask the patient to repeat a simple sentence. Is the speech slurred, garbled, or wrong?"],"asks":[]},{"label":"Time — Critical","lines":["When did the symptoms start? When was the patient last seen normal? (Write this time down — hospital treatment decisions depend on it.)"],"asks":[]}],"kind":"interrogation"},{"roman":"III","heading":"SECONDARY ASSESSMENT QUESTIONS","prompts":[{"label":"Other Sudden Symptoms","lines":["Any sudden severe headache, sudden loss of vision, sudden dizziness, or sudden trouble walking or keeping balance?"],"asks":[]},{"label":"Improving or Worsening","lines":["Are the symptoms getting better, worse, or staying the same? (Symptoms that pass may be a TIA — the response still comes; treat it as a stroke until proven otherwise.)"],"asks":[]},{"label":"History & Medications","lines":["Any history of stroke, heart problems, or diabetes? Is the patient on blood thinners? (Gather medication names for responders if easy to reach.)"],"asks":[]}],"kind":"interrogation"},{"roman":"IV","heading":"PRE-ARRIVAL INSTRUCTIONS","prompts":[{"label":"Nothing by Mouth","lines":["Do not give the patient anything to eat or drink — not even water or medication. Swallowing may not be safe."],"asks":[]},{"label":"Position","lines":["Help them rest in a comfortable position, sitting up or lying with head and shoulders slightly raised. If they are drowsy, drooling, or vomiting, roll them onto their side."],"asks":[]},{"label":"Note the Time & Meds","lines":["Write down the time the symptoms started and gather their medication list or bottles for the responders — it saves treatment time at the hospital."],"asks":[]},{"label":"If the Patient Stops Responding","lines":["If the patient becomes unresponsive or stops breathing normally, tell me immediately — I will guide you through CPR, and send someone for an AED if one is nearby."],"asks":[]},{"label":"Stay & Monitor","lines":["Stay with the patient and watch their breathing and alertness until responders arrive. Tell me if anything changes."],"asks":[]}],"kind":"interrogation"}],"localize_flags":[],"crosslinks":[{"section":"IV","prompt":"If the Patient Stops Responding","when":"unresponsive / not breathing normally","skills":["EMS_CPR-Adult.html","EMS_AED-Instructions.html"]},{"section":"IV","prompt":"Stay & Monitor","when":"monitoring until arrival","skills":["EMS_Monitoring-ABCs.html"]}],"counts":{"sections":4,"prompts":17,"lines":18,"quoted_asks":2}},{"file":"EMS_Administering-Narcan.html","discipline":"EMS","title":"Suspected Overdose — Supportive Care","subtitle":"(Naloxone if available) · Skill Script · Step-by-Step Procedure","sections":[{"roman":"I","heading":"INITIAL CALL RECEIPT","kind":"procedure","prompts":[{"label":"Location Confirmation","step":"1","lines":["Immediately confirm the caller's exact location — street address, nearest cross street or landmark, and the apartment, floor, or unit if inside a building — so responders are dispatched accurately and without delay."],"asks":[]},{"label":"Callback Number","lines":["Verify the number the caller is calling from, in case the call is disconnected."],"asks":[]},{"label":"Situation Assessment","step":"2","lines":["Ask what happened and quickly assess whether the person may have taken or been exposed to drugs or alcohol. Ask whether they are breathing and conscious, and note any visible signs such as slow or irregular breathing, unresponsiveness, vomiting, or bluish lips or fingertips."],"asks":[]}]},{"roman":"II","heading":"SCENE SAFETY","kind":"procedure","prompts":[{"label":"Check for Hazards","step":"3","lines":["Ask the caller whether the immediate area is safe — for example, whether there are other agitated or intoxicated people nearby, drug paraphernalia, needles, weapons, or an unstable environment.","If the scene is not safe, instruct the caller to move to a safe distance and wait for police or EMS before approaching the patient."],"asks":[]}]},{"roman":"III","heading":"REASSURANCE AND SUPPORT","kind":"procedure","prompts":[{"label":"Immediate Assurance","step":"4","lines":["Reassure the caller that help is on the way. Instruct them to keep the phone on speaker mode to continue receiving guidance."],"asks":[]}]},{"roman":"IV","heading":"ASSESS THE PATIENT","kind":"procedure","prompts":[{"label":"Check Responsiveness and Breathing","step":"5","lines":["Instruct the caller to gently tap the person and shout their name. Have the caller look, listen, and feel for breathing for several seconds, checking whether the chest is rising and whether breathing sounds normal."],"asks":[]},{"label":"Open the Airway","step":"6","lines":["If the person is unresponsive, guide the caller to tilt the head back and lift the chin to open the airway, and to check the mouth for anything blocking it — vomit, pills, or other objects — without reaching in blindly."],"asks":[]}]},{"roman":"V","heading":"BREATHING SUPPORT","kind":"procedure","prompts":[{"label":"Rescue Breathing (If Not Breathing Normally)","step":"7","lines":["If the person is not breathing normally, guide the caller to tilt the head back and lift the chin, pinch the nose closed, seal their mouth over the person's mouth, and give one slow breath every 5 to 6 seconds, watching for the chest to rise.","If there is no pulse, or the only breathing present is occasional gasping (agonal breathing), stop rescue breathing and hand off immediately to the CPR protocol for chest compressions."],"asks":[]},{"label":"Recovery Position (If Breathing)","step":"8","lines":["If the person is breathing normally on their own, help the caller place them in the recovery position — on their side, head tilted slightly back and downward — to keep the airway clear and reduce the risk of choking if they vomit."],"asks":[]},{"label":"Continuous Monitoring","step":"9","lines":["Instruct the caller to keep checking breathing and responsiveness continuously, about once a minute, until help arrives, and to be ready to start CPR immediately if breathing stops."],"asks":[]}]},{"roman":"VI","heading":"GATHER SUBSTANCE INFORMATION","kind":"procedure","prompts":[{"label":"What Was Taken","step":"10","lines":["Ask the caller what the person took or was exposed to, when, and how much, if this can be found out without delaying care. Common local possibilities include fentanyl, heroin, prescription opioids (such as oxycodone or hydrocodone), methamphetamine, alcohol, and unknown or unlabeled pills.","Note that callers often report this secondhand — heard from someone else, or assumed — rather than something they saw directly. Record it as reported information, not confirmed fact, and pass it on to responders as such."],"asks":[]},{"label":"Preserve the Sample for Responders","step":"11","lines":["If it is safe to do so, ask the caller to set aside — without touching, tasting, or discarding — any pill container, baggie, wrapper, or remaining substance found at the scene, so responders can identify what was taken."],"asks":[]}]},{"roman":"VII","heading":"NALOXONE (IF AVAILABLE)","kind":"procedure","prompts":[{"label":"Conditional Administration","step":"12","lines":["If naloxone or a labeled opioid antidote is at the scene and someone present knows how to give it, they may administer it while rescue breathing continues."],"asks":[]}]},{"roman":"VIII","heading":"STIMULANT OVERSTIMULATION (SUSPECTED METHAMPHETAMINE)","kind":"procedure","prompts":[{"label":"Recognize and Manage","step":"13","lines":["If the person shows signs of overstimulation rather than sedation — chest pain, seizures, very high body temperature, or severe agitation — this may be methamphetamine-related rather than an opioid effect.","Keep the person calm and cool. Do not restrain them face-down. Hand off to the seizure protocol or the chest-pain protocol as symptoms dictate."],"asks":[]}]},{"roman":"IX","heading":"ARRIVAL OF EMERGENCY SERVICES","kind":"procedure","prompts":[{"label":"Handover Information","step":"14","lines":["Inform the caller to report to responders what was found or suspected, whether naloxone was given, and any changes in the person's condition."],"asks":[]},{"label":"Stay on the Line","step":"15","lines":["Encourage the caller to stay on the line and stay with the patient until emergency personnel arrive and take over."],"asks":[]}]}],"counts":{"sections":9,"prompts":16,"lines":20,"quoted_asks":0},"localize_flags":[]},{"file":"EMS_Animal-Bites.html","discipline":"EMS","title":"911 Dispatch Protocol: Animal Bites","subtitle":null,"sections":[{"roman":"I","heading":"INITIAL ASSESSMENT","prompts":[{"label":"Location & Callback — Every Call, First","lines":["“Where is your emergency? Give me the exact address — street address, nearest cross street or landmark, and the apartment, floor, or unit if you're inside a building.”","“What number are you calling from, in case we get disconnected?”"],"asks":["“Where is your emergency? Give me the exact address — street address, nearest cross street or landmark, and the apartment, floor, or unit if you're inside a building.”","“What number are you calling from, in case we get disconnected?”"]},{"label":"Age","lines":["How old is the patient?"],"asks":[]},{"label":"Consciousness","lines":["Is the patient alert and able to speak?"],"asks":[]},{"label":"Breathing","lines":["Can the patient breathe normally?"],"asks":[]},{"label":"Gender","lines":["What is the patient's gender?"],"asks":[]}],"kind":"interrogation"},{"roman":"II","heading":"PRIMARY ASSESSMENT QUESTIONS","prompts":[{"label":"Animal Identification","lines":["What kind of animal caused the bite?"],"asks":[]},{"label":"Safety Measures","lines":["Ensure that the victim and any bystanders are safe from further attacks. Is the animal still nearby? Where is it now?"],"asks":[]},{"label":"Bite Details","lines":["What part of the body was bitten?"],"asks":[]},{"label":"Immediate Concerns","lines":["If there are life-threatening symptoms (e.g., difficulty breathing, swelling), treat for shock immediately."],"asks":[]},{"label":"Bite Severity","lines":["Assess whether the bite is from a snake, spider, or insect, noting specific symptoms that indicate severe reactions."],"asks":[]}],"kind":"interrogation"},{"roman":"III","heading":"SECONDARY ASSESSMENT QUESTIONS","prompts":[{"label":"Witness Information","lines":["Did anyone witness the incident who can confirm details about the animal or the attack?"],"asks":[]}],"kind":"interrogation"},{"roman":"IV","heading":"PRE-ARRIVAL INSTRUCTIONS","prompts":[{"label":"Animal Control","lines":["If possible and safe, keep the animal away or have someone control or isolate it."],"asks":[]},{"label":"Injury Management","lines":["Keep the bitten area immobilized and below the heart level if possible."],"asks":[]},{"label":"First Aid","lines":["Wash the bite area with soap and clean water."],"asks":[]},{"label":"What Not to Do","lines":["DO NOT apply ice directly to the bite.","DO NOT use a tourniquet.","DO NOT incise or suction the wound."],"asks":[]},{"label":"Communication","lines":["Stay on the line with the caller if necessary until emergency responders arrive to ensure ongoing assessment and support."],"asks":[]},{"label":"Recognize the Call","lines":["Caller may simply say \"I got bit by a dog\" or \"my cat scratched me.\" Treat every dog, cat, or wild-animal bite or scratch — even a lick on already-broken skin — as a possible rabies exposure until a medical provider clears it."],"asks":[]},{"label":"Scale of the Problem","lines":["Human rabies deaths are rare in the US — fewer than 10 per year nationwide, per the CDC — thanks to prompt wound care and post-exposure treatment. But tens of thousands of Americans receive rabies post-exposure prophylaxis (PEP) every year, most often after exposure to bats, raccoons, skunks, foxes, or unvaccinated dogs and cats. Once rabies symptoms appear in a human, the disease is almost always fatal — which is why pre-arrival wound care and prompt medical evaluation matter more here than for most bite calls."],"asks":[]},{"label":"Immediate Wound Washing (highest-value instruction)","lines":["Instruct the caller to wash the bite or scratch immediately with soap and running water for a full 10 to 15 minutes, working the soap into the wound rather than just rinsing over it.","This single step is the most effective rabies-prevention action available before the patient reaches a facility — give it before any other first-aid instruction for this call."],"asks":[]},{"label":"Urgent Referral — Do Not Wait for Symptoms","lines":["Direct the caller to the nearest emergency department or urgent care — or to call their physician or the local health department — the same day for possible post-exposure prophylaxis (PEP), regardless of how minor the wound looks."],"asks":[]},{"label":"The Animal","lines":["If it can be done safely, advise the household to capture or confine the biting animal rather than kill it if avoidable — a healthy dog or cat observed for 10 days without signs of rabies helps rule out exposure. [LOCAL INSERT: animal control / county health department contact for reporting the bite and arranging observation]"],"asks":[]}],"kind":"interrogation"}],"counts":{"sections":4,"prompts":21,"lines":25,"quoted_asks":2},"localize_flags":["[LOCAL INSERT: animal control / county health department contact for reporting the bite and arranging observation]"],"crosslinks":[{"section":"II","prompt":"Immediate Concerns","when":"life-threatening symptoms","skills":["EMS_Treating-Shock.html"]}]},{"file":"EMS_Applying-A-Tourniquet.html","discipline":"EMS","title":"911 Dispatch Protocol: Applying A Tourniquet","subtitle":"Skill Script · Step-by-Step Procedure","sections":[{"roman":"I","heading":"INITIAL CALL RECEIPT","kind":"procedure","prompts":[{"label":"Location Confirmation","step":"1","lines":["Immediately confirm the caller's exact location — street address, nearest cross street or landmark, and the apartment, floor, or unit if inside a building — so responders are dispatched accurately and without delay."],"asks":[]},{"label":"Callback Number","lines":["Verify the number the caller is calling from, in case the call is disconnected."],"asks":[]},{"label":"Situation Assessment","step":"2","lines":["Quickly determine if the bleeding is severe enough to warrant a tourniquet, such as arterial bleeding where blood is spurting or the wound is pumping blood."],"asks":[]}]},{"roman":"II","heading":"SAFETY AND SCENE ASSESSMENT","kind":"procedure","prompts":[{"label":"Ensure Safety","step":"3","lines":["Instruct the caller to ensure their own safety and that of the victim by using gloves if available. If not, use a clean cloth or similar barrier to avoid direct contact with blood."],"asks":[]}]},{"roman":"III","heading":"TOURNIQUET APPLICATION","kind":"procedure","prompts":[{"label":"Identify the Location","step":"4","lines":["Guide the caller to apply the tourniquet 2 to 3 inches above the wound, but not on a joint (knee or elbow). If the wound is on the forearm or lower leg, it may be necessary to apply the tourniquet above the elbow or knee."],"asks":[]},{"label":"Using a Commercial Tourniquet","step":"5","lines":["Placement: Instruct the caller to loop the tourniquet around the limb and pass the tip through the buckle, tightening it.","Tighten: Tell them to twist the rod until the bleeding stops.","Secure the Rod: Advise them to secure the rod in place once the bleeding has stopped and no pulse is felt below the tourniquet."],"asks":[]},{"label":"Using an Improvised Tourniquet","step":"6","lines":["Material: If a commercial tourniquet is not available, instruct the caller to use a piece of cloth and a rigid object like a stick or rod.","Placement: Have them tie the cloth around the limb, then place the stick over the cloth.","Twisting: Instruct them to twist the stick to tighten the cloth until the bleeding stops.","Secure: Advise them to tie the ends of the cloth to keep the stick from unwinding."],"asks":[]}]},{"roman":"IV","heading":"AFTER APPLICATION","kind":"procedure","prompts":[{"label":"Mark Time","step":"7","lines":["Instruct the caller to note the time the tourniquet was applied. This is important for medical personnel to know upon their arrival."],"asks":[]},{"label":"Monitor the Victim","step":"8","lines":["Remind the caller to keep an eye on the victim for signs of shock or changes in consciousness."],"asks":[]},{"label":"Comfort and Reassure","step":"9","lines":["Encourage the caller to keep the victim calm and reassured, explaining that help is on the way."],"asks":[]}]},{"roman":"V","heading":"PREPARE FOR EMS ARRIVAL","kind":"procedure","prompts":[{"label":"Inform the Caller","step":"10","lines":["Make sure the caller knows to inform the emergency responders about the tourniquet application, including the time it was applied."],"asks":[]},{"label":"Keep the Line Open","step":"11","lines":["Advise the caller to stay on the line until help arrives and to follow any further instructions from the emergency dispatcher."],"asks":[]}]},{"roman":"VI","heading":"ARRIVAL OF EMERGENCY SERVICES","kind":"procedure","prompts":[{"label":"Handover to EMS","step":"12","lines":["Ensure that the caller knows to provide all relevant information to the emergency responders when they arrive."],"asks":[]}]}],"counts":{"sections":6,"prompts":13,"lines":18,"quoted_asks":0},"localize_flags":[]},{"file":"EMS_Back-Pain.html","discipline":"EMS","title":"911 Dispatch Protocol: Back Pain","subtitle":null,"sections":[{"roman":"I","heading":"VITAL SIGNS ASSESSMENT","prompts":[{"label":"Location & Callback — Every Call, First","lines":["“Where is your emergency? Give me the exact address — street address, nearest cross street or landmark, and the apartment, floor, or unit if you're inside a building.”","“What number are you calling from, in case we get disconnected?”"],"asks":["“Where is your emergency? Give me the exact address — street address, nearest cross street or landmark, and the apartment, floor, or unit if you're inside a building.”","“What number are you calling from, in case we get disconnected?”"]},{"label":"Age","lines":["How old is the patient?"],"asks":[]},{"label":"Consciousness","lines":["Is the patient alert and able to speak?"],"asks":[]},{"label":"Breathing","lines":["Can the patient breathe normally?"],"asks":[]},{"label":"Gender","lines":["What is the patient's gender?"],"asks":[]}],"kind":"interrogation"},{"roman":"II","heading":"PRIMARY ASSESSMENT QUESTIONS","prompts":[{"label":"Onset of Pain","lines":["How long ago did the back pain start?"],"asks":[]},{"label":"Incident Description","lines":["What exactly happened that might have led n":"II","heading":"REASSURANCE AND SUPPORT","kind":"procedure","prompts":[{"label":"Immediate Assurance","step":"3","lines":["Reassure the caller that EMS is on the way and to keep the phone on speaker mode to continue receiving instructions."],"asks":[]}]},{"roman":"III","heading":"INSTRUCTIONS FOR CPR","kind":"procedure","prompts":[{"label":"Confirm Unresponsiveness","step":"4","lines":["Instruct the caller to gently shake the victim's shoulder and shout loudly, “Are you okay?”","If there is no response, tell the caller they are doing the right thing by staying with the victim."],"asks":[]}]},{"roman":"IV","heading":"AIRWAY AND BREATHING","kind":"procedure","prompts":[{"label":"Clearing the Airway","step":"5","lines":["Instruct the caller to carefully tilt the victim's head back and lift the chin to open the airway.","Tell the caller to check for breathing: “Look at the chest, listen for breathing sounds, and feel for breath on your cheek for no more than 10 seconds.”"],"asks":[]}]},{"roman":"V","heading":"CHEST COMPRESSIONS","kind":"procedure","prompts":[{"label":"Starting Compressions","step":"6","lines":["Instruct the caller to place the heel of one hand on the center of the victim's chest, placing the other hand on top, interlocking the fingers.","Ensure elbows are straight and shoulders are directly above the hands.","Guide the caller to push hard and fast, at least 2 inches deep but not more than 2.4 inches deep, at a rate of 100 to 120 compressions per minute. Set the pace by counting aloud with the caller — \"Push with me: one-two-three-four…\" — steadily at about two pushes every second, and keep counting with them so they hold the rate."],"asks":[]}]},{"roman":"VI","heading":"RESCUE BREATHS (If trained)","kind":"procedure","prompts":[{"label":"Administering Rescue Breaths","step":"7","lines":["After 30 compressions, tell the caller to give 2 rescue breaths by pinching the nose shut, placing their mouth over the victim's, and blowing to make the chest rise.","Continue with cycles of 30 compressions and 2 breaths."],"asks":[]}]},{"roman":"VII","heading":"AED AVAILABILITY","kind":"procedure","prompts":[{"label":"Inquire About AED","step":"8","lines":["Ask the caller if there is an Automated External Defibrillator (AED) available nearby.","If yes, instruct them to send someone to retrieve it while continuing CPR, or guide them on its use if they are alone."],"asks":[]}]},{"roman":"VIII","heading":"CONTINUING CPR","kind":"procedure","prompts":[{"label":"Repeat and Rotate","step":"9","lines":["Instruct the caller to continue CPR cycles without stopping, except to recheck breathing if the victim shows signs of life or movement.","If another person is present, advise them to rotate performing CPR every 2 minutes to prevent fatigue."],"asks":[]}]},{"roman":"IX","heading":"ARRIVAL OF EMERGENCY SERVICES","kind":"procedure","prompts":[{"label":"Prepare for Handover","step":"10","lines":["Inform the caller to continue CPR until emergency responders arrive and take over."],"asks":[]},{"label":"Stay on the Line","step":"11","lines":["Encourage the caller to stay on the line until they are told they can disconnect by the emergency personnel."],"asks":[]}]}],"counts":{"sections":9,"prompts":12,"lines":19,"quoted_asks":0},"localize_flags":[]},{"file":"EMS_CPR-Child.html","discipline":"EMS","title":"911 Dispatch Protocol: CPR Child","subtitle":"Skill Script · Step-by-Step Procedure","sections":[{"roman":"I","heading":"INITIAL CALL RECEIPT","prompts":[{"label":"Location Confirmation","lines":["Immediately confirm the caller's exact location — street address, nearest cross street or landmark, and the apartment, floor, or unit if inside a building — so responders are dispatched accurately and without delay."],"asks":[]},{"label":"Callback Number","lines":["Verify the number the caller is calling from, in case the call is disconnected."],"asks":[]},{"label":"Situation Assessment","lines":["Quickly determine if the child (age 1 to puberty s arrive and take over."],"asks":[]},{"label":"Stay on the Line","lines":["Encourage the caller to stay on the line until they are told they can disconnect by emergency personnel."],"asks":[]}],"kind":"procedure"}],"counts":{"sections":9,"prompts":12,"lines":17,"quoted_asks":0},"localize_flags":[]},{"file":"EMS_Carbon-Monoxide-Inhalation.html","discipline":"EMS","title":"911 Dispatch Protocol: Carbon Monoxide Inhalation","subtitle":null,"sections":[{"roman":"I","heading":"VITAL SIGNS ASSESSMENT","prompts":[{"label":"Location & Callback — Every Call, First","lines":["\"Where is your emergency? Give me the exact address — street address, nearest cross street or landmark, and the apartment, floor, or unit if you're inside a building.\"","\"What number are you calling from, in case we get disconnected?\""],"asks":["\"Where is your emergency? Give me the exact address — street address, nearest cross street or landmark, and the apartment, floor, or unit if you're inside a building.\"","\"What number are you calling from, in case we get disconnected?\""]},{"label":"Age","lines":["How old is the patient?"],"asks":[]},{"label":"Consciousness","lines":["Is the patient alert and able to speak?"],"asks":[]},{"label":"Breathing","lines":["Can the patient breathe normally?"],"asks":[]},{"label":"Gender","lines":["What is the patient's gender?"],"asks":[]}],"kind":"interrogation"},{"roman":"II","heading":"PRIMARY ASSESSMENT QUESTIONS","prompts":[{"label":"Exposure Level","lines":["Can you confirm if the exposure to carbon monoxide is ongoing? Is the source still active (e.g., running vehicle in a garage, malfunctioning furnace)?"],"asks":[]},{"label":"Symptoms Presence","lines":["Is the patient exhibiting symptoms of carbon monoxide poisoning such as headache, dizziness, weakness, nausea, vomiting, chest pain, confusion?"],"asks":[]},{"label":"Number of People Affected","lines":["Are there others in the same location who might also be exposed? How many people are affected?"],"asks ll Wires","lines":["Stay away from all wires, especially if they are downed or exposed. Assume every wire is live and dangerous."],"asks":[]},{"label":"Power Disconnection","lines":["Instruct the caller to safely turn off the power source if possible, to prevent further risk."],"asks":[]},{"label":"Handling the Patient","lines":["Once it is safe, if the patient is not in contact with the electrical source and it's safe to touch them, check for responsiveness and breathing."],"asks":[]},{"label":"CPR if Necessary","lines":["If the patient is unresponsive and not breathing, instruct the caller on how to perform CPR if they are trained and it's safe to do so."],"asks":[]},{"label":"Treat for Shock","lines":["If the patient is conscious, cover them with a blanket to keep them warm and treat for shock while keeping them in a comfortable position."],"asks":[]},{"label":"Avoid Moving the Patient","lines":["Advise against moving the patient unnecessarily as this could worsen potential injuries, especially spinal or neck injuries, unless they are in immediate danger."],"asks":[]},{"label":"Rapid Response","lines":["Reassure the caller that help is on the way. Continue to provide support and updates until emergency services arrive."],"asks":[]}],"kind":"interrogation"}],"counts":{"sections":4,"prompts":18,"lines":19,"quoted_asks":2},"localize_flags":[],"crosslinks":[{"section":"IV","prompt":"CPR if Necessary","when":"unresponsive and not breathing","skills":["EMS_CPR-Adult.html","EMS_CPR-Child.html","EMS_CPR-Infant.html","EMS_AED-Instructions.html"]},{"section":"IV","prompt":"Treat for Shock","when":"conscious patient","skills":["EMS_Treating-Shock.html"]}]},{"file":"EMS_EpiPen-Administration.html","discipline":"EMS","title":"Epinephrine Administration (Anaphylaxis)","subtitle":"Skill Script · Step-by-Step Procedure","sections":[{"roman":"I","heading":"INITIAL CALL RECEIPT","kind":"procedure","prompts":[{"label":"Location Confirmation","lines":["Immediately confirm the caller's exact location — street address, nearest cross street or landmark, and the apartment, floor, or unit if inside a building — so responders are dispatched accurately and without delay."],"asks":[]},{"label":"Callback Number","lines":["Verify the number the caller is calling from, in case the call is disconnected."],"asks":[]},{"label":"Situation Assessment","lines":["Determine if the patient is experiencing symptoms of a severe allergic reaction, such as difficulty breathing, swelling of the face and throat, hives, severe itching, or shock."],"asks":[]}]},{"roman":"II","heading":"REASSURANCE AND SUPPORT","kind":"procedure","prompts":[{"label":"Immediate Assurance","lines":["Reassure the caller that help is on the way and instruct them to keep the phone on speaker mode to continue receiving guidance."],"asks":[]}]},{"roman":"III","heading":"CONFIRM THE MEDICATION","kind":"procedure","prompts":[{"label":"Confirm Whose Medication This Is","lines":["Ask the caller to confirm the epinephrine belongs to the patient and was prescribed to them by their doctor. This guidance applies only to the patient's own prescribed epinephrine — unknown or unlabeled medication should never be administered."],"asks":[]},{"label":"Identify the Form","lines":["Ask what form the epinephrine is in. Most patients in the community carry a prescribed auto-injector, such as an EpiPen or similar device. Some may instead have an epinephrine ampoule (1 mg/mL) together with a syringe. Confirm which one the caller has before continuing."],"asks":[]}]},{"roman":"IV","heading":"IF THE PATIENT HAS AN AUTO-INJECTOR (PRIMARY METHOD)","kind":"procedure","prompts":[{"label":"Remove the Safety Cap","lines":["If the patient has an auto-injector, such as an EpiPen or similar device, guide the caller to remove the blue safety cap at the top of the device. Tell them not to touch the orange tip, as this is where the needle comes out."],"asks":[]},{"label":"Position and Inject","lines":["Instruct the caller to hold the auto-injector with their fist around the unit so the orange tip points downward, expose the outer thigh, and press the orange tip firmly against the outer thigh until they hear a click, indicating the needle has deployed."],"asks":[]}]},{"roman":"V","heading":"IF THE PATIENT HAS AN AUTO-INJECTOR (PRIMARY METHOD) — CONTINUED","kind":"procedure","prompts":[{"label":"Hold, Remove, and Massage","lines":["Advise the caller to hold the auto-injector in place for 3 seconds, then remove it and gently massage the injection site for several seconds."],"asks":[]},{"label":"Note the Time","lines":["Tell the caller to note the time the injection was given. This will be needed for deciding on a second dose and for the responding EMS crew."],"asks":[]},{"label":"Second Dose If No Improvement","lines":["If there is no improvement within 5 to 15 minutes and EMS has not yet arrived, and a second prescribed auto-injector is available, the caller may give a second dose following the same steps and the patient's own prescription."],"asks":[]}]},{"roman":"VI","heading":"IF THE PATIENT HAS AN AMPOULE + SYRINGE (SECONDARY METHOD)","kind":"procedure","prompts":[{"label":"Draw Up the Prescribed Dose","lines":["If the patient's medication is instead an ampoule and syringe rather than an auto-injector, guide the caller to draw up the dose their doctor prescribed from the 1 mg/mL ampoule into the syringe. Adults are typically prescribed 0.3 to 0.5 mg; children are prescribed a smaller dose based on their weight, per their own prescription.","Do not calculate or suggest a dose. Instruct the caller to give only the dose written on the patient's own prescription or medication plan."],"asks":[]},{"label":"Prepare the Injection Site and Inject","lines":["Once the correct dose is drawn up, have the caller expose the patient's outer mid-thigh, moving clothing aside, or injecting through light clothing if there is no time to undress the area. Direct the caller to inject into the outer mid-thigh muscle, holding the needle steady until the full prescribed dose has been delivered."],"asks":[]}]},{"roman":"VII","heading":"POST-INJECTION MONITORING","kind":"procedure","prompts":[{"label":"Observation, Positioning, and Airway","lines":["Instruct the caller to observe the patient closely for improvement or worsening of symptoms. Keep the patient lying down, elevate the legs if possible, and keep them covered if they feel cold. If breathing becomes difficult while lying flat, let them sit up slightly to ease breathing.","Continue to monitor breathing and responsiveness. If the patient stops breathing normally or becomes unresponsive, be ready to begin rescue breathing or hand off to the CPR protocol."],"asks":[]},{"label":"Keep the Medication for Responders","lines":["Advise the caller to keep the used auto-injector, or ampoule and syringe, and hand it to the emergency responders on arrival, for documentation and to confirm what was given."],"asks":[]}]},{"roman":"VIII","heading":"ARRIVAL OF EMERGENCY SERVICES","kind":"procedure","prompts":[{"label":"Handover and Stay on the Line","lines":["Inform the caller to report to responders what was given — auto-injector, or ampoule and syringe — the dose, the time it was given, and any changes in the patient's condition.","Encourage the caller to stay on the line until emergency services take over."],"asks":[]}]}],"counts":{"sections":8,"prompts":16,"lines":19,"quoted_asks":0},"localize_flags":[]},{"file":"EMS_Eye-Problems-Injuries.html","discipline":"EMS","title":"911 Dispatch Protocol: Eye Problems/Injuries","subtitle":null,"sections":[{"roman":"I","heading":"VITAL SIGNS ASSESSMENT","prompts":[{"label":"Location & Callback — Every Call, First","lines":["“Where is your emergency? Give me the exact address — street address, nearest cross street or landmark, and the apartment, floor, or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"],"asks":["“Where is your emergency? h Protocol: Falls/Back Injury","subtitle":null,"sections":[{"roman":"I","heading":"VITAL SIGNS ASSESSMENT","prompts":[{"label":"Location & Callback — Every Call, First","lines":["“Where is your emergency? Give me the exact address — street address, nearest cross street or landmark, and the apartment, floor, or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"],"asks":["“Where is your emergency? Give me the exact address — street address, nearest cross street or landmark, and the apartment, floor, or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"]},{"label":"Age","lines":["How old is the patient?"],"asks":[]},{"label":"Consciousness","lines":["Is the patient alert and able to speak?"],"asks":[]},{"label":"Breathing","lines":["Can the patient breathe normally?"],"asks":[]},{"label":"Gender","lines":["What is the patient's gender?"],"asks":[]}],"kind":"interrogation"},{"roman":"II","heading":"PRIMARY ASSESSMENT QUESTIONS","prompts":[{"label":"Incident Details","lines":["What caused the fall or back injury? Where did this occur?"],"asks":[]},{"label":"Symptoms and Location of Pain","lines":["Where is the pain located? Is there inability to move any limbs?"],"asks":[]},{"label":"Severity of Injury","lines":["Can the patient move without severe pain? Is there numbness or tingling in any extremities?"],"asks":[]}],"kind":"interrogation"},{"roman":"III","heading":"PRE-ARRIVAL INSTRUCTIONS","prompts":[{"label":"Immobilization","lines":["Advise the caller to keep the patient still and not to move them unless absolutely necessary for safety."],"asks":[]},{"label":"Comfort","lines":["Help the patient find a comfortable position if movement does not increase pain."],"asks":[]},{"label":"Monitoring","lines":["Monitor the patient for changes in pain level and consciousness."],"asks":[]}],"kind":"interrogation"}],"counts":{"sections":3,"prompts":11,"lines":12,"quoted_asks":2},"localize_flags":[]},{"file":"EMS_Fireworks-Mass-Injury.html","discipline":"EMS","title":"911 Dispatch Protocol: Fireworks / Firecracker Injury","subtitle":null,"sections":[{"roman":"I","heading":"Vital / Scene Information","prompts":[{"label":"Location & Callback — Every Call, First","lines":["“Where is your emergency? Give me the exact address — street address, nearest cross street or landmark, and the apartment, floor, or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"],"asks":["“Where is your emergency? Give me the exact address — street address, nearest cross street or landmark, and the apartment, floor, or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"]},{"label":"Mass-Injury Check","lines":["Is this happening during the Independence Day or New Year's surge period (late June through early July, or New Year's Eve/Day)? Is the patient the only person injured, or are there others hurt nearby — fireworks incidents at gatherings often produce multiple patients from a single event."],"asks":[]},{"label":"Age","lines":["How old is the patient? Note: roughly half of fireworks-injury patients nationwide each season are minors."],"asks":[]},{"label":"Consciousness","lines":["Is the patient alert and responsive?"],"asks":[]},{"label":"Location","lines":["Confirm the exact location — neighborhood/subdivision, street, or landmark."],"asks":[]}],"kind":"interrogation"},{"roman":"II","heading":"Primary (Key) Questions","prompts":[{"label":"Injury Type and Location","lines":["Where is the injury — hand or fingers, eyes, face, or torso? Blast injuries to the hand and fingers, including possible amputation, and eye injuries are the most common serious presentations."],"asks":[]},{"label":"What Caused the Injury","lines":["What kind of firework or firecracker was it, if known? Ask specifically — illegal or homemade devices, such as mortars, altered aerial shells, or M-80-class explosives, cause far worse wounds than ordinary consumer fireworks, and this affects severity expectations."],"asks":[]},{"label":"Bleeding or Amputation","lines":["Is there heavy bleeding? Has any part of the hand, fingers, or other body part been severed?"],"asks":[]},{"label":"Eye Involvement","lines":["Is either eye affected? Is there pain, vision loss, or a foreign-body sensation?"],"asks":[]}],"kind":"interrogation"},{"roman":"III","heading":"Secondary Questions","prompts":[{"label":"Additional Victims","lines":["Is anyone else at the location injured from the same incident? Ask this even if only one patient has been mentioned."],"asks":[]},{"label":"Burn Extent","lines":["If there are burns, approximately how large an area of the body is affected?"],"asks":[]},{"label":"Tetanus / Wound History","lines":["Note the wound is a puncture/blast-type injury with tetanus risk — flag for the responding team; a vaccination-history question is not a call-taking priority but is useful if the caller volunteers it."],"asks":[]}],"kind":"interrogation"},{"roman":"IV","heading":"Pre-Arrival Instructions","prompts":[{"label":"Bleeding Control","lines":["Apply firm, direct pressure to the wound with a clean cloth. Elevate the injured hand or limb above heart level if possible."],"asks":[]},{"label":"Amputated Parts","lines":["If any part of the hand or fingers has been severed, retrieve it if it is safe to do so. Wrap it in a clean, slightly damp cloth, place it in a sealed bag, and keep it cool — do not place it directly on ice. Bring it with the patient to the hospital."],"asks":[]},{"label":"Eye Injury","lines":["Do not rub the eye or attempt to rinse out embedded debris. Do not remove any object from the eye. Loosely shield both eyes (not just the injured one) to limit movement, and keep the patient still."],"asks":[]},{"label":"Burn Care","lines":["Cool the burn with clean running water if available — do not apply ice directly to the wound. Cover loosely with a clean cloth. Do not apply ointments, toothpaste, or other home remedies to the burn."],"asks":[]},{"label":"General Monitoring","lines":["Keep the patient calm and still, and continue to monitor breathing and alertness until responders arrive."],"asks":[]}],"kind":"interrogation"}],"counts":{"sections":4,"prompts":17,"lines":18,"quoted_asks":2},"localize_flags":[],"crosslinks":[{"section":"II","prompt":"Bleeding or Amputation","when":"heavy bleeding / amputation","skills":["EMS_Applying-A-Tourniquet.html"]}]},{"file":"EMS_General-Medical-Problem.html","discipline":"EMS","title":"911 Dispatch Protocol: General Medical Problem","subtitle":null,"sections":[{"roman":"I","heading":"INITIAL CALL RECEIPT","prompts":[{"label":"Location & Callback — Every Call, First","lines":["“Where is your emergency? Give me the exact address — street address, nearest cross street or landmark, and the apartment, floor, or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"],"asks":["“Where is your emergency? Give me the exact address — street address, nearest cross street or landmark, and the apartment, floor, or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"]},{"label":"Location Confirmation","lines":["Immediately confirm the caller's exact location — street address, nearest cross street or landmark, and the apartment, floor, or unit if inside a building — so responders are dispatched accurately and without delay."],"asks":[]}],"kind":"interrogation"},{"roman":"II","heading":"INITIAL ASSESSMENT","prompts":[{"label":"Safety Check","lines":["Ensure that the caller and the patient are in a safe environment. Ask, \"Are you and the patient in a safe place right now?\""],"asks":[]}],"kind":"interrogation"},{"roman":"III","heading":"PATIENT ASSESSMENT","prompts":[{"label":"Identify the Problem","lines":["Begin by identifying the nature of the medical problem.","Ask the caller, \"Can you tell me exactly what happened?\""],"asks":[]},{"label":"Vital Signs Check","lines":["Consciousness: \"Is the patient awake and able to talk to you?\"","Breathing: \"Is the patient breathing normally?\""],"asks":[]}],"kind":"interrogation"},{"roman":"IV","heading":"HISTORY GATHERING","prompts":[{"label":"Medical History","lines":["Ask about the patient's medical history, which might be relevant to the current situation.","\"Does the patient have any known medical conditions?\"","\"Is the patient currently on any medications?\""],"asks":["\"Does the patient have any known medical conditions?\"","\"Is the patient currently on any medications?\""]}],"kind":"interrogation"},{"roman":"V","heading":"SPECIFIC SYMPTOMS INQUIRY","prompts":[{"label":"Further Details","lines":["Depending on the symptoms presented, ask more specific questions to clarify the condition.","For pain: \"Can you describe the pain? Where is it located? How severe is it on a scale of 1 to 10?\"","For breathing difficulties: \"Is the patient experiencing shortness of breath or chest tightness?\""],"asks":[]}],"kind":"interrogation"},{"roman":"VIII","heading":"MONITORING","prompts":[{"label":"Continuous Monitoring","lines":["Ask the caller to keep an eye on the patient's condition and report any changes or deterioration."],"asks":[]}],"kind":"interrogation"},{"roman":"VI","heading":"INSTRUCTIONS BASED ON ASSESSMENT","prompts":[{"label":"Provide Specific Care Instructions","lines":["Depending on the symptoms and potential conditions identified:","If the patient is in pain: \"Try to keep the patient comfortable and avoid moving them unnecessarily.\"","If breathing is difficult: \"Ensure the patient is in a position that makes breathing easier, like sitting up.\""],"asks":[]}],"kind":"interrogation"},{"roman":"VII","heading":"PREPARE FOR EMS ARRIVAL","prompts":[{"label":"Information for EMS","lines":["Instruct the caller to have any medical records or medications ready to show to EMS."],"asks":[]},{"label":"C ng":"NATURE OF THE INCIDENT","prompts":[{"label":"Gather Detailed Information","lines":["\"Can you describe what you have observed or encountered related to child exploitation or pornography?\""],"asks":["\"Can you describe what you have observed or encountered related to child exploitation or pornography?\""]}],"kind":"interrogation"},{"roman":"IV","heading":"DETAILS OF INVOLVEMENT","prompts":[{"label":"Identify Suspect Information (if known)","lines":["\"Do you know who is responsible for creating or distributing this material?\""],"asks":["\"Do you know who is responsible for creating or distributing this material?\""]},{"label":"Victim Information","lines":["\"Do you know the child or children involved?\""],"asks":["\"Do you know the child or children involved?\""]}],"kind":"interrogation"},{"roman":"V","heading":"MATERIAL EVIDENCE","prompts":[{"label":"Preservation of Evidence","lines":["\"Where is the material located right now? Is it on a physical device or online?\""],"asks":["\"Where is the material located right now? Is it on a physical device or online?\""]}],"kind":"interrogation"},{"roman":"VII","heading":"REPORT HANDLING","prompts":[{"label":"Specialized Unit Involvement","lines":["\"I am also notifying our specialized unit that handles crimes against children. They are trained to deal with these situations sensitively and thoroughly.\""],"asks":["\"I am also notifying our specialized unit that handles crimes against children. They are trained to deal with these situations sensitively and thoroughly.\""]}],"kind":"interrogation"},{"roman":"VI","heading":"URGENT POLICE DISPATCH","prompts":[{"label":"Immediate Police Response","lines":["\"I am dispatching officers to your location to handle this matter discreetly and professionally. They will arrive as soon as possible.\""],"asks":["\"I am dispatching officers to your location to handle this matter discreetly and professionally. They will arrive as soon as possible.\""]}],"kind":"interrogation"},{"roman" roviding Support Resources","lines":["\"Would you like links or phone numbers for consumer protection agencies that can provide further assistance and guidance?\""],"asks":["\"Would you like links or phone numbers for consumer protection agencies that can provide further assistance and guidance?\""]}],"kind":"interrogation"},{"roman":"IX","heading":"EMOTIONAL SUPPORT","prompts":[{"label":"Support for Emotional Impact","lines":["\"Dealing with identity theft can be very stressful; if needed, I can provide you with contact information for counseling services.\""],"asks":["\"Dealing with identity theft can be very stressful; if needed, I can provide you with contact information for counseling services.\""]}],"kind":"interrogation"},{"roman":"IV","heading":"GUIDANCE ON IMMEDIATE ACTIONS","prompts":[{"label":"Advice on Immediate Steps","lines":["\"I recommend that you immediately contact your bank and credit card issuers to inform them of the situation and to secure your accounts.\"","\"It's also important to preserve evidence — screenshots, transaction reference numbers, and any messages from the scammer — and report the fraud immediately to your bank or card issuer so the account can be frozen; if it isn't resolved, you can escalate to the Consumer Financial Protection Bureau (CFPB) [LOCAL INSERT: CFPB complaint portal/phone number, or your state Attorney General's consumer protection office].\""],"asks":["\"I recommend that you immediately contact your bank and credit card issuers to inform them of the situation and to secure your accounts.\"","\"It's also important to preserve evidence — screenshots, transaction reference numbers, and any messages from the scammer — and report the fraud immediately to your bank or card issuer so the account can be frozen; if it isn't resolved, you can escalate to the Consumer Financial Protection Bureau (CFPB) [LOCAL INSERT: CFPB complaint portal/phone number, or your state Attorney General's consumer protection office].\""]}],"kind" ":"interrogation"},{"roman":"VIII","heading":"COMMUNICATION INSTRUCTIONS","prompts":[{"label":"Maintaining Open Lines","lines":["\"Please keep your phone line open and available for further communication. Officers may need to contact you for additional information or updates.\""],"asks":["\"Please keep your phone line open and available for further communication. Officers may need to contact you for additional information or updates.\""]}],"kind":"interrogation"},{"roman":"X","heading":"SUPPORT AND FOLLOW-UP","prompts":[{"label":"Post-Incident Support","lines":["\"After providing initial information to the police, there will be follow-up by detectives who specialize in kidnapping cases. They will keep you informed of any developments.\""],"asks":["\"After providing initial information to the police, there will be follow-up by detectives who specialize in kidnapping cases. They will keep you informed of any developments.\""]}],"kind":"interrogation"},{"roman":"XI","heading":"DOCUMENTATION AND REPORTING","prompts":[{"label":"Detailed Incident Logging","lines":["\"All details of this call and the responses initiated will be meticulously documented for ongoing investigation and coordination efforts.\""],"asks":["\"All details of this call and the responses initiated will be meticulously documented for ongoing investigation and coordination efforts.\""]},{"label":"Recognize the Call","lines":["Caller may report \"he/she was taken\" or \"snatched\" or that a ransom call has already been received. Treat any kidnap-for-ransom report as an immediate matter for specialized kidnapping investigators — [LOCAL INSERT: FBI field office or state/regional violent-crimes task force] — in addition to the responding patrol unit."],"asks":[]},{"label":"If a Ransom Call Has Already Come In","lines":["\"Has anyone contacted the family asking for money or demanding anything in exchange for their release?\"","Instruct the family: do NOT promise or confirm any payment amount over the phone a eing right now, not a static crime scene. Treat this as a live, moving threat from the first sentence."],"asks":[]}],"kind":"interrogation"},{"roman":"II","heading":"MOTORCYCLE DESCRIPTION","prompts":[{"label":"Suspect Vehicle","lines":["\"What color and type of motorcycle was it? Did you catch a make or model?\"","\"Could you see a plate number?\" — Expect no plate, a covered/muddied plate, or a partial plate; this is normal for this crime type and does not mean the caller is unreliable."],"asks":["\"What color and type of motorcycle was it? Did you catch a make or model?\"","\"Could you see a plate number?\" — Expect no plate, a covered/muddied plate, or a partial plate; this is normal for this crime type and does not mean the caller is unreliable."]}],"kind":"interrogation"},{"roman":"III","heading":"SUSPECT DESCRIPTION","prompts":[{"label":"Riders","lines":["\"What were the riders wearing? Were they wearing helmets — full-face or open-face?\" (Full-face helmets are common and deliberately conceal identity.)","\"Which rider fired the weapon — the driver or the back rider?\" (Back rider is the typical shooter.)"],"asks":["\"What were the riders wearing? Were they wearing helmets — full-face or open-face?\" (Full-face helmets are common and deliberately conceal identity.)","\"Which rider fired the weapon — the driver or the back rider?\" (Back rider is the typical shooter.)"]}],"kind":"interrogation"},{"roman":"IV","heading":"DIRECTION OF TRAVEL","prompts":[{"label":"Flight Path","lines":["\"Which direction did they go? What street or intersection were they last seen at?\"","\"How fast were they moving, and did they turn anywhere?\""],"asks":["\"Which direction did they go? What street or intersection were they last seen at?\"","\"How fast were they moving, and did they turn anywhere?\""]}],"kind":"interrogation"},{"roman":"V","heading":"WEAPON","prompts":[{"label":"Weapon Used","lines":["\"What kind of weapon did you see — a handgun, a long firearm?\""],"asks":["\ uld be there?"],"asks":[]},{"label":"Medical Factors","lines":["Any medical conditions, medications they depend on, mobility problems, or memory/confusion issues?"],"asks":[]},{"label":"Access","lines":["Is there a keyholder, building manager, or neighbor with access? Alarm or pets officers should know about?"],"asks":[]},{"label":"Officer Safety","lines":["Any weapons in the home, or history officers should know before knocking?"],"asks":[]}],"kind":"interrogation"},{"roman":"IV","heading":"DISPATCH & CALLER INSTRUCTIONS","prompts":[{"label":"Priority","lines":["Elevate priority when risk factors stack: medical dependence, elderly living alone, alarming statements, extreme weather, or visible signs something is wrong."],"asks":[]},{"label":"If the Caller Is On Scene","lines":["If you can see the person down or unresponsive through a window or door, tell me now — we will treat this as a medical emergency and I will guide you. Otherwise, please wait for officers rather than entering alone."],"asks":[]},{"label":"Callback Arrangement","lines":["Give the caller the outcome expectation per agency policy, and confirm how officers or the agency will follow up with them [LOCAL INSERT: agency welfare-check follow-up practice]."],"asks":[]},{"label":"Documentation","lines":["Log the stated concern, last-contact time, access information, and risk factors — the responding officer's approach is built from this record."],"asks":[]}],"kind":"interrogation"}],"localize_flags":["agency welfare-check follow-up practice"],"crosslinks":[{"section":"IV","prompt":"If the Caller Is On Scene","when":"person visibly down / unresponsive","skills":["EMS_Monitoring-ABCs.html"]}],"counts":{"sections":4,"prompts":13,"lines":14,"quoted_asks":2}}]},"ph":{"cards":[{"file":"DISASTER_Crowd-Crush.html","discipline":"DISASTER","title":"911 Dispatch Protocol: Mass Gathering / Crowd Crush","subtitle":null,"sections":[{"roman":"I","heading":"INITIAL CALL RECEIPT","prompts":[{"label":"Location & Callback \"How many people appear to be down or trapped underfoot, as best you can tell?\"","\"Look at the person nearest to you who is down — are they breathing? Are they conscious?\""],"asks":["\"How many people appear to be down or trapped underfoot, as best you can tell?\"","\"Look at the person nearest to you who is down — are they breathing? Are they conscious?\""]}],"kind":"interrogation"},{"roman":"V","heading":"ACCESS ASSESSMENT","prompts":[{"label":"Responder Access","lines":["\"Can an ambulance or fire truck actually drive to where you are, or is the street completely packed with people?\""],"asks":["\"Can an ambulance or fire truck actually drive to where you are, or is the street completely packed with people?\""]}],"kind":"interrogation"},{"roman":"VI","heading":"RESOURCE COORDINATION","prompts":[{"label":"Mass-Casualty Activation","lines":["A confirmed crowd crush at a large event activates mass-casualty triage staffing and multiple EMS units rather than a single ambulance response."],"asks":[]},{"label":"PNP Crowd Corridor","lines":["Because vehicles cannot enter a dense crowd, request PNP to open and hold a crowd corridor from the nearest accessible street to the casualty point, and direct EMS/BFP to stage at that access point rather than attempting to drive in."],"asks":[]},{"label":"Event Organizer & Barangay Liaison","lines":["Coordinate with event organizers, church/parish marshals, or the barangay for crowd-control announcements and to identify the nearest first-aid or medical tent already on site."],"asks":[]},{"label":"Multiple-Caller Triangulation","lines":["Expect many simultaneous callers describing the same crush from different vantage points — do not dismiss repeat calls as duplicates. Cross-reference each caller's described landmark (stage, church door, specific street corner) to pinpoint the exact crush location within the larger crowd for responders."],"asks":[]}],"kind":"interrogation"},{"roman":"VII","heading":"SELF-PROTECTION IF STILL IN THE CROWD","prompts":[{"label":"Boxer Position & Movement","lines":["\"Bring your arms up in front of your chest, like a boxer guarding — this protects your chest and airway from the pressure around you and keeps a small pocket of space to breathe.\"","\"Do not push straight against the crowd. Move diagonally, angling across the flow of the crowd toward the nearest edge or open space, rather than fighting directly against it.\""],"asks":["\"Bring your arms up in front of your chest, like a boxer guarding — this protects your chest and airway from the pressure around you and keeps a small pocket of space to breathe.\"","\"Do not push straight against the crowd. Move diagonally, angling across the flow of the crowd toward the nearest edge or open space, rather than fighting directly against it.\""]}],"kind":"interrogation"},{"roman":"VIII","heading":"HELPING OTHERS SAFELY","prompts":[{"label":"Assisting Without Losing Footing","lines":["\"If someone near you has fallen and you can help them up without losing your own footing or being pulled down, do so. But if helping them would put you at risk of falling too, keep moving toward the edge yourself and alert anyone you pass on the way out.\""],"asks":["\"If someone near you has fallen and you can help them up without losing your own footing or being pulled down, do so. But if helping them would put you at risk of falling too, keep moving toward the edge yourself and alert anyone you pass on the way out.\""]}],"kind":"interrogation"},{"roman":"IX","heading":"AFTER REACHING SAFETY","prompts":[{"label":"Once Clear of the Crush","lines":["\"Once you are out, move well away from the crowd's edge — do not stop right next to it, and do not go back in to look for anyone.\""],"asks":["\"Once you are out, move well away from the crowd's edge — do not stop right next to it, and do not go back in to look for anyone.\""]}],"kind":"interrogation"}],"counts":{"sections":9,"prompts":13,"lines":18,"quoted_asks":14},"localize_flags":["[LOCALIZE: example]"],"crosslinks":[{"section":"IV","prompt":"Immediate Triage Questions","when":"person down","skills":["EMS_CPR-Adult.html","EMS_CPR-Child.html","EMS_CPR-Infant.html","EMS_Monitoring-ABCs.html"]}]},{"file":"DISASTER_Earthquake.html","discipline":"DISASTER","title":"911 Dispatch Protocol: Earthquake / Mass Structural Collapse","subtitle":null,"sections":[{"roman":"I","heading":"INITIAL CALL RECEIPT","prompts":[{"label":"Location & Callback — Every Call, First","lines":["“Where is your emergency? Give me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"],"asks":["“Where is your emergency? Give me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"]},{"label":"Location Confirmation","lines":["Get barangay, purok/sitio, and nearest landmark immediately — GPS pin-drop if the caller's app supports it. Confirm this is a fresh report: \"Ngayon lang ba ito, o kanina pa?\" (\"Did this just happen, or has it been a while?\")"],"asks":[]},{"label":"Caller's Own Safety","lines":["\"Are you safe right now? Is the ground still shaking?\""],"asks":["\"Are you safe right now? Is the ground still shaking?\""]}],"kind":"interrogation"},{"roman":"II","heading":"SELF-PROTECTION WHILE SHAKING CONTINUES","prompts":[{"label":"Drop, Cover, Hold","lines":["\"If the ground is still moving, drop to the floor now, get under a sturdy table or desk, and hold on until the shaking stops. Stay away from windows, glass, and heavy furniture that can fall.\"","\"If you are outdoors, move away from buildings, walls, posts, and trees — go to open ground if you can do so safely.\""],"asks":["\"If the ground is still moving, drop to the floor now, get under a sturdy table or desk, and hold on until the shaking stops. Stay away from windows, glass, and heavy furniture that can fall.\"","\"If you are outdoors, move away from buildings, walls, posts, and trees — go to open ground if you can do so safely.\""]}],"kind":"interrogation"},{"roman":"III","heading":"ASSESSMENT OF DAMAGE","prompts":[{"label":"Nature of the Collapse","lines":["\"What kind of structure is this — a house, an apartment building, a school, a mall, an informal settlement?\"","\"Did the whole structure collapse, or just part of it — a wall, a ceiling, a floor?\""],"asks":["\"What kind of structure is this — a house, an apartment building, a school, a mall, an informal settlement?\"","\"Did the whole structure collapse, or just part of it — a wall, a ceiling, a floor?\""]}],"kind":"interrogation"},{"roman":"IV","heading":"TRAPPED / NAIPIT VICTIM DETAILS","prompts":[{"label":"Recognizing \"Naipit\"","lines":["Callers will often use \"naipit\" (trapped/pinned) rather than describing a collapse directly. Treat \"may naipit\" as an active entrapment call requiring the same urgency as \"trapped.\""],"asks":[]},{"label":"Locating the Victim","lines":["\"Where in the building is the person trapped — which floor, which room, near which wall?\"","\"Can the trapped person tap on a pipe or wall, or shout to make contact? Ask them to tap three times, then listen.\""],"asks":["\"Where in the building is the person trapped — which floor, which room, near which wall?\"","\"Can the trapped person tap on a pipe or wall, or shout to make contact? Ask them to tap three times, then listen.\""]}],"kind":"interrogation"},{"roman":"V","heading":"CASUALTIES & MEDICAL STATUS","prompts":[{"label":"Injury Check","lines":["\"How many people are injured? Is anyone bleeding heavily (duguan) or not breathing (hindi humihinga)?\""],"asks":["\"How many people are injured? Is anyone bleeding heavily (duguan) or not breathing (hindi humihinga)?\""]}],"kind":"interrogation"},{"roman":"VI","heading":"SECONDARY HAZARDS","prompts":[{"label":"Fire, Gas, and Aftershocks","lines":["\"Do you smell gas, or see any smoke or fire starting near the collapse?\"","\"Are there broken water pipes or downed electrical lines nearby?\""],"asks":["\"Do you smell gas, or see any smoke or fire starting near the collapse?\"","\"Are there broken water pipes or downed electrical lines nearby?\""]},{"label":"Coastal Proximity Check","lines":["If the caller's barangay is coastal and the quake was strong or long, ask: \"Are you near the shoreline? A strong earthquake felt near the coast is itself the tsunami warning — do not wait for an official alert before moving to higher ground.\" (See Tsunami Warning protocol.)"],"asks":[]}],"kind":"interrogation"},{"roman":"VII","heading":"MASS-EVENT PRIORITIZATION","prompts":[{"label":"Metro Manila / \"Big One\" Mode","lines":["A major quake on the West Valley Fault is expected to generate many hundreds of simultaneous calls across Metro Manila, with entrapments and fires reported at once. When call volume exceeds available units, dispatchers shift to triage-based prioritization: confirmed entrapments and active fires outrank damage-only reports; group calls reporting the same address or barangay to avoid duplicate dispatch; log every call even when a unit cannot be sent immediately."],"asks":[]},{"label":"Intensity Reference","lines":["Ask the caller to describe what happened during the shaking (furniture toppled, unable to stand, structures visibly damaged) — this maps to the PHIVOLCS Earthquake Intensity Scale (PEIS) and helps responders prioritize which barangays likely have the worst damage before ground reports come in."],"asks":[]},{"label":"Coordination","lines":["Confirmed collapses and entrapments are relayed to BFP urban search-and-rescue and PNP, with the barangay hall and LGU DRRMO notified for local staging, evacuation center activation, and NDRRMC situational reporting."],"asks":[]}],"kind":"interrogation"},{"roman":"VIII","heading":"INSTRUCTIONS WHILE WAITING FOR RESCUE","prompts":[{"label":"If Free to Move","lines":["\"Move to open ground away from buildings, walls, and power lines. Expect aftershocks — do not re-enter any damaged structure, and do not use elevators.\""],"asks":["\"Move to open ground away from buildings, walls, and power lines. Expect aftershocks — do not re-enter any damaged structure, and do not use elevators.\""]},{"label":"If Trapped","lines":["\"Stay as still and calm as possible to conserve air and energy. Tap on a pipe or wall in a steady pattern rather than shouting continuously — shouting uses up air and energy faster.\""],"asks":["\"Stay as still and calm as possible to conserve air and energy. Tap on a pipe or wall in a steady pattern rather than shouting continuously — shouting uses up air and energy faster.\""]}],"kind":"interrogation"},{"roman":"IX","heading":"IF NEAR THE COAST","prompts":[{"label":"Tsunami Awareness","lines":["\"If you are near the shoreline and just felt a strong or long earthquake, do not wait for an official tsunami warning — move to higher ground or at least several hundred meters inland now. The earthquake itself is the warning.\""],"asks":["\"If you are near the shoreline and just felt a strong or long earthquake, do not wait for an official tsunami warning — move to higher ground or at least several hundred meters inland now. The earthquake itself is the warning.\""]}],"kind":"interrogation"},{"roman":"X","heading":"FOLLOW-UP ACTIONS","prompts":[{"label":"Staying Reachable","lines":["\"Keep this number reachable if you can. If units are delayed because of the scale of this event, that does not mean you were forgotten — responders are working through confirmed entrapments and fires first.\""],"asks":["\"Keep this number reachable if you can. If units are delayed because of the scale of this event, that does not mean you were forgotten — responders are working through confirmed entrapments and fires first.\""]}],"kind":"interrogation"}],"counts":{"sections":10,"prompts":17,"lines":22,"quoted_asks":16},"localize_flags":["[LOCALIZE: example]"],"crosslinks":[{"section":"V","prompt":"Injury Check","when":"heavy bleeding / not breathing","skills":["EMS_Applying-A-Tourniquet.html","EMS_CPR-Adult.html","EMS_CPR-Child.html","EMS_CPR-Infant.html"]}]},{"file":"DISASTER_Flood.html","discipline":"DISASTER","title":"911 Dispatch Protocol: Flood / Flash Flood","subtitle":null,"sections":[{"roman":"I","heading":"INITIAL CALL RECEIPT","prompts":[{"label":"Location & Callback — Every Call, First","lines":["“Where is your emergency? Give me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"],"asks":["“Where is your emergency? Give me the exact location — barangay, street or landmark, and the floor or unit if you’re inside a building.”","“What number are you calling from, in case we get disconnected?”"]},{"label":"Recognition Phrases","lines":["Recognize \"May baha!\" (there's a flood) or \"Bumabaha!\" (it's flooding right now) as the caller's opening line — treat both as an active, in-progress flood event."],"asks":[]},{"label":"Location Confirmation","lines":["Get barangay, then purok/sitio, then the nearest fixed landmark (a sari-sari store, church, plaza, bridge, or \"kabilang ilog\" / across the river). Streets and yards look identical once flooded, so a landmark is often the only way to pinpoint the caller — do not rely on a street address alone."],"asks":[]}],"kind":"interrogation"},{"roman":"II","heading":"FLOOD ASSESSMENT","prompts":[{"label":"Depth","lines":["\"How deep is the water where you are right now — ankle-deep, knee-deep, waist-deep, or higher than that?\""],"asks":["\"How deep is the water where you are right now — ankle-deep, knee-deep, waist-deep, or higher than that?\""]},{"label":"Trend & Current","lines":["\"Is the water still rising, or has it stayed the same or started to go down?\""],"asks":["\"Is the water still rising, or has it stayed the same or started to go down?\""]}],"kind":"interrogation"},{"roman":"III","heading":"PERSONS AT RISK","prompts":[{"label":"Trapped Status","lines":["\"Are you trapped inside the house, or have you moved to the roof?\""],"asks":["\"Are you trapped inside the house, or have you moved to the roof?\""]},{"label":"Vehicle Involvement","lines":["\"Is anyone stuck inside a vehicle in the floodwater?\""],"asks":["\"Is anyone stuck inside a vehicle in the floodwater?\""]}],"kind":"interrogation"},{"roman":"IV","heading":"SAFETY ASSESSMENT — ELECTROCUTION HAZARD","prompts":[{"label":"Downed Lines / Energized Structure","lines":["\"Are there any downed or hanging electrical lines near the water?\""],"asks":["\"Are there any downed or hanging electrical lines near the water?\""]},{"label":"Immediate Warning","lines":["Treat any home with water touching outlets or wiring as electrically live until the utility confirms otherwise — do not let the caller touch metal fixtures, switches, or the breaker if hands or feet are wet."],"asks":[]}],"kind":"interrogation"},{"roman":"V","heading":"TRANSPORT / MOBILITY STATUS","prompts":[{"label":"Bystander Rescue Already Underway","lines":["\"Is a neighbor or family member already trying to move you by boat (bangka) or on foot?\" — bayanihan means the community often acts before responders arrive; find out whether the caller is already being moved so dispatch can plan an intercept rather than a standard pickup."],"asks":["\"Is a neighbor or family member already trying to move you by boat (bangka) or on foot?\" — bayanihan means the community often acts before responders arrive; find out whether the caller is already being moved so dispatch can plan an intercept rather than a standard pickup."]}],"kind":"interrogation"},{"roman":"VI","heading":"DISPATCH COORDINATION","prompts":[{"label":"Boat Rescue Staging","lines":["Coordinate with the barangay hall/DRRMO for bangka (boat) rescue staging where roads are impassable — this is the standard flood-rescue transport
